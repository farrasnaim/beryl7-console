<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Overview — Beryl 7</title>
<link rel="stylesheet" href="/os.css?v=f8e50663">
</head>
<body>
<div class="shell">
  <aside class="spine"></aside>
  <main class="main">
    <div class="topline"></div>

    <header class="head">
      <div>
        <h1 class="head__t">Overview</h1>
        <p class="head__s" id="subtitle">Reading the network…</p>
      </div>
    </header>

    <!-- Device-wide alarms only. Anything scoped to a single panel belongs in
         that panel; this is for conditions that make the rest of the page
         beside the point, which today means "there is no firewall". -->
    <div id="alerts"></div>
    <div id="jobs"></div>

    <!-- THE HERO: the network, drawn directly on the page. No container —
         the topology is the product, not a widget inside it. -->
    <div class="face--open">
      <div style="overflow-x:auto;scrollbar-width:none">
        <div id="topo" style="padding:8px 0 14px"></div>
      </div>
    </div>

    <!-- Clients before Radios: what is connected is the question this page is
         opened to answer; the radios are the equipment serving them. -->
    <div class="sect">
      <span class="sect__t">Clients</span>
      <span class="sect__m" id="cliCount"></span>
    </div>
    <div class="face">
      <section class="panel">
        <div class="panel__b panel__b--flush" id="clients">
          <div class="panel__b" style="padding:16px 24px"><div class="sk" style="width:70%"></div>
            <div class="sk" style="width:52%;margin-top:10px"></div>
            <div class="sk" style="width:61%;margin-top:10px"></div></div>
        </div>
      </section>
    </div>

    <!-- Diagnostics: quieter, contained, lower on the page. -->
    <div class="face">
      <div class="grid g-2-1">
        <section class="panel">
          <div class="panel__h">
            <span class="panel__t">Throughput</span>
            <div class="panel__aside"><span class="dim n" id="tpNow" style="font-size:10.5px"></span></div>
          </div>
          <div class="panel__b">
            <div id="ribbon"></div>
            <div class="cap"><span id="ribL"></span><span>UL above · DL below</span><span id="ribR"></span></div>

            <!-- Ping, loss and jitter are three readings of ONE measurement:
                 pingmon's 1-second probe, five minutes of which the router
                 keeps whether or not anything is watching. That is the point —
                 alt-tab out of a match, open this, and the bad minute is still
                 on screen. A browser-side ring could never do it, because the
                 console does not poll a hidden tab. -->
            <!-- The selector belongs to the Ping row and not to the panel
                 header, because Throughput does not depend on it at all — that
                 is WAN byte counters, every packet through the router. These
                 three strips are the only things aimed at a host, and the page
                 should say which host rather than presenting one path as a
                 fact about "your connection". -->
            <div class="rowsep"></div>
            <div class="metricrow">
              <span class="inline">
                <span class="ro__k">Ping</span>
                <!-- Options are built at load: the three built-ins, then the
                     saved addresses A-Z, then "Custom…" last, which is a way
                     out to Settings rather than a choice. -->
                <select id="probeSel" class="select select--inline" aria-label="What to probe"></select>
                <span class="ro__m" id="probeAddr"></span>
              </span>
              <span class="n" id="pingNow"></span>
            </div>
            <!-- "Custom…" is the one-off: type an address, look at it, move on.
                 "Add Custom IP" is for one worth keeping, and goes to Settings.
                 Two different intents, so two entries rather than one that
                 tries to be both. -->
            <div class="inline probecustom" id="probeCustom" hidden>
              <input id="probeIp" class="input input--inline" type="text" inputmode="decimal"
                     maxlength="15" spellcheck="false" autocomplete="off" placeholder="203.0.113.7">
              <button id="probeGo" class="btn btn--sm" type="button">Use</button>
            </div>
            <div class="ro__m probenote" id="probeNote" hidden></div>
            <div id="spark"></div>
            <div class="cap"><span id="spkL"></span><span id="spkM"></span><span id="spkR"></span></div>

            <!-- Jitter before loss: on a link that is mostly fine, jitter is
                 what moves first and what you feel first, and loss is the
                 rarer, louder event. Reading down the panel is then roughly
                 "how fast, how far, how steady, how reliable". -->
            <div class="rowsep"></div>
            <div class="metricrow"><span class="ro__k">Jitter</span><span id="jitState"></span></div>
            <div id="jitChart"></div>
            <div class="cap"><span id="jitL"></span><span id="jitM"></span><span id="jitR"></span></div>

            <div class="rowsep"></div>
            <div class="metricrow"><span class="ro__k">Packet loss</span><span id="lossState"></span></div>
            <div id="lossChart"></div>
            <div class="cap"><span id="lossL"></span><span id="lossM"></span><span id="lossR"></span></div>
          </div>
        </section>
        <section class="panel">
          <div class="panel__h"><span class="panel__t">System</span>
            <div class="panel__aside" id="sysChip"></div></div>
          <div class="panel__b" id="sys"></div>
        </section>
      </div>
    </div>

    <!-- Maintenance actions moved to Settings (2026-08-09): configuration
         lives there, observation lives here. Traffic today stays — it is a
         reading, and it earns the open slot Maintenance vacated. -->
    <div class="face">
      <section class="panel">
        <div class="panel__h">
          <span class="panel__t" id="trafTitle">Traffic today</span>
          <div class="panel__aside"><span class="row__cap" id="trafTotal"></span></div>
        </div>
        <div class="panel__b" id="traffic"></div>
      </section>
    </div>
  </main>
</div>
<nav class="mobilebar" aria-label="Sections"></nav>

<script src="/os.js?v=b21f8853"></script>
<script>
(function () {
'use strict';
var API = '/cgi-bin/dashboard-api';
var el = OS.el, $ = OS.$, clear = OS.clear, setTxt = OS.setTxt;
var LANNET = OS.LANNET, bandLabel = OS.bandLabel, netLabel = OS.netLabel;

OS.buildShell('/dashboard/');

var MQM = matchMedia('(max-width: 640px)');
if (MQM.addEventListener) MQM.addEventListener('change', function () { if (last) render(last); });
var expanded = {};      /* mac -> true, survives the poll re-render */
var radioOpen = {};     /* group key -> true, same idea for radio headings */
var advOpen  = {};      /* mac|band -> true, per-link radio fold     */
var last = null;

/* ------------------------------------------------------------ derivation --
   One pass over the payload builds the device model the whole page reads
   from. Doing this once per poll (instead of per widget) keeps the render
   cheap on a phone. */
function model(d) {
    var byMac = {}, macfilterBySec = {}, aps = d.aps || [];

    function ensure(mac) {
        mac = String(mac).toUpperCase();
        if (!byMac[mac]) {
            var cm = (d.classmap || {})[mac] || {};
            var h  = (d.hosts || {})[mac] || {};
            var L  = (d.leases || {})[mac] || null;
            byMac[mac] = {
                mac: mac,
                cls: cm.class || 'default',
                zone: cm.zone || '',
                name: cm.name || (L && L.name && L.name !== '*' ? L.name : null) ||
                      (h.name ? String(h.name).replace(/\.lan$/, '') : null) || mac,
                named: !!(cm.name),
                ip: cm.ip || (L && L.ip) || (h.ipaddrs && h.ipaddrs[0]) || '',
                ip6: (h.ip6addrs || []).slice(0, 2),
                host: h.name ? String(h.name).replace(/\.lan$/, '') : '',
                links: [], medium: 'idle', vpn: (d.vpn || {})[mac] || null,
                x: (d.sta || {})[mac] || {},
                neigh: (d.neigh || {})[mac] || '',
                blocked: []
            };
        }
        return byMac[mac];
    }

    aps.forEach(function (ap) {
        macfilterBySec[ap.section] = ap;
        var res = (ap.assoc && ap.assoc.results) || [];
        res.forEach(function (st) {
            var dv = ensure(st.mac);
            dv.links.push({
                band: ap.band === '5g' ? '5' : '2.4',
                ssid: (ap.info && ap.info.ssid) || '',
                section: ap.section,
                net: ap.network,
                chan: (ap.info && ap.info.channel) || 0,
                st: st
            });
        });
        /* a deny-list section with this MAC on it == blocked here */
        if (ap.macfilter === 'deny') {
            (ap.maclist || []).forEach(function (m) {
                var dv = ensure(m);
                dv.blocked.push({ section: ap.section, ssid: (ap.info && ap.info.ssid) || ap.section });
            });
        }
    });
    (d.wired || []).forEach(function (w) {
        var dv = ensure(w.mac);
        if (!dv.ip && w.ip) dv.ip = w.ip;
        dv.wiredLink = w.link;
        dv.port = w.port || '';
        dv.portSpeed = +w.speed || 0;
        dv.portDuplex = w.duplex || '';
    });

    var out = [];
    Object.keys(byMac).forEach(function (m) {
        var dv = byMac[m];
        if (dv.links.length) {
            /* strongest link decides the medium the device is filed under */
            dv.links.sort(function (a, b) { return (b.st.signal || -99) - (a.st.signal || -99); });
            dv.medium = dv.links[0].band === '5' ? '5' : '2.4';
            dv.signal = dv.links[0].st.signal;
            dv.idleMs = Math.min.apply(null, dv.links.map(function (l) { return +l.st.inactive || 0; }));
        } else if (dv.wiredLink === 'wired') {
            dv.medium = 'eth';
        } else if (dv.blocked.length && !dv.wiredLink) {
            dv.medium = 'blocked';
        } else {
            dv.medium = 'idle';
        }
        out.push(dv);
    });

    /* traffic + connection counts, keyed differently by each source */
    var nl = d.nlbw;
    if (nl && nl.columns && nl.data) {
        var ci = {}; nl.columns.forEach(function (c, i) { ci[c] = i; });
        nl.data.forEach(function (r) {
            var mac = String(r[ci.mac] || '').toUpperCase();
            if (byMac[mac]) byMac[mac].traffic = {
                dn: +r[ci.rx_bytes] || 0, up: +r[ci.tx_bytes] || 0, conns: +r[ci.conns] || 0
            };
        });
    }
    out.forEach(function (dv) {
        dv.gen = dv.links.length
            ? Math.max.apply(null, dv.links.map(function (l) { return OS.genOf(l.st); }))
            : 0;
    });
    /* Which heading a device files under. Deliberately separate from .medium,
       which still says how it is attached (5 / 2.4 / eth) and drives the
       signal, band and generation columns — an IoT plug is still a 2.4 GHz
       Wi-Fi 4 client and should render as one.
       The split is by NETWORK, not by band: smart-home devices sit on their own
       network in their own firewall zone, while a watch may be on the main LAN
       and merely happen to use 2.4 GHz. Filing them together hid a real
       boundary.
       blocked/idle win, since "not connected" outranks where it would sit. */
    out.forEach(function (dv) {
        /* WHERE THE DEVICE ACTUALLY IS beats where the class map says it is.
           `zone` used to come from the class map alone, which is a manual
           annotation: a guest device nobody had annotated read as zoneless and
           filed under its BAND, mixed in with the main network - the exact
           boundary this grouping exists to show. The AP a client is associated
           with is a live fact and settles it. The class map still answers for
           devices with no association at all, which is the only case left where
           nothing else can. */
        if (dv.links.length && dv.links[0].net) {
            dv.zone = (dv.links[0].net === LANNET) ? '' : dv.links[0].net;
        }
    });
    out.forEach(function (dv) {
        /* The group IS the zone name for anything off the primary network.
           It used to be the literal 'iot' for every such device, which was
           right while IoT was the only other network and wrong the moment a
           guest network existed: guests and smart plugs would have been piled
           under one heading called "IoT", hiding the boundary this split was
           added to show in the first place. */
        dv.group = (dv.medium === 'idle' || dv.medium === 'blocked') ? dv.medium
                 : (dv.zone && dv.zone !== LANNET) ? dv.zone
                 : dv.medium;
    });
    /* How many hosts sit behind each wired bridge port. One means the port's
       negotiated speed IS that host's link. More than one means a switch is in
       between, and the figure is the trunk — reported as such rather than
       presented as the device's own. */
    var portN = {};
    out.forEach(function (dv) { if (dv.port) portN[dv.port] = (portN[dv.port] || 0) + 1; });
    out.forEach(function (dv) { if (dv.port) dv.portPeers = portN[dv.port]; });

    /* within a band: newest Wi-Fi generation first, then name A-Z */
    /* Ethernet and the two LAN bands first, then every other network in name
       order, then the two states that mean "not here". An unknown group scores
       3 so a new network lands in the zone band rather than at either end. */
    /* Ethernet and the two LAN bands first, then the other networks in the
       order OS.netRank fixes - guest before IoT - then the two states that mean
       "not here". A group not in this map is a network, and scores 3 so it lands
       in that band; OS.netCmp then orders the band. */
    var order = { eth: 0, '5': 1, '2.4': 2, blocked: 4, idle: 5 };
    function rank(g) { return order[g] === undefined ? 3 : order[g]; }
    out.sort(function (a, b) {
        if (rank(a.group) !== rank(b.group)) return rank(a.group) - rank(b.group);
        if (rank(a.group) === 3 && a.group !== b.group) return OS.netCmp(a.group, b.group);
        if (a.gen !== b.gen) return b.gen - a.gen;
        return a.name.localeCompare(b.name);
    });
    return { devices: out, aps: aps };
}

/* ------------------------------------------------------------- topology -- */
var UPNAME = { wan: 'Ethernet', wwan: 'Wi-Fi', tethering: 'USB', none: 'None' };

function renderTopo(d, M) {
    var box = $('#topo'); clear(box);
    var up = (d.uplink && d.uplink.active) || 'none';
    var online = up !== 'none';
    /* Decided by dashboard-api from the WAN route and a FIXED reachability
       probe, never from the selectable target — aiming the probe at a game
       server that drops ICMP must not black out the hero panel. */
    var reachable = d.probe ? d.probe.online !== false : true;
    var rx = (d.wan && d.wan.rx_rate) || 0, tx = (d.wan && d.wan.tx_rate) || 0;
    var flowing = online && (rx + tx) > 2048;
    var vpnCount = Object.keys(d.vpn || {}).length;
    var staleVpn = (d.vpn_stale || []).length;
    var clients = M.devices.filter(function (v) { return v.medium !== 'idle' && v.medium !== 'blocked'; }).length;

    var sy = d.sys || {}, ld = parseFloat(sy.load) || 0;
    var memF = sy.mem_total ? (sy.mem_total - sy.mem_avail) / sy.mem_total : 0;
    var tC = sy.temp ? sy.temp / 1000 : 0;
    var health = (tC > 85 || memF > 0.9 || ld > 4) ? ['Degraded', 'bad']
               : (tC > 75 || memF > 0.75 || ld > 2.8) ? ['Warm', 'warn'] : ['Nominal', null];

    /* Lane activity: ONE rule for every lane — its own netdev moved more than
       2 KB/s since the last poll, the same threshold `flowing` uses for the
       WAN. Previously each lane answered this differently (station idle time /
       hardcoded false / "a wired device exists"), so Ethernet dashed
       permanently and IoT never could. Deltas are kept across renders so
       re-rendering the same payload does not blank the flow. */
    var lb = d.lanebytes || {};
    if (renderTopo.lb && d.ts > renderTopo.lbT) {
        var dt = d.ts - renderTopo.lbT, prev = renderTopo.lb, out = {};
        Object.keys(lb).forEach(function (k) {
            var p = prev[k];
            out[k] = (p != null && lb[k] >= p) ? ((lb[k] - p) / dt) > 2048 : false;
        });
        renderTopo.act = out;
    }
    if (!renderTopo.lb || d.ts > renderTopo.lbT) { renderTopo.lb = lb; renderTopo.lbT = d.ts; }
    var act = renderTopo.act || {};

    var lanes = [];
    M.aps.forEach(function (ap) {
        if (ap.network !== LANNET) return;
        var cnt = ((ap.assoc && ap.assoc.results) || []).length;
        lanes.push({ name: bandLabel(ap.band), clients: cnt, active: !!act[ap.ifname] });
    });
    /* Any SSID on a network other than the primary one gets its own lane,
       grouped by that network: an IoT SSID here, a guest SSID on another
       router, none at all on a plain one. Nothing is named in advance. */
    var extra = {}, extraOrder = [];
    M.aps.forEach(function (ap) {
        if (ap.network === LANNET) return;
        var k = ap.network || 'other';
        if (!extra[k]) { extra[k] = { clients: 0, active: false }; extraOrder.push(k); }
        extra[k].clients += ((ap.assoc && ap.assoc.results) || []).length;
        if (act[ap.ifname]) extra[k].active = true;
    });
    /* Same order as every other surface: guest before IoT, not uci order. */
    extraOrder.sort(OS.netCmp);
    extraOrder.forEach(function (k) {
        /* THE NETWORK'S NAME, and nothing else. The band belongs on the two LAN
           lanes because there it IS the identity - they are the same network
           split by radio. On a named network it is a detail, and naming it was
           actively wrong once: the label took whichever access point was seen
           first, so a network on both radios was labelled with half of itself. */
        lanes.push({ name: netLabel(k), clients: extra[k].clients,
                     active: extra[k].active });
    });
    var ethN = M.devices.filter(function (v) { return v.medium === 'eth'; }).length;
    lanes.push({ name: 'Ethernet', clients: ethN, active: !!act.wired });

    var vpnLabel = '';
    if (vpnCount) {
        var names = {}; Object.keys(d.vpn).forEach(function (k) { names[d.vpn[k]] = 1; });
        var tn = Object.keys(names).join(', ');
        vpnLabel = vpnCount + (vpnCount === 1 ? ' device via ' : ' devices via ') + tn;
    }

    box.appendChild(OS.topology({
        online: online && reachable,
        flowing: flowing,
        /* Only when it is bad news, and only when it is bad news about the
           LINK. A chosen target that never answers is silent, not unreachable,
           so it must not put "not responding" on the hero panel — that is what
           the note under the selector is for. */
        latency: reachable ? '' : 'not responding',
        uplink: UPNAME[up] || up,
        uplinkSub: (d.wan && d.wan.ip) || 'no address',
        router: sy.host || 'Beryl 7',
        routerSub: health[0] === 'Nominal'
            ? 'up ' + OS.dur(sy.uptime || 0) : health[0].toLowerCase() + ' · ' + ld.toFixed(2) + ' load',
        lanes: lanes,
        vpn: vpnCount > 0,
        vpnUp: vpnCount > 0 && !staleVpn,
        vpnLabel: vpnLabel
    }, MQM.matches));

    /* Rail mirrors the same truth. Internet and Router are no longer rows.
       For Wi-Fi in / USB in this page only knows whether they CARRY the route —
       it cannot see "plugged in but on standby" — so when they are not carrying
       it passes null and the row keeps its descriptor instead of asserting a
       state this payload cannot support. */
    OS.stage('source', UPNAME[up] || up, online ? 'live' : 'fault');
    OS.stage('routing', OS.routingLabel(d.tunnels_up || 0, d.tunnels_total || 0, vpnCount),
             staleVpn ? 'fault' : vpnCount ? 'live' : '');
    OS.stage('clients', clients + (clients === 1 ? ' device' : ' devices'), 'live');
    OS.stage('repeater', up === 'wwan' ? 'Carrying the uplink' : null,
             up === 'wwan' ? 'live' : '');
    OS.stage('tether', up === 'tethering' ? 'Carrying the uplink' : null,
             up === 'tethering' ? 'live' : '');
    OS.flagTab('/vpn/', !!staleVpn);

    /* "routed through a tunnel" is a claim about where traffic actually goes, so
       it must not be made for a device whose tunnel is not carrying it. Saying it
       anyway is worse than saying nothing: it is the sentence someone reads to
       reassure themselves before using an untrusted network. */
    setTxt($('#subtitle'), online
        ? 'Online via the ' + (UPNAME[up] || up) + ' uplink. ' + clients +
          ' device' + (clients === 1 ? '' : 's') + ' connected' +
          (vpnCount
            ? ', ' + vpnCount + ' routed through a tunnel' +
              (staleVpn ? ' — ' + staleVpn + ' not actually reaching it.' : '.')
            : '.')
        : 'No route to the internet. Check the Wi-Fi or USB uplink.');
}

/* -------------------------------------------------------------- readouts - */
/* ------------------------------------------------------------ throughput --
   The ribbon is the only thing on this page that changes second to second, so
   it gets its own counters-only endpoint at 1s while the 5s poll keeps owning
   everything else. Measured on this router: 8.5ms of CPU per rate-api call
   against dashboard-api's 435ms, i.e. ~0.2% of the four cores instead of 7.5%.
   The delta is computed HERE, from the router's monotonic uptime, so there is
   no whole-second rounding and two open tabs cannot corrupt each other. */
var RATE_API = '/cgi-bin/rate-api';
var FAST_MS = 1000;          /* sample period while the session is active */
var IDLE_MS = 5000;          /* ... and after that, still sampling, slower */
var FAST_WINDOW = 300000;    /* 5 minutes, renewed by any interaction     */
var RING_MAX = 300;          /* 5 min at 1s, and the ribbon is 300px wide */
var ring = { t: [], dn: [], up: [] };
var rPrev = null, fastTimer = null, fastBusy = false, activeUntil = 0;
/* Explicit "the 1s sampler is running" flag. It cannot be inferred from
   fastTimer/fastBusy: pushSample runs from inside the fetch callback, at the
   one moment when fastBusy is already false and fastTimer is not yet
   rescheduled — so both read false while sampling is very much alive. */
var fastOn = false;
/* pingmon's 5-minute ring, on a fixed 1s pitch: v[i] is the second at
   t - (n-1-i). Positive is a round-trip, -1 was probed and got no reply, -2 is
   a second before the prober was running. Unlike the throughput ring above,
   this one is NOT built here — it arrives already five minutes long, which is
   the whole reason it lives on the router, and it arrives on the 1s poll, so
   the charts advance a second at a time rather than in five-second jumps. */
var pingRing = { t: 0, n: 0, v: [] };

function pushSample(dn, up) {
    ring.dn.push(dn); ring.up.push(up); ring.t.push(Date.now());
    if (ring.dn.length > RING_MAX) {
        ring.dn.shift(); ring.up.shift(); ring.t.shift();
    }
    drawRibbon();
}

/* Eased vertical scales for the two charts.
   Both used to re-derive their scale from whatever happened to be in the ring,
   so a spike ageing out re-scaled the entire trace in a single frame — read as
   the whole graph "twitching" once a second. These follow the target instead.
   Rising is near-immediate so a real burst is never clipped or under-drawn;
   falling is slow, because that is the case that produced the jump.
   A null resets, so switching between the 1s and 5s sources does not drag one
   window's scale into the other's. */
var scaleY = { peak: null, lo: null, hi: null, lossHi: null, jitHi: null };
function ease(cur, target, upRate, downRate) {
    if (cur == null || !isFinite(cur)) return target;
    var k = target > cur ? upRate : downRate;
    var next = cur + (target - cur) * k;
    return Math.abs(target - next) < Math.abs(target) * 0.001 ? target : next;
}

function drawRibbon() {
    var rb = $('#ribbon'); clear(rb);
    var n = ring.dn.length;
    if (n > 1) {
        /* the target scale, derived here rather than by building the chart
           twice — this runs once a second */
        var rawPeak = 1;
        for (var q = 0; q < n; q++) {
            if (ring.dn[q] > rawPeak) rawPeak = ring.dn[q];
            if (ring.up[q] > rawPeak) rawPeak = ring.up[q];
        }
        scaleY.peak = ease(scaleY.peak, rawPeak, 0.9, 0.12);
        var g = OS.ribbon(ring.dn, ring.up, 84, scaleY.peak);
        rb.appendChild(g);
        /* the LABEL reports the real peak in the window, never the eased
           drawing scale — the caption is a reading, only the geometry is
           smoothed */
        var pk = OS.brate(rawPeak);
        /* the left edge is the OLDEST sample, so label the span the chart
           actually covers — which also makes the 1s/5s switch self-evident */
        setTxt($('#ribL'), 'last ' + OS.dur((ring.t[n - 1] - ring.t[0]) / 1000));
        setTxt($('#ribR'), 'peak ' + pk[0] + ' ' + pk[1]);
    } else {
        var ph = el('div'); ph.style.cssText = 'height:84px;display:grid;place-items:center';
        ph.appendChild(el('div', 'dim', 'collecting…'));
        ph.firstChild.style.fontSize = '11px';
        rb.appendChild(ph);
        setTxt($('#ribL'), ''); setTxt($('#ribR'), '');
    }
    var cur = OS.brate(n ? ring.dn[n - 1] : 0), cu = OS.brate(n ? ring.up[n - 1] : 0);
    setTxt($('#tpNow'), '↓ ' + cur[0] + ' ' + cur[1] + '   ↑ ' + cu[0] + ' ' + cu[1]);
}

/* ----------------------------------------- ping · packet loss · jitter --
   Three readings of ONE measurement. pingmon probes 1.1.1.1 once a second and
   the router keeps the last five minutes, so all three charts are already five
   minutes long the moment the page opens — which is the point. The old design
   built the latency trace in the browser, and a browser ring is empty exactly
   when it is wanted: the console does not poll a hidden tab, so alt-tabbing out
   of a game and back destroyed the very window worth looking at.

   HONEST LIMITS, because a gamer will draw conclusions from this: these are
   ICMP probes from the ROUTER to 1.1.1.1. They are not the path to a Valorant
   or CS2 server, and some networks deprioritise ICMP, so a clean reading here
   does not prove a clean game. The reverse IS proven — if this shows loss or
   jitter, it is at or beyond the uplink, and nothing on the PC will fix it. */

/* Loss and jitter are properties of a STRETCH of samples, not of one: a single
   second is either lost or it isn't, and jitter needs two replies to exist at
   all. 15s is short enough to place a burst on the timeline and long enough
   that one packet does not spike the whole trace. */
var ROLL = 15;
/* The first few windows are SHORT rather than absent. Refusing to report until
   a full 15 samples existed left the loss and jitter traces starting 5% in,
   visibly narrower than the throughput and ping charts above them on the same
   grid. A partial window is a real measurement of a real stretch — it just
   averages fewer samples — so the only thing worth suppressing is the very
   start, where one or two samples would make the left edge spike between 0 and
   100% on a single lost packet. */
var ROLL_MIN = 5;
function rollSeries(v, fn) {
    var out = [], i;
    for (i = 0; i < v.length; i++) {
        out.push(i < ROLL_MIN - 1 ? null : fn(v, Math.max(0, i - ROLL + 1), i));
    }
    return out;
}
/* Three values are not measurements and must never be counted as loss:
     -1  probed, no reply                     <- this one IS loss
     -2  never probed (prober younger than the window, or stopped)
     -3  the target changed here; the trace breaks rather than spanning it
   Counting -2 would report a freshly booted router as 100% down, and counting
   -3 would invent a lost packet out of every failover. */
function winLoss(v, a, b) {
    var probed = 0, lost = 0, i;
    for (i = a; i <= b; i++) {
        if (v[i] === -2 || v[i] === -3) continue;
        probed++;
        if (v[i] < 0) lost++;
    }
    return probed ? lost * 100 / probed : null;
}
/* Mean absolute change between CONSECUTIVE replies. A loss breaks the chain
   rather than being spanned, so a gap cannot masquerade as one huge swing. */
function winJitter(v, a, b) {
    var prev = -1, s = 0, n = 0, i, x;
    for (i = a; i <= b; i++) {
        x = v[i];
        if (x < 0) { prev = -1; continue; }
        if (prev >= 0) { s += Math.abs(x - prev); n++; }
        prev = x;
    }
    return n ? s / n : null;
}
function mean(a) {
    if (!a.length) return null;
    var s = 0, i;
    for (i = 0; i < a.length; i++) s += a[i];
    return s / a.length;
}
/* One decimal below 10, whole numbers above — at 34% the tenth is noise. */
function fine(p) { return p >= 10 ? Math.round(p) : Math.round(p * 10) / 10; }
/* Loss and jitter are pinned to zero at the bottom rather than floating their
   own baseline: a clean trace drawn halfway up the box reads as "some loss" at
   a glance. But zero exactly ON the floor reads as a divider rule, not as a
   measurement — so the axis gets a little headroom underneath and a flat zero
   sits just above the edge, visibly plotted. */
function floorRange(hi) { return [-hi * 0.08, hi]; }

/* 1% is where a tick-based shooter starts to feel loss. Below that but non-zero
   still earns a word, because the useful signal is "it stopped being zero".
   `any` is a COUNT, not the percentage: 1 lost packet in 3000 rounds to 0.0% and
   must still not read CLEAN. The percentage passed in is the one already rounded
   for display, so the word can never disagree with the number beside it. */
function lossTone(shownPct, any) {
    if (!any) return ['CLEAN', 'ok'];
    if (shownPct < 1) return ['PATCHY', 'warn'];
    return ['LOSSY', 'bad'];
}
/* Jitter is what causes the rubber-banding you feel before you ever see a loss
   figure. Under ~5ms is invisible; past ~15ms a 64-tick server is reordering
   your inputs. */
function jitTone(ms) {
    if (ms <= 5)  return ['STEADY',  'ok'];
    if (ms <= 15) return ['UNEVEN',  'warn'];
    return ['ERRATIC', 'bad'];
}

function drawPing() {
    var sp = $('#spark'); if (!sp) return;
    var v = pingRing.v;
    var ok = [], i;
    for (i = 0; i < v.length; i++) if (v[i] > 0) ok.push(v[i]);

    clear(sp);
    /* Eased on both ends. Latency sits in a narrow band, so an outlier arriving
       or leaving used to re-scale the whole trace and make a flat line lurch. */
    if (ok.length > 1) {
        var lo = Math.min.apply(null, ok), hi = Math.max.apply(null, ok);
        if (hi - lo < 4) { var c = (hi + lo) / 2; lo = c - 2; hi = c + 2; }
        scaleY.lo = ease(scaleY.lo, lo, 0.35, 0.35);
        scaleY.hi = ease(scaleY.hi, hi, 0.9, 0.12);
    } else {
        scaleY.lo = scaleY.hi = null;
    }
    sp.appendChild(OS.spark(v, 46,
        (scaleY.lo != null && scaleY.hi != null) ? [scaleY.lo, scaleY.hi] : null));
    sp.title = 'round-trip to 1.1.1.1, once a second';

    setTxt($('#spkL'), ok.length ? 'last ' + OS.dur(v.length) : 'collecting…');
    setTxt($('#spkM'), '');
    setTxt($('#spkR'), ok.length ? 'avg ' + fine(mean(ok)) + ' ms' : '');
    setTxt($('#pingNow'), ok.length ? fine(ok[ok.length - 1]) + ' ms' : '—');
}

function drawLoss() {
    var st = $('#lossState'), box = $('#lossChart'); if (!st || !box) return;
    var v = pingRing.v;
    var probed = 0, lost = 0, i;
    for (i = 0; i < v.length; i++) {
        if (v[i] === -2 || v[i] === -3) continue;
        probed++;
        if (v[i] < 0) lost++;
    }
    var pct = probed ? lost * 100 / probed : null;

    clear(st);
    if (pct == null) {
        st.appendChild(OS.stateWord('NO DATA', 'idle'));
    } else {
        var w = lossTone(fine(pct), lost);
        st.appendChild(OS.stateWord(w[0], w[1]));
    }

    var series = rollSeries(v, winLoss);
    var peak = 0;
    for (i = 0; i < series.length; i++) if (series[i] > peak) peak = series[i];
    /* Pinned to zero at the bottom, unlike the ping chart: a loss trace that
       floats its own baseline would draw a perfectly clean line halfway up the
       box, which reads as "some loss" at a glance. */
    scaleY.lossHi = ease(scaleY.lossHi, Math.max(peak, 5), 0.9, 0.06);
    clear(box);
    box.appendChild(OS.spark(series, 34, floorRange(scaleY.lossHi)));
    box.title = 'share of the last ' + ROLL + ' probes that got no reply';

    /* "now" is the rightmost point of the chart above, not a separate figure —
       the same trailing window, so the number and the end of the trace can
       never disagree. */
    var nowPct = winLoss(v, Math.max(0, v.length - ROLL), v.length - 1);
    setTxt($('#lossL'), probed ? lost + ' of ' + probed + ' probes' : '');
    setTxt($('#lossM'), nowPct == null ? '' : 'now ' + fine(nowPct) + '%');
    setTxt($('#lossR'), probed ? fine(pct) + '% over 5 min' : '');
}

function drawJitter() {
    var st = $('#jitState'), box = $('#jitChart'); if (!st || !box) return;
    var v = pingRing.v;
    var now = winJitter(v, 0, v.length - 1);

    clear(st);
    if (now == null) {
        st.appendChild(OS.stateWord('NO DATA', 'idle'));
    } else {
        var w = jitTone(now);
        st.appendChild(OS.stateWord(w[0], w[1]));
    }

    var series = rollSeries(v, winJitter);
    var peak = 0, i;
    for (i = 0; i < series.length; i++) if (series[i] > peak) peak = series[i];
    scaleY.jitHi = ease(scaleY.jitHi, Math.max(peak, 2), 0.9, 0.06);
    clear(box);
    box.appendChild(OS.spark(series, 34, floorRange(scaleY.jitHi)));
    box.title = 'mean change between consecutive replies, over ' + ROLL + ' probes';

    /* Same trailing window as the right-hand end of the trace, so the live
       figure and the chart cannot tell different stories. The 5-minute mean
       moves to the middle: it is the context, not the reading. */
    var nowJit = winJitter(v, Math.max(0, v.length - ROLL), v.length - 1);
    setTxt($('#jitL'), now != null ? 'avg ' + fine(now) + ' ms' : '');
    setTxt($('#jitM'), nowJit == null ? '' : 'now ' + fine(nowJit) + ' ms');
    setTxt($('#jitR'), peak ? 'peak ' + fine(peak) + ' ms' : '');
}

/* ------------------------------------------------------- the probe target --
   The router owns this, not the browser: one prober serves every client, so
   changing it here changes it for the phone in your pocket too. That is the
   correct behaviour — they are all reading the same ring — but it makes this a
   router setting rather than a view filter, which is why it POSTs.

   The dropdown shows what is LIVE, not what was last requested. Cloudflare and
   Google are a symmetric pair: whichever is answering is the one you are on,
   and an automatic switch moves the dropdown with it and says why. Anything
   else would leave the control disagreeing with the chart under it. */
var PROBE_API = '/cgi-bin/probe-api';
var probeBusy = false;
var savedTargets = [];
/* Its own flag rather than a function of the select's value: "Custom is
   selected" and "you are typing an address" are different states, and after a
   successful submit the first is still true while the second is not. */
var customOpen = false;
function showCustom(on) { customOpen = on; $('#probeCustom').hidden = !on; }

/* Built once at load, because the saved list only changes on the Settings page
   and getting here means a full page load anyway.
   Order: the three built-ins in their own meaningful order — the default
   first, and the failover pair kept together — then the saved addresses A-Z,
   then "Custom…" last. That final entry is not a choice, it is the way to
   Settings, which is why it sits below everything selectable. */
function buildProbeOptions() {
    var sel = $('#probeSel'); if (!sel) return;
    var keep = sel.value;
    clear(sel);
    function opt(v, t) { var o = el('option', null, t); o.value = v; sel.appendChild(o); return o; }
    opt('cf', 'Cloudflare');
    opt('google', 'Google');
    opt('gw', 'Gateway');
    savedTargets.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
        .forEach(function (t) { opt('ip:' + t.ip, t.name); });
    opt('custom', 'Custom…');
    opt('manage', 'Add Custom IP');
    if (keep) sel.value = keep;
}

function loadProbeTargets() {
    fetch(PROBE_API + '?action=list', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) { if (j && j.ok) { savedTargets = j.targets || []; buildProbeOptions(); paintProbe(); } })
        .catch(function () { /* the built-ins still work */ });
}

function paintProbe() {
    var sel = $('#probeSel'); if (!sel) return;
    /* What the router is live on, expressed as an option value. */
    var want = pingRing.sel === 'custom' ? 'ip:' + pingRing.target : pingRing.sel;
    /* A live address that is not in the saved list — it was removed while it
       was being probed. Removing a shortcut deliberately does not change what
       is being measured, so the control has to be able to say "this one",
       and a transient entry is more honest than snapping to something else. */
    if (pingRing.sel === 'custom' && pingRing.target &&
        !sel.querySelector('option[value="' + want + '"]')) {
        var o = el('option', null, pingRing.target + '  (not saved)');
        o.value = want;
        /* above "Custom…" and "Add Custom IP", which are actions and belong
           under everything that is actually a target */
        sel.insertBefore(o, sel.querySelector('option[value="custom"]'));
    }
    /* never yank the control out from under someone who has it open, and never
       while the address field is up waiting for one to be typed */
    if (!probeBusy && !customOpen && document.activeElement !== sel &&
        want && sel.value !== want) {
        sel.value = want;
    }
    setTxt($('#probeAddr'), pingRing.target || '');
    $('#probeCustom').hidden = !customOpen;

    /* A target that has never answered is a fact about the TARGET — most game
       servers drop ICMP outright — and saying so is very different from
       claiming the connection is broken. */
    var msg = pingRing.note ||
              (pingRing.state === 'silent' ? 'this address does not answer pings' : '');
    var note = $('#probeNote');
    setTxt(note, msg);
    note.hidden = !msg;
}

function setProbe(sel, ip) {
    probeBusy = true;
    /* action named EXPLICITLY. This body used to carry no action at all and
       leaned on probe-api treating an absent action as set - the write action.
       The 2026-09-01 review removed that inverted default believing nothing
       depended on it; this call did, and the dropdown answered every change
       with "unknown action" until the action was spelled out here. */
    var body = 'action=set&sel=' + encodeURIComponent(sel) + (ip ? '&ip=' + encodeURIComponent(ip) : '');
    fetch(PROBE_API, {
        method: 'POST', cache: 'no-store',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
    })
        .then(function (r) { return r.json(); })
        .then(function (j) {
            probeBusy = false;
            if (!j || !j.ok) {
                OS.toast((j && j.error) || 'could not change the probe target', 'bad');
                paintProbe();
                return;
            }
            showCustom(false);
            /* Said out loud because it is not obvious: the five minutes on
               screen measured a different path and cannot be carried over. */
            OS.toast('Now probing ' + (ip || (sel === 'gw' ? 'the gateway' : sel)) +
                     ' — the five-minute history starts again', 'ok');
        })
        .catch(function () {
            probeBusy = false;
            OS.toast('could not reach the router', 'bad');
        });
}

function drawProbe() { drawPing(); drawLoss(); drawJitter(); paintProbe(); }

function fastTick() {
    fastTimer = null;
    if (document.visibilityState !== 'visible') { fastStop(); return; }
    /* Going idle slows this down, it does NOT stop it. The probe charts are
       drawn from this endpoint, and the whole point of them is being able to
       leave the page open during a match and look over at it — which is exactly
       the situation with no clicks in it for five minutes. At 20ms a call the
       idle rate costs 0.4% of one core. */
    fastOn = true;
    if (fastBusy) { fastTimer = setTimeout(fastTick, tickMs()); return; }
    fastBusy = true;
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var killer = setTimeout(function () { if (ctl) ctl.abort(); }, 4000);
    fetch(RATE_API, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
        .then(function (r) { return r.json(); })
        .then(function (j) {
            clearTimeout(killer); fastBusy = false;
            if (j && j.ok) {
                /* discard the delta across a reboot (uptime resets), an uplink
                   change (different counters) or a counter wrap */
                if (rPrev && rPrev.dev === j.dev && j.up > rPrev.up &&
                    j.rx >= rPrev.rx && j.tx >= rPrev.tx) {
                    var s = j.up - rPrev.up;
                    pushSample((j.rx - rPrev.rx) / s, (j.tx - rPrev.tx) / s);
                }
                rPrev = j;
                /* The probe ring, once a second — the charts advance a sample
                   at a time rather than jumping five. rate-api reads it off
                   pingmon rather than probing, so every open tab is drawing the
                   identical samples instead of its own. */
                if (j.ring && j.ring.v) { pingRing = j.ring; drawProbe(); }
                setTxt($('#pingNow'), j.ping == null ? 'no reply' : fine(j.ping) + ' ms');
                if (lastSys && j.load != null) {
                    lastSys.load = j.load;
                    lastSys.temp = j.temp;
                    lastSys.fan_rpm = j.fan;
                    lastSys.mem_total = j.memt;
                    lastSys.mem_avail = j.mema;
                    lastSys.uptime = j.up;
                    paintSys(lastSys);
                }
            }
            fastTimer = setTimeout(fastTick, tickMs());
        })
        .catch(function () {
            clearTimeout(killer); fastBusy = false;
            /* the 5s poll owns link state and reports its own errors; a missed
               sample here is worth a longer gap, not a toast */
            rPrev = null;
            fastTimer = setTimeout(fastTick, tickMs() * 3);
        });
}
function tickMs() { return Date.now() < activeUntil ? FAST_MS : IDLE_MS; }
function fastStart() {
    activeUntil = Date.now() + FAST_WINDOW;
    if (!fastTimer && !fastBusy && document.visibilityState === 'visible') {
        fastOn = true;
        scaleY.peak = null;
        fastTimer = setTimeout(fastTick, 0);
    }
}
function fastStop() {
    /* Only ever on a hidden tab now. The throughput ring is this session's and
       its scale resets; the probe ring is the router's five minutes and is
       left alone, which is why it is all still there on the way back. */
    clearTimeout(fastTimer); fastTimer = null; rPrev = null; fastOn = false;
    scaleY.peak = null;
}

/* System is fed by whichever source is currently fresher: the 1s sampler while
   the session is live, the 5s poll otherwise. rate-api reports these in the
   same units as dashboard-api so they merge without conversion. */
var lastSys = null;
function renderSys(d) {
    lastSys = d.sys || {};
    paintSys(lastSys);
}
function paintSys(sys) {
    var box = $('#sys'); if (!box) return;
    sys = sys || {};
    var load = parseFloat(sys.load) || 0;
    var cores = 4;
    var memUsed = (sys.mem_total || 0) - (sys.mem_avail || 0);
    var memPct = sys.mem_total ? memUsed / sys.mem_total : 0;
    var t = sys.temp ? sys.temp / 1000 : 0;

    /* Built once, then updated in place. .meter i already carries a background
       transition, but tearing the panel down and rebuilding it every second
       meant every segment was a brand-new element starting at its final value,
       so the transition never had an old state to run from and the bars
       stepped. Reusing the nodes is what makes them fade. */
    function bar(label, valTxt, frac, tone, meta) {
        var r = box._bars && box._bars[label];
        if (!r) {
            r = el('div'); r.style.marginBottom = '14px';
            var top = el('div'); top.style.cssText = 'display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px';
            top.appendChild(el('span', 'ro__k', label));
            r._val = el('span', 'n'); r._val.style.fontSize = '12px';
            top.appendChild(r._val);
            r.appendChild(top);
            r._meter = OS.meter(0, null, true);
            r.appendChild(r._meter);
            r._meta = el('div', 'ro__m'); r._meta.style.marginTop = '5px';
            r.appendChild(r._meta);
            box.appendChild(r);
            (box._bars = box._bars || {})[label] = r;
        }
        setTxt(r._val, valTxt);
        setTxt(r._meta, meta || '');
        r._meta.hidden = !meta;
        OS.meterSet(r._meter, frac, tone);
    }
    /* Reads as a percentage of everything this router has, which is the
       question actually being asked - "how much of it is in use". The verdict
       under the bar is deliberately three words or fewer: it is a status, not
       an explanation, and the other bars here do not narrate either.

       Rounded to whole percent with no decimal on purpose. Load average counts
       work WAITING as well as work running, so it indicates pressure well and
       utilisation only roughly; a decimal place would dress that up as
       precision it does not have. Above 100% is shown as-is rather than
       clamped - "140%" is the honest reading when more work is queued than
       there are cores to run it. */
    var perCore = cores ? load / cores : 0;
    bar('CPU', Math.round(perCore * 100) + '%',
        Math.min(1, perCore),
        perCore >= 1 ? 'bad' : perCore > 0.7 ? 'warn' : 'ok',
        perCore >= 1 ? 'Overloaded'
            : perCore > 0.7 ? 'Working hard'
            : perCore > 0.25 ? 'Comfortable'
            : 'Plenty of headroom');
    bar('Temperature', (t ? t.toFixed(1) : '—') + ' °C', Math.min(1, t / 100),
        t > 85 ? 'bad' : t > 75 ? 'warn' : 'ok',
        sys.fan_rpm ? 'fan at ' + sys.fan_rpm + ' rpm' : 'fan idle');
    bar('Memory', Math.round(memUsed / 1024) + ' / ' + Math.round((sys.mem_total || 0) / 1024) + ' MB',
        memPct, memPct > 0.9 ? 'bad' : memPct > 0.75 ? 'warn' : 'ok',
        Math.round((sys.mem_avail || 0) / 1024) + ' MB available');
    /* Flash, not RAM. Everything uci commits and every installed package lands
       on the overlay, and when it fills, writes start failing in ways that look
       like unrelated bugs. The Memory bar above says nothing about it. */
    var ovlPct = sys.ovl_total ? (sys.ovl_used || 0) / sys.ovl_total : 0;
    if (sys.ovl_total) {
        bar('Storage', Math.round((sys.ovl_used || 0) / 1024) + ' / ' +
                       Math.round(sys.ovl_total / 1024) + ' MB',
            ovlPct, ovlPct > 0.9 ? 'bad' : ovlPct > 0.75 ? 'warn' : 'ok',
            Math.round((sys.ovl_total - (sys.ovl_used || 0)) / 1024) + ' MB free');
    }

    /* Plain label/value rows, built once and then updated in place like the
       bars above — three near-identical copies of this markup had already
       accumulated before there was a fourth. */
    function row(key, label, valTxt, meta) {
        var r = box._rows && box._rows[key];
        if (!r) {
            r = el('div'); r.style.marginTop = '10px';
            var top = el('div');
            top.style.cssText = 'display:flex;justify-content:space-between;align-items:baseline;gap:8px';
            top.appendChild(el('span', 'ro__k', label));
            r._val = el('span', 'n'); r._val.style.fontSize = '12px';
            top.appendChild(r._val);
            r.appendChild(top);
            r._meta = el('div', 'ro__m'); r._meta.style.marginTop = '4px';
            r.appendChild(r._meta);
            box.appendChild(r);
            (box._rows = box._rows || {})[key] = r;
        }
        setTxt(r._val, valTxt);
        setTxt(r._meta, meta || '');
        r._meta.hidden = !meta;
        return r;
    }

    row('up', 'Uptime', OS.dur(sys.uptime || 0));

    /* How long the LINK has been up, which is not how long the router has. The
       gap between the two is the only thing on this page that reports a
       connection having dropped while nobody was watching — so the caption only
       appears when there IS a gap, and says what it means rather than restating
       the number beside it. */
    /* Created even when there is nothing to show, then hidden: an uplink that is
       down at first paint and comes back later would otherwise insert its row
       below the ones built after it. */
    var wu = +sys.wan_uptime, wuOk = isFinite(wu) && wu >= 0;
    var gap = wuOk ? (sys.uptime || 0) - wu : 0;
    row('wan', 'Uplink up', wuOk ? OS.dur(wu) : '—',
        !wuOk ? ''
              : gap > 120 ? 'the router has been up ' + OS.dur(sys.uptime) + ', so the link dropped'
                          : 'no drop since the router booted'
    ).hidden = !wuOk;


    /* After a storm clears, keep one quiet line pointing at what happened —
       the 2026-08-10 loop wrapped the log ring in 42s, so by the time anyone
       looked, this was the only trace left. */
    /* IPv6 reachability. Separate from the latency graph because v4 and v6 fail
       independently: on 2026-08-10 v6 was down for an hour while v4 was perfect
       and nothing on this page said so. -1 = not sampled yet. */
    var v6 = sys.v6_loss;
    if (!box._v6) {
        box._v6 = el('div');
        box._v6.style.cssText = 'display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:10px';
        box._v6.appendChild(el('span', 'ro__k', 'IPv6'));
        box._v6w = el('span');
        box._v6.appendChild(box._v6w);
        box.appendChild(box._v6);
    }
    box._v6.hidden = !(v6 != null && v6 >= 0);
    if (!box._v6.hidden) {
        clear(box._v6w);
        box._v6w.appendChild(OS.stateWord(v6 >= 100 ? 'UNREACHABLE' : 'REACHABLE', v6 >= 100 ? 'bad' : 'ok'));
    }

    var chipBox = $('#sysChip'); clear(chipBox);
    /* The chip summarises every bar under it, so the two new ones count too — a
       full overlay or an exhausted connection table is a degraded router even
       with a cold CPU and free memory, and those are precisely the failures that
       present as something else entirely. */
    var worst = (t > 85 || memPct > 0.9 || load > cores || v6 >= 100 ||
                 ovlPct > 0.9) ? ['DEGRADED', 'bad']
              : (t > 75 || memPct > 0.75 || load > cores * 0.7 ||
                 ovlPct > 0.75) ? ['WARM', 'warn']
              : ['NOMINAL', 'ok'];
    chipBox.appendChild(OS.stateWord(worst[0], worst[1]));
}

/* --------------------------------------------------------------- clients - */
/* ico: the medium drawn rather than described — a port for the wired group, a
   signal for every radio. The two headings that carried explanatory notes lost
   them: "wired to the LAN port" restated the word Ethernet, and the IoT one
   explained an isolation rule that belongs on the Settings page, not on a
   heading that repeats on every poll. Blocked and Not connected keep theirs,
   because those genuinely say something the label does not. */
/* Ethernet link rates are the handful of values autonegotiation can settle on,
   so they read better as the name people use for them than as a raw megabit
   count — 2.5 Gb/s, not 2500 Mb/s. */
function ethSpeed(mbit) {
    if (mbit >= 1000) {
        var g = mbit / 1000;
        return (g === Math.round(g) ? g : g.toFixed(1)) + ' Gb/s';
    }
    return mbit + ' Mb/s';
}

var MEDIA = {
    eth:     { k: 'Ethernet',  ico: 'eth',  note: '' },
    '5':     { k: '5 GHz',     ico: 'wifi', note: '' },
    '2.4':   { k: '2.4 GHz',   ico: 'wifi', note: '' },
    iot:     { k: 'IoT',       ico: 'wifi', note: '' },
    guest:   { k: 'Guest',     ico: 'wifi', note: '' },
    blocked: { k: 'Blocked',   ico: 'lock', note: 'denied by MAC filter' },
    idle:    { k: 'Not connected', ico: 'dev', note: 'known, currently offline' }
};

/* The list is KEYED, not rebuilt (see OS.keyed). Every heading, row and open
   panel keeps the same DOM node across polls and is updated in place, which is
   what lets the signal scales travel to their new value instead of jumping to
   it. Order here is stable by construction — model() sorts by group, then
   generation, then name — so the reconciler's move loop normally does nothing.
   DOM order is preserved rather than faked with CSS `order`, because
   .tbl__group:first-child and .row:last-child draw their borders from it. */
function renderClients(d, M) {
    var box = $('#clients');
    var devs = M.devices;
    var onlineN = devs.filter(function (v) { return v.medium !== 'idle' && v.medium !== 'blocked'; }).length;
    setTxt($('#cliCount'), onlineN + ' online');

    var K = OS.keyed(box);
    if (!devs.length) {
        K.want('empty', function () {
            return OS.emptyState('No devices seen yet',
                'Devices appear here the moment they connect or take a DHCP lease.', 'dev');
        });
        K.commit();
        return;
    }
    var groups = {};
    devs.forEach(function (v) { (groups[v.group] = groups[v.group] || []).push(v); });

    /* Offline devices are counted in the header but not rendered: the
       Overview is the CURRENT state of the network, not its roster. */
    /* Built from what is actually present. The zone groups sit between the LAN
       bands and Blocked, in the same order the sort above put their rows in, so
       the headings and the rows can never disagree. */
    var zoneKeys = [];
    devs.forEach(function (v) {
        if (['eth', '5', '2.4', 'blocked', 'idle'].indexOf(v.group) >= 0) return;
        if (zoneKeys.indexOf(v.group) < 0) zoneKeys.push(v.group);
    });
    zoneKeys.sort(OS.netCmp);   /* guest before IoT, not alphabetical by luck */
    ['eth', '5', '2.4'].concat(zoneKeys).concat(['blocked']).forEach(function (key) {
        var list = groups[key];
        if (!list || !list.length) return;
        /* A heading that names a radio can open to show that radio. Ethernet
           and Blocked have no radio behind them and stay inert. */
        var ap = apForGroup(key, M.aps);
        var g = K.want('g:' + key, function () { return groupHead(key); }).node;
        syncGroupHead(g, key, ap, list.length);
        if (ap && radioOpen[key]) {
            K.want('rd:' + key, radioDetail).node._sync(ap, d);
        }
        /* The per-row zone chip is suppressed under a zone heading — it would
           repeat the network name on every row of a group that already says
           it. Tested against the group, not against the literal 'iot', or the
           guest rows would each carry a redundant "guest" chip. */
        var inZone = zoneKeys.indexOf(key) >= 0;
        list.forEach(function (v) {
            K.want('r:' + v.mac, function () { return rowFor(v.mac); })
             .node._sync(v, inZone);
            if (expanded[v.mac]) {
                detailFor(K.want('d:' + v.mac, function () { return el('div', 'det'); }).node, v, d);
            }
        });
    });
    K.commit();
}

/* A group heading is built for the widest case — caret and all — and then told
   what it is. Building two shapes would mean rebuilding the node whenever a
   radio came or went, and a rebuilt caret cannot rotate. */
/* A network this build has never heard of still gets a heading: its own name,
   title-cased, on the Wi-Fi icon. Falling back rather than indexing blind is
   what lets someone add a fourth network without editing this file. */
function mediaOf(key) {
    return MEDIA[key] || { k: OS.netLabel(key), ico: 'wifi', note: '' };
}
function groupHead(key) {
    var m = mediaOf(key);
    var g = el('div', 'tbl__group');
    if (m.ico) g.appendChild(OS.icon(m.ico));
    g.appendChild(el('span', 'tbl__gk', m.k));
    if (m.note) g.appendChild(el('span', 'row__sub', m.note));
    g._n = el('span', 'tbl__gn');
    g.appendChild(g._n);
    g._caret = el('div'); g._caret.style.cssText =
        'width:5px;height:5px;flex:none;margin-left:2px;' +
        'border-right:1.5px solid var(--ink-4);border-bottom:1.5px solid var(--ink-4);' +
        'transition:transform 150ms var(--ease)';
    g.appendChild(g._caret);
    function toggle() {
        if (!g._ap) return;
        radioOpen[key] = !radioOpen[key];
        render(last);
    }
    g.addEventListener('click', toggle);
    g.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    return g;
}
function syncGroupHead(g, key, ap, n) {
    g._ap = ap;
    setTxt(g._n, String(n));
    g._caret.hidden = !ap;
    g._caret.style.transform = 'rotate(' + (ap && radioOpen[key] ? '225deg' : '45deg') + ')';
    if (ap) {
        g.setAttribute('role', 'button');
        g.setAttribute('tabindex', '0');
        g.setAttribute('aria-expanded', radioOpen[key] ? 'true' : 'false');
        g.style.cursor = 'pointer';
    } else {
        g.removeAttribute('role');
        g.removeAttribute('tabindex');
        g.removeAttribute('aria-expanded');
        g.style.cursor = '';
    }
}

/* Built once per MAC and kept. Everything that moves — the signal scale, the
   caret — is a lasting element that gets a new value; only the parts with no
   motion of their own (chips, the state word) are still replaced. */
function rowFor(mac) {
    var r = el('div', 'row row--entity');
    r.style.gridTemplateColumns = 'minmax(0,1fr) auto auto auto';
    r.setAttribute('role', 'button');
    r.setAttribute('tabindex', '0');

    var id = el('div', 'row__id re-id');
    r._ico = el('div', 'row__ico');
    id.appendChild(r._ico);
    var txt = el('div'); txt.style.minWidth = '0';
    r._title = el('div', 'row__title');
    r._nm = el('span', 'row__nm');
    r._title.appendChild(r._nm);
    txt.appendChild(r._title);
    /* the identity line reads like the operator would say it:
       "5 GHz · Wi-Fi 7 · 2402 Mb/s" */
    r._sub = el('div', 'row__sub');
    txt.appendChild(r._sub);
    id.appendChild(txt);
    r.appendChild(id);

    /* signal, plotted on the calibrated -90..-20 rule. The scale is created
       here and only ever moved afterwards: os.css asks for a 400ms travel on
       the fill and the marker, and a scale rebuilt every poll has no previous
       position to travel from — which is exactly why it used to jump. Wired and
       blocked rows hide the two children rather than the wrapper, so the row
       keeps its four grid columns either way. */
    var mid = el('div', 're-sig'); mid.style.cssText = 'display:flex;align-items:center;gap:10px';
    r._sc = OS.rssiScale(-90, true);
    r._sc.style.width = '64px';
    mid.appendChild(r._sc);
    r._dbm = el('span', 'row__num');
    r._dbm.style.cssText += ';color:var(--ink-2);width:56px';
    mid.appendChild(r._dbm);
    r.appendChild(mid);

    /* the state word: the single uppercase element in the row */
    r._word = el('div', 're-state'); r._word.style.cssText = 'text-align:right;min-width:82px';
    r.appendChild(r._word);

    /* expand affordance */
    r._caret = el('div', 're-caret'); r._caret.style.cssText =
        'width:5px;height:5px;border-right:1.5px solid var(--ink-4);' +
        'border-bottom:1.5px solid var(--ink-4);transition:transform 150ms var(--ease)';
    r.appendChild(r._caret);

    function toggle() {
        expanded[mac] = !expanded[mac];
        render(last);
    }
    r.addEventListener('click', toggle);
    r.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });

    r._sync = function (v, inZoneGroup) {
        r.setAttribute('aria-expanded', expanded[v.mac] ? 'true' : 'false');
        var ic = OS.CLASS_ICON[v.cls] || 'dev';
        if (r._ic !== ic) { r._ic = ic; clear(r._ico); r._ico.appendChild(OS.icon(ic)); }
        setTxt(r._nm, v.name);
        while (r._title.childNodes.length > 1) r._title.removeChild(r._title.lastChild);
        if (v.vpn) r._title.appendChild(OS.chip('VPN', 'on'));
        if (v.zone && v.zone !== LANNET && !inZoneGroup) r._title.appendChild(OS.chip(v.zone, 'flat'));

        var subBits = [];
        if (v.links.length) {
            var L = v.links[0], st = L.st || {};
            subBits.push(L.band + ' GHz');
            subBits.push(OS.GEN[OS.genOf(st)]);
        } else if (v.medium === 'eth') {
            /* The WIRED badge on the right already says it is a cable. The
               subtitle carries what the cable NEGOTIATED - the same reading
               the detail panel shows, so one card never spells one number two
               ways. It is the router's end of the port: the device's own link
               when it is alone on that port, the trunk when a switch sits in
               between, which is labelled rather than passed off as the
               device's. A port that is down or unreadable (sysfs speed -1)
               has nothing honest to say, so the word 'wired' stays for it. */
            if (v.portSpeed) {
                subBits.push(ethSpeed(v.portSpeed) +
                             (v.portDuplex ? ' (' + v.portDuplex + ' duplex)' : '') +
                             (v.portPeers > 1 ? '  \u00b7  via switch' : ''));
            } else {
                subBits.push('wired');
            }
        }
        if (v.ip) subBits.push(v.ip);
        setTxt(r._sub, subBits.join('  ·  ') || v.mac);

        var wifi = v.medium === '5' || v.medium === '2.4';
        r._sc.hidden = !wifi;
        r._dbm.hidden = !wifi;
        if (wifi) {
            OS.rssiScaleSet(r._sc, v.signal);
            r._sc.title = v.signal + ' dBm';
            setTxt(r._dbm, v.signal + ' dBm');
        }

        clear(r._word);
        if (wifi) {
            /* Always the signal word, always coloured to match its own bar.
               ACTIVE used to pre-empt it whenever the client had transmitted in
               the last 3s, so on a busy network most rows never showed their
               signal at all - and ACTIVE was green no matter how weak the link
               was, which is the opposite of what the column is for. The word and
               the bar now agree: EXCELLENT green, GOOD fair, WEAK amber, POOR
               red. */
            var q = OS.quality(v.signal);
            r._word.appendChild(OS.stateWord(q.word, q.tone));
        } else if (v.medium === 'eth') {
            r._word.appendChild(OS.stateWord('WIRED', 'ok'));
        } else if (v.medium === 'blocked') {
            r._word.appendChild(OS.stateWord('BLOCKED', 'bad'));
        } else {
            r._word.appendChild(OS.stateWord('OFFLINE', 'idle'));
        }
        /* the entity's footprint: what it has moved today, on every row */
        if (v.traffic && (v.traffic.dn + v.traffic.up) > 0) {
            r._word.appendChild(el('div', 'row__cap',
                OS.bytes(v.traffic.dn + v.traffic.up) + ' today'));
        } else if (v.links.length && v.idleMs >= 3000) {
            r._word.appendChild(el('div', 'row__cap', 'idle ' + OS.dur(v.idleMs / 1000)));
        }

        r._caret.style.transform = 'rotate(' + (expanded[v.mac] ? '225deg' : '45deg') + ')';
    };
    return r;
}

/* Fills a caller-owned panel rather than returning a new one, so the expanded
   panel keeps its identity across polls (its <details> state already survives
   via advOpen). The contents carry no motion, so they are still rebuilt. */
function detailFor(box, v, d) {
    clear(box);

    /* actions first: this panel is opened to DO something as often as to read */
    var acts = el('div', 'inline');
    acts.style.marginBottom = '14px';
    var rn = el('button', 'btn btn--sm');
    rn.appendChild(OS.icon('pen')); rn.appendChild(document.createTextNode('Rename'));
    rn.addEventListener('click', function (e) { e.stopPropagation(); rename(v); });
    acts.appendChild(rn);

    var rt = el('a', 'btn btn--sm');
    rt.href = '/vpn/';
    rt.appendChild(OS.icon('routing'));
    rt.appendChild(document.createTextNode(v.vpn ? 'Change tunnel' : 'Route via VPN'));
    acts.appendChild(rt);

    box.appendChild(acts);

    if (v.blocked.length) {
        box.appendChild(OS.note('Blocked by MAC filter on ' +
            v.blocked.map(function (b) { return b.ssid; }).join(', ') +
            '. Unblock it in Settings, under Blocked devices.', 'bad'));
        box.lastChild.style.marginBottom = '14px';
    }

    /* identity + traffic */
    var dl = el('dl', 'kv');
    function kv(k, val) {
        if (val == null || val === '') return;
        dl.appendChild(el('dt', null, k));
        dl.appendChild(el('dd', null, String(val)));
    }
    var vend = (d.oui || {})[v.mac.slice(0, 8)];
    kv('MAC', v.mac + (vend ? '  ' + vend : ''));
    if (v.ip) kv('IPv4', v.ip);
    v.ip6.forEach(function (a, i) { kv(i ? '' : 'IPv6', a); });
    if (v.host && v.host !== v.name) kv('Hostname', v.host);
    /* What the cable actually negotiated. Read from the router's port, so it is
       this device's own link only when the device is the only thing on that
       port — otherwise a switch is in between and the number is the trunk. The
       two cases get different labels rather than one optimistic reading. */
    if (v.medium === 'eth' && v.portSpeed) {
        var lk = ethSpeed(v.portSpeed) +
                 (v.portDuplex ? '  ·  ' + v.portDuplex + ' duplex' : '');
        if (v.portPeers > 1) {
            kv('Router port', lk + '  ·  ' + v.portPeers + ' devices behind it');
        } else {
            kv('Link', lk);
        }
    }
    kv('Zone', v.zone || 'lan');
    kv('Reachability', v.neigh ? (v.neigh === 'REACHABLE' ? 'reachable'
        : v.neigh === 'FAILED' ? 'not answering ARP' : v.neigh.toLowerCase()) : null);
    kv('Internet route', v.vpn ? v.vpn + '  ·  VPN' : 'Direct  ·  normal uplink');
    /* No "Today" row. The same figure is on the collapsed row above as a
       combined total, and the Traffic panel further down gives the identical
       down/up split ranked against every other device — which is the version
       worth having, because a byte count only means something next to the
       other byte counts. This row was the third copy and the only one you had
       to expand something to reach. Everything else in this panel is a fact
       about the DEVICE that appears nowhere else. */
    box.appendChild(dl);

    /* per-link radio detail */
    v.links.forEach(function (l) {
        var st = l.st, x = v.x || {};
        var sec = el('div', 'det__wifi');
        box.appendChild(sec);
        var head = el('div');
        head.style.cssText = 'display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap';
        head.appendChild(el('span', 'row__cap', l.band + ' GHz'));
        var nm = el('span'); nm.style.cssText = 'font-size:12.5px;font-weight:500';
        nm.textContent = l.ssid; head.appendChild(nm);
        head.appendChild(OS.chip(OS.GEN[OS.genOf(st)], 'flat'));
        head.appendChild(OS.chip(((st.tx && st.tx.mhz) || 0) + ' MHz', 'flat'));
        var q2 = OS.quality(st.signal);
        var sc2 = OS.rssiScale(st.signal, true); sc2.style.cssText = 'width:64px;margin-left:auto';
        head.appendChild(sc2);
        head.appendChild(OS.stateWord(q2.word, q2.tone === 'ok' ? 'ok' : q2.tone));
        sec.appendChild(head);

        var d2 = el('dl', 'kv');
        function kv2(k, val) {
            if (val == null || val === '') return;
            d2.appendChild(el('dt', null, k)); d2.appendChild(el('dd', null, String(val)));
        }
        var snr = (st.signal != null && st.noise != null) ? (st.signal - st.noise) : null;
        kv2('Signal', st.signal + ' dBm' + (snr != null ? '   SNR ' + snr + ' dB' : ''));
        if (x.chains && x.chains.indexOf(',') > 0) kv2('Per antenna', x.chains.split(',').join(' / ') + ' dBm');
        if (st.noise != null) kv2('Noise floor', st.noise + ' dBm');
        /* one row, one unit — the two rates are read against each other far more
           often than they are read alone */
        kv2('TX / RX rate', Math.round((st.tx && st.tx.rate || 0) / 1000) + ' / ' +
                            Math.round((st.rx && st.rx.rate || 0) / 1000) + ' Mb/s');
        /* the honest counterpart to the PHY rates above: what the driver thinks
           the link can actually carry once overhead and retries are paid */
        if (st.thr) kv2('Expected throughput', Math.round(st.thr / 1000) + ' Mb/s');
        kv2('Connected', OS.dur(st.connected_time));
        /* Channel dropped: l.chan IS ap.info.channel, the same value the Radios
           section prints for this band — it could never disagree. */
        sec.appendChild(d2);

        var det = document.createElement('details');
        det.className = 'adv';
        det.style.cssText = 'border-top:1px solid var(--line);margin-top:10px';
        var akey = v.mac + '|' + l.band;
        det.open = !!advOpen[akey];
        det.addEventListener('toggle', function () { advOpen[akey] = det.open; });
        var sum = document.createElement('summary');
        sum.textContent = 'Driver counters';
        sum.style.padding = '9px 0';
        det.appendChild(sum);
        var d3 = el('dl', 'kv');
        function kv3(k, val) {
            if (val == null || val === '') return;
            d3.appendChild(el('dt', null, k)); d3.appendChild(el('dd', null, String(val)));
        }
        function chainTxt(r) {
            if (!r) return '';
            var p = [];
            if (r.mcs != null) p.push('MCS ' + r.mcs);
            if (r.nss) p.push(r.nss + ' stream' + (r.nss === 1 ? '' : 's'));
            if (r.mhz) p.push(r.mhz + ' MHz');
            if (r.short_gi) p.push('short GI');
            return p.join(' · ');
        }
        kv3('Transmit', chainTxt(st.tx));
        kv3('Receive', chainTxt(st.rx));
        if (st.signal_avg != null) kv3('Signal average', st.signal_avg + ' dBm');
        if (st.tx && st.tx.packets != null) kv3('Packets sent', (+st.tx.packets).toLocaleString());
        if (st.rx && st.rx.packets != null) kv3('Packets received', (+st.rx.packets).toLocaleString());
        if (st.tx && st.tx.retries != null) {
            var pk = +st.tx.packets || 0, rt = +st.tx.retries || 0;
            kv3('Retries', rt.toLocaleString() + (pk ? '  ' + (rt * 100 / pk).toFixed(1) + '% of sent' : ''));
        }
        if (st.tx && st.tx.failed != null) kv3('Send failures', (+st.tx.failed).toLocaleString());
        if (st.rx && st.rx.drop_misc != null) kv3('Receive drops', (+st.rx.drop_misc).toLocaleString());
        if (x.dtim) kv3('DTIM period', x.dtim);
        if (x.bi) kv3('Beacon interval', x.bi + ' TU');
        var flags = [];
        if (st.authorized) flags.push('authorised');
        if (st.mfp) flags.push('PMF 802.11w');
        if (st.wme) flags.push('WMM');
        if (st.preamble) flags.push(st.preamble + ' preamble');
        if (flags.length) kv3('Association', flags.join(' · '));
        det.appendChild(d3);
        if (st.tx && +st.tx.failed > 0 && +st.tx.failed === +st.tx.retries) {
            /* Desktop only, for the same reason as the network background note
               in Settings: it explains why two numbers look alike, which is
               read once and never acted on, and it sits inside an already-tall
               expanded device row. */
            var w = OS.note('Retries and failures read identically here — a known mt76 ' +
                            'counter quirk on this chip, not a real error rate.', null);
            w.classList.add('desk-only');
            w.style.marginTop = '10px';
            det.appendChild(w);
        }
        sec.appendChild(det);
    });

    return box;
}

function rename(v) {
    var wrap = el('div');
    var f1 = el('div', 'field');
    f1.appendChild(el('label', 'label', 'Display name'));
    var i1 = el('input', 'input'); i1.value = v.named ? v.name : '';
    i1.placeholder = v.host || v.mac;
    f1.appendChild(i1); wrap.appendChild(f1);
    var f2 = el('div', 'field');
    f2.appendChild(el('label', 'label', 'Category'));
    var sel = el('select', 'select');
    [['phone', 'Phone'], ['pad', 'Tablet'], ['laptop', 'Laptop'], ['computer', 'Desktop computer'],
     ['television', 'TV / streaming'], ['watch', 'Watch'], ['smartappliances', 'Smart home device'],
     ['router', 'Router / access point'], ['default', 'Unknown']].forEach(function (o) {
        var op = el('option', null, o[1]); op.value = o[0];
        if (o[0] === v.cls) op.selected = true;
        sel.appendChild(op);
    });
    f2.appendChild(sel); wrap.appendChild(f2);
    f2.appendChild(el('div', 'hint', 'The name and icon are stored on the router and used everywhere in this console.'));

    OS.dialog({ title: 'Rename device', body: wrap, okText: 'Save' }).then(function (go) {
        if (!go) return;
        var nm = i1.value.trim();
        if (!nm) { OS.toast('Name cannot be empty.', 'bad'); return; }
        OS.act(null, API, { action: 'setdev', mac: v.mac, name: nm, 'class': sel.value },
               { ok: 'Renamed to ' + nm + '.' });
    });
}

/* ---------------------------------------------------------------- radios - */
/* Which AP a Clients heading is showing. Ethernet and Blocked have none. The
   two band groups mean the LAN AP on that band; a zone group (iot) means the
   AP serving that network, matched on the network name rather than a literal,
   so a second isolated SSID would work the same way. */
function apForGroup(key, aps) {
    aps = aps || [];
    if (key === 'eth' || key === 'blocked' || key === 'idle') return null;
    if (key === '5' || key === '2.4') {
        var b = key === '5' ? '5g' : '2g';
        return aps.filter(function (a) { return a.band === b && a.network === LANNET; })[0] || null;
    }
    return aps.filter(function (a) { return a.network === key; })[0] || null;
}

/* Everything the standalone Radios section used to show, for one radio: its
   SSID and chips, the band/generation/channel/power line, where it actually
   sits in the spectrum, and airtime. Folded in here so the page states each
   fact once — the heading above already gives the band and the client count,
   so those are not repeated. */
/* Built empty and filled by _sync, so the airtime needle — the only thing in
   here that changes between polls — is a lasting element that can travel. */
function radioDetail() {
    var box = el('div', 'det');

    box._top = el('div');
    box._top.style.cssText = 'display:flex;align-items:baseline;gap:8px;min-width:0';
    box._nm = el('span');
    box._nm.style.cssText = 'font-size:13.5px;font-weight:600;letter-spacing:-.015em;' +
        'white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    box._top.appendChild(box._nm);
    box.appendChild(box._top);

    box._meta = el('div', 'row__sub');
    box._meta.style.marginTop = '2px';
    box.appendChild(box._meta);

    /* the instrument: where this radio actually sits in its band */
    box._spec = el('div');
    box._spec.style.marginTop = '10px';
    box.appendChild(box._spec);

    /* airtime under the spectrum, on a calibrated 0-100 with a tick at the
       70% congestion threshold. Only the LAN AP reports it: the counters are
       per-radio, so an isolated SSID sharing a radio would double-count. */
    box._air = el('div');
    box._air.style.cssText = 'display:flex;align-items:center;gap:10px;margin-top:10px';
    var lab = el('span', 'row__cap', 'airtime');
    lab.style.width = '48px'; lab.style.flex = 'none';
    box._air.appendChild(lab);
    box._airSc = OS.scale(0, 0, 100, [70], null, true);
    box._airSc.style.flex = '1';
    box._air.appendChild(box._airSc);
    box._airV = el('span', 'n');
    box._airV.style.cssText = 'font-size:11px;width:36px;text-align:right;flex:none';
    box._air.appendChild(box._airV);
    box._airW = el('span');
    box._airW.style.marginLeft = '6px';
    box._air.appendChild(box._airW);
    box.appendChild(box._air);

    box._sync = function (ap, d) {
        var inf = ap.info || {};
        setTxt(box._nm, inf.ssid || ap.section);
        while (box._top.childNodes.length > 1) box._top.removeChild(box._top.lastChild);
        if (ap.network !== LANNET) box._top.appendChild(OS.chip(ap.network, 'flat'));
        if (ap.macfilter === 'deny' && (ap.maclist || []).length)
            box._top.appendChild(OS.chip((ap.maclist || []).length + ' blocked', 'warn'));

        var gen = { be: 'Wi-Fi 7', ax: 'Wi-Fi 6', ac: 'Wi-Fi 5' }[inf.hwmode] || '';
        setTxt(box._meta, [gen, 'ch ' + (inf.channel || '?'),
            inf.txpower != null ? 'tx ' + inf.txpower + ' dBm' : '']
            .filter(Boolean).join('  ·  '));

        /* the spectrum plot is pure geometry: redraw it only when the geometry
           actually changed, which on a fixed channel is never */
        var mhz = parseInt(String(inf.htmode || '').replace(/[A-Z]+/, ''), 10) || 20;
        var sig = [ap.band, inf.channel || 1, inf.center_chan1 || inf.channel, mhz].join('/');
        if (box._specSig !== sig) {
            box._specSig = sig;
            clear(box._spec);
            box._spec.appendChild(OS.spectrum(ap.band, inf.channel || 1,
                inf.center_chan1 || inf.channel, mhz, 44));
        }

        var air = d.air || {};
        var g = ap.band === '5g' ? air.g5 : air.g24;
        var pct = (g && g.active && ap.network === LANNET) ? airPct(ap.band, g) : null;
        box._air.hidden = pct == null;
        if (pct == null) return;
        OS.scaleSet(box._airSc, pct, pct > 70 ? 'warn' : null);
        setTxt(box._airV, pct + '%');
        clear(box._airW);
        box._airW.appendChild(pct > 70 ? OS.stateWord('CONGESTED', 'warn')
                            : pct > 30 ? OS.stateWord('BUSY', null)
                            : OS.stateWord('CLEAR', 'ok'));
    };
    return box;
}

/* busy%% as a delta between polls (true "right now"); first sample falls back
   to the boot-lifetime ratio. */
var prevAirSnap = {};
function airPct(band, g) {
    var prev = prevAirSnap[band];
    prevAirSnap[band] = { active: g.active, busy: g.busy };
    if (prev && g.active > prev.active) {
        var da = g.active - prev.active, db = g.busy - prev.busy;
        if (db >= 0 && db <= da) return Math.round(db * 100 / da);
    }
    return g.active > 0 ? Math.round(g.busy * 100 / g.active) : null;
}

/* The heading follows nlbwmon's actual accounting period rather than claiming
   "today" and hoping. nlbwmon's default is monthly — database_interval=1 means
   "restart on the 1st" — so on a stock install this panel would silently show
   weeks of traffic under a heading that said today. It also anchors periods to
   UTC, so even daily accounting rolls over at UTC midnight, not local. Reading
   the period back is the only way the label can stay true on any router. */
function trafficHeading(period, daily) {
    /* daily === true means the figures were rebased to local midnight, so the
       heading is literally true regardless of what nlbwmon's own period is. */
