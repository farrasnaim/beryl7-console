    if (daily) return 'Traffic today';
    if (!period) return 'Traffic today';
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(period);
    if (!p) return 'Traffic today';
    var start = new Date(+p[1], +p[2] - 1, +p[3]);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var days = Math.round((today - start) / 86400000);
    if (days <= 0) return 'Traffic today';
    if (days === 1) return 'Traffic since yesterday';
    return 'Traffic since ' + start.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}

/* The uplink line under the device list. "August total usage:" on the WAN,
   because a calendar month is the unit a data plan is sold in. On a repeater or
   a tethered phone that unit means nothing — the link did not exist for most of
   the month — so the question becomes how much THIS session has carried, and it
   starts again when the link drops. */
function uplinkUsageLabel(uu) {
    if (uu.kind === 'wwan')      return 'Current repeater total usage:';
    if (uu.kind === 'tethering') return 'Current tethering total usage:';
    var m = /^\d{4}-\d{2}$/.test(uu.month || '')
        ? new Date(+uu.month.slice(0, 4), +uu.month.slice(5, 7) - 1, 1)
              .toLocaleDateString(undefined, { month: 'long' })
        : '';
    return (m || 'Month') + ' total usage:';
}
function renderTraffic(d, M) {
    setTxt($('#trafTitle'), trafficHeading(d.nlbw_period, d.nlbw_daily));
    var box = $('#traffic');
    /* The grid and the hint are built once and kept. A meter segment carries a
       background transition in os.css; it can only fade if the segment is the
       same element it was a poll ago. */
    if (!box._grid) {
        clear(box);
        /* Text is set per poll below: an empty table means two different things
           and the wording has to say which. */
        box._hint = el('div', 'hint', 'No per-device accounting yet today.');
        box.appendChild(box._hint);
        /* full-width panel: two columns of meters on desktop, one on a phone —
           a lone 900px meter says less than two 440px ones */
        box._grid = el('div');
        box._grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));' +
                                  'gap:4px 32px';
        box.appendChild(box._grid);
    }
    /* Every device the router accounted for today, minus the IoT network —
       plugs and bulbs trading a few hundred KB are noise beside real devices,
       and they sit on their own isolated network anyway. Nothing here is a
       fixed list: this is whatever nlbwmon saw, so a device that joined five
       minutes ago appears on its own as soon as it moves data. Membership is
       read from the live association (l.net), not a stored classmap, so a
       brand-new IoT gadget is excluded without being known in advance. */
    var all = M.devices.filter(function (v) {
        if (!v.traffic || (v.traffic.dn + v.traffic.up) <= 0) return false;
        if (v.zone && v.zone !== LANNET) return false;
        return !v.links.some(function (l) { return l.net && l.net !== LANNET; });
    });
    var grand = 0;
    all.forEach(function (v) { grand += v.traffic.dn + v.traffic.up; });
    setTxt($('#trafTotal'), grand ? OS.bytes(grand) + ' total' : '');
    /* "Nothing has used the network yet" and "nothing is counting" look
       identical from here — an empty table either way — and the old wording
       claimed the first for both. The router can tell them apart (nlbw exits
       non-zero when the daemon is not answering), so the panel says which. */
    box._hint.textContent = (d.nlbw_up === false)
        ? 'Per-device accounting is not running, so nothing is being counted.'
        : 'No per-device accounting yet today.';
    box._hint.hidden = !!all.length;

    all.sort(function (a, b) { return (b.traffic.dn + b.traffic.up) - (a.traffic.dn + a.traffic.up); });
    /* Ranked with CSS `order`, not by moving nodes. This list DOES reorder — two
       devices a few MB apart swap places all evening — and a node yanked out of
       the tree and put back loses the transition it was in the middle of. There
       are no sibling selectors in this grid, so visual order can differ from DOM
       order with nothing to give it away. */
    var K = OS.keyed(box._grid, true);
    all.forEach(function (v, i) {
        var r = K.want(v.mac, trafRow).node;
        r._mac = v.mac;
        r.style.order = i;
        var sum = v.traffic.dn + v.traffic.up;
        setTxt(r._nm, v.name);
        setTxt(r._tot, OS.bytes(sum));
        setTxt(r._split, '↓ ' + OS.bytes(v.traffic.dn) + '   ↑ ' + OS.bytes(v.traffic.up));
        /* Rounds to whole percent and floors at "<1%" rather than showing 0% —
           a device that moved 40 MB against a 60 GB day did use the network,
           and "0%" reads as "nothing", which is a different claim. */
        var pct = grand ? (sum / grand) * 100 : 0;
        setTxt(r._sh, pct >= 1 ? Math.round(pct) + '%' : (sum > 0 ? '<1%' : ''));
    });
    K.commit();

    /* Uplink total, below the devices, and deliberately a DIFFERENT number from
       the rows above: those are LAN devices this accounting period, this is what
       the uplink itself carried. They are not meant to agree — traffic the router
       originates, and anything nlbwmon was not running for, lands here and not
       there. Built once and kept, like the grid. */
    if (!box._uplink) {
        box._uplink = el('div', 'hint');
        box._uplink.style.cssText = 'margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)';
        box.appendChild(box._uplink);
    }
    var uu = d.uplink_usage;
    /* Hidden rather than shown empty when dashmon has not written a figure yet:
       a label with no number reads as a fault. */
    box._uplink.hidden = !(uu && uu.ok);
    if (uu && uu.ok) setTxt(box._uplink, uplinkUsageLabel(uu) + '  ' + OS.bytes(uu.total));
}
function trafRow() {
    var r = el('div'); r.style.marginBottom = '11px';

    var t = el('div');
    t.style.cssText = 'display:flex;justify-content:space-between;align-items:baseline;gap:10px';
    r._nm = el('span');
    r._nm.style.cssText = 'font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    t.appendChild(r._nm);
    /* The total is the hero: "how much did this thing use" is the question the
       panel exists to answer, and it was previously the one number you had to
       add up yourself from the split. */
    r._tot = el('span', 'n');
    r._tot.style.cssText = 'font-size:12.5px;font-weight:600;flex:none;font-variant-numeric:tabular-nums';
    t.appendChild(r._tot);
    r.appendChild(t);

    var b = el('div');
    b.style.cssText = 'display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:2px';
    r._split = el('span', 'n');
    r._split.style.cssText = 'font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums';
    b.appendChild(r._split);
    /* Share of the day, which is what the bar was reaching for and never
       delivered: it was scaled to the busiest device, so the top row was always
       full and the rest were fractions of something the eye could not name.
       A percentage of the day's total is the same idea, stated. */
    r._sh = el('span', 'n');
    r._sh.style.cssText = 'font-size:11px;color:var(--ink-4);flex:none;font-variant-numeric:tabular-nums';
    b.appendChild(r._sh);
    r.appendChild(b);
    /* Click for what the number is MADE OF - opens the device modal. */
    r.style.cursor = 'pointer';
    r.addEventListener('click', function () {
        if (r._mac) openDevModal(r._mac, r._nm.textContent || r._mac);
    });
    return r;
}

/* The device modal. Two answers, different in KIND, and the labels say so:
   the protocol split covers the accounting day, like the number it explains;
   the remote list is live and REFRESHES while the modal is open - but its byte
   figures can never exceed ~30s, because the per-device accountant drains
   every conntrack counter each half-minute for its deltas. Nothing on this
   router records destinations historically, and the modal says that rather
   than dressing the last half-minute up as the day.

   Ownership comes from Team Cymru's IP-to-ASN DNS zone, resolved through the
   router's own encrypted resolver chain and cached on the router - no packages,
   no third-party HTTP API. */
function openDevModal(mac, name) {
    var veil = el('div', 'veil on');
    /* the stock veil blurs at 2px; this one is a reading surface over a busy
       page, so it earns more */
    veil.style.backdropFilter = 'blur(8px)';
    veil.style.webkitBackdropFilter = 'blur(8px)';
    var dlg = el('div', 'dlg');
    var hd = el('div', 'dlg__h');
    hd.style.cssText = 'display:flex;justify-content:space-between;align-items:baseline;gap:12px';
    hd.appendChild(el('div', 'dlg__t', name));
    var live = el('span', 'row__cap', 'live · 1s');
    hd.appendChild(live);
    dlg.appendChild(hd);
    var body = el('div', 'dlg__b');
    body.textContent = 'Reading…';
    dlg.appendChild(body);
    var ft = el('div', 'dlg__f');
    var cb = el('button', 'btn btn--sm', 'Close');
    ft.appendChild(cb);
    dlg.appendChild(ft);
    veil.appendChild(dlg);
    document.body.appendChild(veil);

    var timer = null, closed = false;
    function close() {
        if (closed) return;
        closed = true;
        if (timer) clearInterval(timer);
        document.removeEventListener('keydown', onkey);
        if (veil.parentNode) veil.parentNode.removeChild(veil);
    }
    function onkey(e) { if (e.key === 'Escape') close(); }
    cb.addEventListener('click', close);
    veil.addEventListener('click', function (e) { if (e.target === veil) close(); });
    document.addEventListener('keydown', onkey);

    function cap(t) {
        var c = el('div', null, t);
        c.style.cssText = 'font-size:10px;font-weight:650;letter-spacing:.1em;' +
            'text-transform:uppercase;color:var(--ink-4);margin:2px 0 8px';
        return c;
    }
    /* One-second cadence needs bookkeeping the 4s version did not:
       - the cheap live call carries only connections; protocol rows and any
         names it has not cached come from the full call every 5th tick
       - remotes keep FIRST-SEEN order, so the list does not reshuffle under
         the reader's eyes every second
       - per-remote rate is the byte delta between consecutive polls. The
         counters are drained twice a minute by the accountant; a drain shows
         up as cur < prev, and the honest reading of that second is "at least
         cur new bytes", which is what gets used. */
    var st = { protos: null, rem: {}, order: [], tick: 0, prevT: 0, inflight: false };
    function load() {
        if (st.inflight || closed) return;
        st.inflight = true;
        var full = (st.tick % 5 === 0); st.tick++;
        fetch(API + '?action=devdetail&mac=' + encodeURIComponent(mac) + (full ? '' : '&live=1'),
              { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (j) {
                st.inflight = false;
                if (closed) return;
                if (!j || !j.ok) { if (full) body.textContent = 'Could not read the breakdown.'; return; }
                var now = Date.now();
                var dt = st.prevT ? (now - st.prevT) / 1000 : 0;
                st.prevT = now;
                if (j.protos) st.protos = j.protos;
                var seen = {};
                (j.remotes || []).forEach(function (rr) {
                    var d = rr[0]; seen[d] = 1;
                    var e = st.rem[d];
                    if (!e) { e = st.rem[d] = { rate: 0, miss: 0 }; st.order.push(d); }
                    if (rr[1]) e.name = rr[1];
                    if (rr[4]) e.org = rr[4];
                    if (dt > 0.3 && e.bytes != null) {
                        var db = rr[2] >= e.bytes ? rr[2] - e.bytes : rr[2];
                        e.rate = db / dt;
                    }
                    e.bytes = rr[2]; e.conns = rr[3]; e.miss = 0;
                });
                st.order.forEach(function (d) {
                    if (!seen[d]) {
                        st.rem[d].miss++;
                        if (st.rem[d].miss > 3) { delete st.rem[d]; }
                    }
                });
                st.order = st.order.filter(function (d) { return st.rem[d]; });
                render(j);
            })
            .catch(function () { st.inflight = false; if (!closed && st.tick <= 1) body.textContent = 'Could not read the breakdown.'; });
    }
    function render(j) {
                clear(body);
                var protos = st.protos || [];
                body.appendChild(cap('This accounting day · by protocol'));
                if (!protos.length) body.appendChild(el('div', 'hint', 'Nothing recorded yet.'));
                protos.forEach(function (p) {
                    var w = el('div');
                    w.style.cssText = 'display:flex;justify-content:space-between;gap:12px;' +
                        'align-items:baseline;margin-bottom:5px;font-size:12px';
                    w.appendChild(el('span', null, p[0]));
                    var z = el('span', 'n', OS.bytes(p[1] + p[2]) +
                        '  ·  ↓' + OS.bytes(p[1]) + ' ↑' + OS.bytes(p[2]));
                    z.style.cssText = 'flex:none;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:11.5px';
                    w.appendChild(z);
                    body.appendChild(w);
                });
                var c2 = cap('Talking to right now');
                c2.style.marginTop = '16px';
                body.appendChild(c2);
                if (!st.order.length) body.appendChild(el('div', 'hint', 'No active remote connections.'));
                st.order.forEach(function (dkey) {
                    var e = st.rem[dkey];
                    var rr = [dkey, e.name || '', e.bytes || 0, e.conns || 0, e.org || '', e.rate || 0];
                    var w = el('div');
                    w.style.cssText = 'margin-bottom:8px';
                    var top = el('div');
                    top.style.cssText = 'display:flex;justify-content:space-between;gap:12px;' +
                        'align-items:baseline;font-size:12px';
                    /* full text, wrapping - a modal exists so nothing has to
                       become an ellipsis */
                    var nm = el('span', null, rr[1] || rr[0]);
                    nm.style.cssText = 'word-break:break-all;min-width:0';
                    top.appendChild(nm);
                    var z = el('span', 'n', (rr[5] >= 512 ? OS.bytes(rr[5]) + '/s  ·  ' : '') +
                        rr[3] + (rr[3] === 1 ? ' conn' : ' conns'));
                    if (rr[5] >= 512) z.style.color = 'var(--ink)';
                    z.style.cssText = 'flex:none;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:11px';
                    top.appendChild(z);
                    w.appendChild(top);
                    var sub = [];
                    if (rr[4]) sub.push(rr[4]);
                    if (rr[1]) sub.push(rr[0]);
                    if (sub.length) {
                        var sb = el('div', null, sub.join('  ·  '));
                        sb.style.cssText = 'font-size:10.5px;color:var(--ink-3);word-break:break-all';
                        w.appendChild(sb);
                    }
                    body.appendChild(w);
                });
                var h = el('div', null, 'Which sites made up the day is not something this router ' +
                    'records — the list above is live connections, one second at a time. ' +
                    'Ownership names come from the public IP-to-AS registry.');
                h.style.cssText = 'margin-top:12px;font-size:10.5px;color:var(--ink-4)';
                body.appendChild(h);
    }
    load();
    timer = setInterval(load, 1000);
}

/* ----------------------------------------------------------------- boot -- */
/* The only device-wide alarm on this page, and the reason #alerts exists.
   fw4 loads its whole ruleset in one transaction, so one malformed file under
   /etc/nftables.d/ — from any package — leaves the router with NO ruleset. The
   console has no login and depends entirely on the firewall to stay off the
   internet, so this is the security model absent rather than a feature degraded.

   Silence unless the router positively said "absent". 'unknown' means the read
   itself could not be trusted, and claiming the firewall is down when it may not
   be would teach the owner to ignore the one message that means they are open. */
function renderFirewall(d) {
    var box = $('#alerts');
    if (!box) return;
    clear(box);
    if (!d.sys || d.sys.firewall !== 'absent') return;
    /* Actionable from the console, not from a terminal. The shared builder owns
       the wording, the confirm and the SSH fallback line — the VPN page reaches
       the same condition and must not grow a second version of them. */
    var n = OS.firewallAlert(function () { OS.tp.refresh(500); });
    n.style.marginBottom = '14px';
    box.appendChild(n);
}

/* The background jobs that fix things without being asked. They share one
   crontab and die together, and until now nothing said whether any of them was
   alive — which matters most for apwatch, the watchdog that exists precisely for
   the case where a traveller has only a phone and a dead radio.

   Two diagnoses, two remedies, so they are not collapsed into one sentence. */
function renderJobs(d) {
    var box = $('#jobs');
    if (!box) return;
    clear(box);
    var j = d.jobs;
    if (!j || j.state !== 'stale' || !(j.stale || []).length) return;
    /* Every program the panel can name, in the words the owner would use for
       what it DOES. The fallback below renders a bare program name, which is
       the one thing this panel is written to avoid: two of these were reaching
       the reader as `notifymon` and `wifiwatch` in a paragraph otherwise free
       of jargon. */
    var names = { dashmon: 'history and reachability', apwatch: 'the Wi-Fi watchdog',
                  vpnwatch: 'automatic VPN release', notifymon: 'push notifications',
                  wifiwatch: 'real-time Wi-Fi alerts' };
    var which = j.stale.map(function (n) { return names[n] || n; }).join(', ');
    var n = OS.note(j.cron === false
        ? 'The scheduler is not running, so nothing that recovers this router on its own ' +
          'is running either — including the Wi-Fi watchdog that restarts a radio when it ' +
          'stops answering. Restart it over SSH with:  /etc/init.d/cron restart'
        : 'A background job has stopped completing: ' + which + '. The scheduler itself is ' +
          'still running, so this is that job failing rather than the whole schedule. ' +
          'Its log lines are under Settings, in the system log.' +
          /* The panel now covers a procd SERVICE as well as the cron jobs, and
             the two have different remedies. Naming the one that applies beats
             a general instruction the reader has to translate. */
          (j.stale.indexOf('wifiwatch') >= 0
             ? '  Real-time Wi-Fi alerts are a service rather than a scheduled job: ' +
               'restart it over SSH with  /etc/init.d/wifiwatch restart'
             : ''),
        'warn');
    n.style.marginBottom = '14px';
    box.appendChild(n);
}

function render(d) {
    if (!d || !d.ok) return;
    last = d;
    var M = model(d);
    renderFirewall(d);
    renderJobs(d);
    renderTopo(d, M);
    renderSys(d);
    renderClients(d, M);
    renderTraffic(d, M);
}

OS.tp = new OS.Transport(API, render, {
    interval: 5000,
    onError: function (msg, fails) {
        if (fails === 3) OS.toast('Lost contact with the router (' + msg + '). Retrying with a longer gap.', 'bad');
    }
});
OS.tp.start();

/* draw the placeholder before the first sample lands, so the panel does not

drawRibbon();

loadProbeTargets();
$('#probeSel').addEventListener('change', function () {
    /* The last entry is a destination, not a target: adding and removing saved
       addresses belongs on the Settings page, where a list can be shown and
       edited, rather than in a control that has to stay one line tall. */
    if (this.value === 'manage') {
        showCustom(false);
        paintProbe();                       /* put the control back first */
        location.href = '/settings/#ping';
        return;
    }
    if (this.value === 'custom') {
        /* needs an address before it means anything, so the select alone does
           not commit — it opens the field and waits */
        showCustom(true);
        $('#probeIp').focus();
        $('#probeIp').select();
        return;
    }
    showCustom(false);
    if (this.value.indexOf('ip:') === 0) {
        setProbe('custom', this.value.slice(3));
        return;
    }
    setProbe(this.value, '');
});
$('#probeGo').addEventListener('click', function () {
    var ip = $('#probeIp').value.replace(/\s+/g, '');
    if (ip) setProbe('custom', ip);
});
$('#probeIp').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('#probeGo').click(); }
});
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, fastStart, { passive: true });
});
document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') fastStart(); else fastStop();
});
fastStart();
})();
</script>
</body>
</html>
