    <div class="face">

        <div class="panel__h">

        </div>
        <div class="panel__b panel__b--flush" id="tunnels">

      <section class="panel" id="p-agh" hidden>
        <div class="panel__h"><span class="panel__t">Content filtering</span>

<script src="/os.js?v=b21f8853"></script>
<script>
(function () {
'use strict';
var API = '/cgi-bin/vpn-api', DASH = '/cgi-bin/dashboard-api';
var el = OS.el, $ = OS.$, clear = OS.clear, setTxt = OS.setTxt;

/* Networks whose devices never appear on this page. Smart-home gear does not
   belong in a tunnel and listing it would bury the devices that do. Everything
   else - the main network, guests - is routable and gets its own section. */
var SKIP_NETS = ['iot'];

OS.buildShell('/vpn/');

var devices = [];        /* from dashboard-api, fetched rarely on purpose */
var cmap = {};           /* mac -> classmap entry, for devices no longer present */

function nameOf(mac) {
    var v = devices.filter(function (x) { return x.mac === mac; })[0];
    if (v) return v.name;
    return (cmap[mac] && cmap[mac].name) || mac;
}
/* A ROUTING POLICY IS NOT A CONNECTION. The policy says "when this device is
   here, send it through that tunnel", and it stays in place while the device is
   asleep, taken out of the house, or gone for good. The map is a picture of
   what is happening now, so it only draws devices that are actually here; the
   policy itself is still listed under Device routing, and the count line says
   how many are configured but away.
   Before the device list has arrived nothing can be called absent — saying so
   would blank the map for a second on every load. */
function presentOf(mac) {
    if (!devicesLoaded) return true;
    var v = devices.filter(function (x) { return x.mac === mac; })[0];
    return !!v && v.how !== 'Not connected';
}
var routeOpen = {};      /* mac -> selector expanded (mobile), survives polls */
var devicesLoaded = false;
var expanded = {};
var last = null;
/* Was per-device routing down on the PREVIOUS poll? Adding a route restarts pbr
   in the background, so a single sample can land in that gap; the alarm needs to
   see the condition twice, 5s apart, before it says anything. */
var pbrWasDown = false;

$('#addBtn').appendChild(OS.icon('plus'));
$('#addBtn').appendChild(document.createTextNode('Add tunnel'));
OS.dockAction('#actSlot');
$('#rescanDev').appendChild(OS.icon('search'));

/* vertical routed map for phones: same vocabulary, chain runs down */
var MQMAP = matchMedia('(max-width: 640px)');
if (MQMAP.addEventListener) MQMAP.addEventListener('change', function () {
    /* the route rows carry mobile-only interaction attributes, so they have to
       be rebuilt on a breakpoint change too — not just the map */
    if (last) { renderMap(last); renderDevices(last); }
});
function renderMapV(d) {
    var box = $('#vpnmap'); clear(box);
    var now = d.ts || Math.floor(Date.now() / 1e3);
    var pol = (d.policies || []).filter(function (p) { return p.enabled; });
    var byIface = {};
    pol.forEach(function (p) {
        var m = p.mac.toUpperCase();
        if (!presentOf(m)) return;          /* away: it belongs to the list, not the map */
        (byIface[p.iface] = byIface[p.iface] || []).push(m);
    });
    var used = (d.tunnels || []).filter(function (t) { return byIface[t.iface]; })
        .sort(function (a, b) { return (a.label || a.name).localeCompare(b.label || b.name); });
    if (!used.length) {
        /* "nothing is routed" and "everything routed is away" are different
           situations and the second one is not a prompt to go and configure
           something — it is already configured. */
        var anyPol = pol.length > 0;
        var e = anyPol
            ? OS.emptyState('Nothing routed is connected right now',
                pol.length + (pol.length === 1 ? ' device is' : ' devices are') +
                ' set up to use a tunnel, and none of them is on the network. ' +
                'The path appears here as soon as one comes back.', 'routing')
            : OS.emptyState('Nothing is routed through a tunnel',
                'Every device is using the normal uplink. Pick a tunnel for a device below and ' +
                'its path is drawn here.', 'routing');
        e.style.padding = '4px 0 12px';
        box.appendChild(e);
        return;
    }
    var sv = OS.sv, svtext = OS.svtext;
    var W = 360, LX = 34, NW = W - LX - 14, cx = LX + 20;
    var H = 0;
    used.forEach(function (t) { H += byIface[t.iface].length * 20 + 14 + 34 + 14 + 44 + 14 + 30 + 22; });
    var s2 = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, 'class': 'topo',
                         preserveAspectRatio: 'xMidYMin meet' });
    s2.style.width = '100%'; s2.style.height = 'auto';
    var y = 4;
    used.forEach(function (t) {
        var macs = byIface[t.iface];
        var up = !t.disabled && t.up && t.handshake && (now - t.handshake) <= 200;
        var cls = up ? 'on' : 'off';
        /* The trunk has to start at the FIRST device's stub. It used to be
           derived as y-14 after the loop, which lands on the LAST stub, so
           every device above it hung unconnected — correct only while a tunnel
           carried exactly one device. */
        var trunkTop = y + 6;
        macs.forEach(function (m) {
            s2.appendChild(sv('path', { 'class': 'link ' + cls,
                d: 'M' + cx + ' ' + (y + 6) + ' H' + (cx + 16) }));
            s2.appendChild(svtext(cx + 24, y + 10, nameOf(m), 't1'));
            y += 20;
        });
        /* The flow overlay is drawn in the SAME segments as the links, never as
           one long run. The node boxes sit at x=LX with the trunk at cx=LX+20,
           i.e. the line passes *inside* them horizontally, and .nodebox.on is
           filled with --sig-dim at 15% alpha — so a flow path spanning the
           whole column showed through both boxes and crossed the "Beryl 7" and
           tunnel-name text. */
        y += 6;
        s2.appendChild(sv('path', { 'class': 'link ' + cls,
            d: 'M' + cx + ' ' + trunkTop + ' V' + y }));
        if (up) s2.appendChild(sv('path', { 'class': 'flow',
            d: 'M' + cx + ' ' + trunkTop + ' V' + y }));
        s2.appendChild(sv('rect', { 'class': 'nodebox on', x: LX, y: y, width: 110, height: 30, rx: 2 }));
        s2.appendChild(svtext(LX + 12, y + 19, 'Beryl 7', 't1'));
        y += 30;
        s2.appendChild(sv('path', { 'class': 'link ' + cls, d: 'M' + cx + ' ' + y + ' V' + (y + 14) }));
        if (up) s2.appendChild(sv('path', { 'class': 'flow', d: 'M' + cx + ' ' + y + ' V' + (y + 14) }));
        y += 14;
        s2.appendChild(sv('rect', { 'class': 'nodebox ' + (up ? 'on' : 'bad'),
            x: LX, y: y, width: NW, height: 44, rx: 2 }));
        s2.appendChild(svtext(LX + 12, y + 18, t.label || t.name, 't1'));
        s2.appendChild(svtext(LX + 12, y + 34,
            up ? 'handshake ' + OS.ago(t.handshake, now)
               : (t.disabled ? 'off' : 'no handshake'), 't2'));
        y += 44;
        s2.appendChild(sv('path', { 'class': 'link ' + cls, d: 'M' + cx + ' ' + y + ' V' + (y + 14) }));
        if (up) s2.appendChild(sv('path', { 'class': 'flow', d: 'M' + cx + ' ' + y + ' V' + (y + 14) }));
        y += 14;
        var ep = (t.endpoint || '').split(':')[0];
        s2.appendChild(svtext(LX, y + 12, ep || 'endpoint', 't1'));
        s2.appendChild(svtext(LX, y + 27, up ? 'to the internet' : 'unreachable', 't2'));
        y += 30 + 22;
    });
    box.appendChild(s2);
}

/* ------------------------------------------------------------ routed map -- */
function renderMap(d) {
    if (MQMAP.matches) { renderMapV(d); return; }
    var box = $('#vpnmap'); clear(box);
    var now = d.ts || Math.floor(Date.now() / 1e3);
    var pol = (d.policies || []).filter(function (p) { return p.enabled; });
    var byIface = {};
    pol.forEach(function (p) {
        var m = p.mac.toUpperCase();
        if (!presentOf(m)) return;          /* away: it belongs to the list, not the map */
        (byIface[p.iface] = byIface[p.iface] || []).push(m);
    });
    var used = (d.tunnels || []).filter(function (t) { return byIface[t.iface]; })
        .sort(function (a, b) { return (a.label || a.name).localeCompare(b.label || b.name); });

    if (!used.length) {
        /* "nothing is routed" and "everything routed is away" are different
           situations and the second one is not a prompt to go and configure
           something — it is already configured. */
        var anyPol = pol.length > 0;
        var e = anyPol
            ? OS.emptyState('Nothing routed is connected right now',
                pol.length + (pol.length === 1 ? ' device is' : ' devices are') +
                ' set up to use a tunnel, and none of them is on the network. ' +
                'The path appears here as soon as one comes back.', 'routing')
            : OS.emptyState('Nothing is routed through a tunnel',
                'Every device is using the normal uplink. Pick a tunnel for a device below and ' +
                'its path is drawn here.', 'routing');
        e.style.padding = '8px 0 16px';
        box.appendChild(e);
        return;
    }

    var sv = OS.sv, svtext = OS.svtext;
    var W = 940, rowH = 48;
    var lanes = used.map(function (t) { return { t: t, macs: byIface[t.iface] }; });
    var H = 26 + lanes.reduce(function (a, L) {
        return a + Math.max(rowH, L.macs.length * 22 + 28); }, 0);
    var s2 = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, 'class': 'topo',
                         preserveAspectRatio: 'xMinYMid meet' });
    s2.style.height = H + 'px'; s2.style.minWidth = '620px';

    var y = 20;
    var colDev = 16, colRouter = 296, colTun = 462, colNet = 756;
    s2.appendChild(svtext(colDev, 10, 'Device', 'cap'));
    s2.appendChild(svtext(colRouter, 10, 'Router', 'cap'));
    s2.appendChild(svtext(colTun, 10, 'Tunnel', 'cap'));
    s2.appendChild(svtext(colNet + 8, 10, 'Exit', 'cap'));

    lanes.forEach(function (L) {
        var t = L.t;
        var up = !t.disabled && t.up && t.handshake && (now - t.handshake) <= 200;
        /* +28, not +26. The lane centre is where the router box sits and where
           the line into it is drawn; the device rows are at 14 + i*22. With
           +26 the centre lands exactly 1px off a row for every even device
           count — two horizontals a pixel apart both meeting the bus, which
           renders as a thick smudged junction rather than a join. +28 puts the
           centre either exactly ON a row (even counts, so the row and the
           box-entry line are one straight line) or a clean 11px between rows
           (odd counts). */
        var laneH = Math.max(rowH, L.macs.length * 22 + 28);
        var mid = y + laneH / 2;
        var cls = up ? 'on' : 'off';

        /* Trunk and spur. Each device runs to a shared vertical bus held OFF
           the box, then one line carries into the router at the lane's centre:

               Tablet    ----+
                             |---[ Beryl 7 ]
               Phone     ----+

           The bus is at colRouter-14, not on colRouter itself. Drawn on the
           edge it merged with the box border and the device rows appeared to
           graze the top-left corner rather than connect to anything. Spanning
           the rows AND mid means it joins correctly for any device count,
           including one (where the row and the centre differ by 10px). */
        var busX = colRouter - 14;
        /* Centre the block of device rows on the lane, so the router box ends
           up BETWEEN the names rather than level with the last one. Pinning
           the rows to a fixed y+14 while the box tracked the lane centre is
           what made the box look like it had sagged once a tunnel carried two
           devices. Both now share one axis: rows centred on mid, box centred
           on mid. */
        var rowTop = y + (laneH - (L.macs.length - 1) * 22) / 2;
        L.macs.forEach(function (m, i) {
            var ty = rowTop + i * 22;
            s2.appendChild(svtext(colDev, ty + 4, nameOf(m), 't1'));
            s2.appendChild(sv('path', { 'class': 'link ' + cls,
                d: 'M' + (colDev + 236) + ' ' + ty + ' H' + busX }));
            if (up) s2.appendChild(sv('path', { 'class': 'flow',
                d: 'M' + (colDev + 236) + ' ' + ty + ' H' + busX }));
        });

        var busTop = Math.min(rowTop, mid);
        var busBot = Math.max(rowTop + (L.macs.length - 1) * 22, mid);
        if (busBot > busTop) {
            s2.appendChild(sv('path', { 'class': 'link ' + cls,
                d: 'M' + busX + ' ' + busTop + ' V' + busBot }));
            if (up) s2.appendChild(sv('path', { 'class': 'flow',
                d: 'M' + busX + ' ' + busTop + ' V' + busBot }));
        }
        s2.appendChild(sv('path', { 'class': 'link ' + cls,
            d: 'M' + busX + ' ' + mid + ' H' + colRouter }));
        if (up) s2.appendChild(sv('path', { 'class': 'flow',
            d: 'M' + busX + ' ' + mid + ' H' + colRouter }));

        s2.appendChild(sv('rect', { 'class': 'nodebox on', x: colRouter, y: mid - 14,
            width: 92, height: 28, rx: 2 }));
        s2.appendChild(svtext(colRouter + 10, mid + 4, 'Beryl 7', 't1'));
        s2.appendChild(sv('path', { 'class': 'link ' + cls,
            d: 'M' + (colRouter + 92) + ' ' + mid + ' H' + colTun }));
        if (up) s2.appendChild(sv('path', { 'class': 'flow',
            d: 'M' + (colRouter + 92) + ' ' + mid + ' H' + colTun }));

        s2.appendChild(sv('rect', { 'class': 'nodebox ' + (up ? 'on' : 'bad'),
            x: colTun, y: mid - 20, width: 218, height: 40, rx: 2 }));
        s2.appendChild(svtext(colTun + 12, mid - 2, t.label || t.name, 't1'));
        s2.appendChild(svtext(colTun + 12, mid + 13,
            up ? 'handshake ' + OS.ago(t.handshake, now)
               : (t.disabled ? 'off' : 'no handshake'), 't2'));

        s2.appendChild(sv('path', { 'class': 'link ' + cls,
            d: 'M' + (colTun + 218) + ' ' + mid + ' H' + colNet }));
        if (up) s2.appendChild(sv('path', { 'class': 'flow',
            d: 'M' + (colTun + 218) + ' ' + mid + ' H' + colNet }));

        var ep = (t.endpoint || '').split(':')[0];
        s2.appendChild(svtext(colNet + 8, mid - 2, ep || 'endpoint', 't1'));
        s2.appendChild(svtext(colNet + 8, mid + 13,
            up ? 'to the internet' : 'unreachable', 't2'));
        y += laneH;
    });
    box.appendChild(s2);

    /* Second pass, after the SVG is in the document so text can be measured:
       pull the device stubs left until they start just past the longest name.
       The device column is a fixed 236px, but the names are nowhere near that
       wide — measured here, the longest ends at 134, leaving 118px of dead air
       with a short dash floating in the middle of it. A constant would work
       until a device gets renamed to something longer, so it is measured.
       Clamped so a very long name cannot push the stub into the bus. */
    var maxEnd = 0;
    Array.prototype.forEach.call(s2.querySelectorAll('text.t1'), function (t) {
        if (+t.getAttribute('x') === colDev) {
            maxEnd = Math.max(maxEnd, colDev + t.getComputedTextLength());
        }
    });
    if (maxEnd > 0) {
        var startX = Math.min(Math.ceil(maxEnd) + 14, colRouter - 14 - 24);
        Array.prototype.forEach.call(s2.querySelectorAll('path'), function (p) {
            var m = (p.getAttribute('d') || '').match(/^M([\d.]+) ([\d.]+) H([\d.]+)$/);
            if (m && +m[1] === colDev + 236) {
                p.setAttribute('d', 'M' + startX + ' ' + m[2] + ' H' + m[3]);
            }
        });
    }
}

/* --------------------------------------------------------------- tunnels - */
function handshakeAge(t, now) {
    if (!t.handshake) return null;
    return now - t.handshake;
}
/* Live state is a state word, exactly like every other list row in the console
   (clients, scan results, internet sources). Chips are reserved for inline
   labels attached to a name — VPN, guest, Wi-Fi 7, 160 MHz. */
function tunnelState(t, now) {
    if (t.disabled) return { k: 'off', word: ['OFF', 'idle'], tone: 'idle' };
    var a = handshakeAge(t, now);
    if (!t.up) return { k: 'down', word: ['DOWN', 'bad'], tone: 'bad' };
    if (a == null) return { k: 'connecting', word: ['CONNECTING', 'warn'], tone: 'warn' };
    if (a > 200) return { k: 'stale', word: ['NO HANDSHAKE', 'bad'], tone: 'bad' };
    return { k: 'up', word: ['CONNECTED', 'ok'], tone: null };
}

function renderTunnels(d) {
    var box = $('#tunnels'); clear(box);
    var now = d.ts || Math.floor(Date.now() / 1e3);
    /* alphabetical everywhere a tunnel is listed, so the same server is always
       in the same place whatever order the router returns them in */
    var list = (d.tunnels || []).slice().sort(function (a, b) {
        return (a.label || a.name).localeCompare(b.label || b.name);
    });
    setTxt($('#tunCount'), list.length ? list.length + ' configured' : '');

    if (!list.length) {
        box.appendChild(OS.emptyState('No tunnels yet',
            'Use Add tunnel above to paste a WireGuard configuration or upload the .conf file. ' +
            'Every device on this page can then route through it.',
            'routing'));
        return;
    }
    list.forEach(function (t) {
        var s = tunnelState(t, now);
        var r = el('div', 'row');
        r.style.gridTemplateColumns = 'minmax(0,1fr) auto auto';
        r.setAttribute('role', 'button'); r.setAttribute('tabindex', '0');
        r.setAttribute('aria-expanded', expanded[t.name] ? 'true' : 'false');

        var id = el('div', 'row__id');
        var ic = el('div', 'row__ico'); ic.appendChild(OS.icon('routing'));
        if (s.k === 'up') { ic.style.borderColor = 'var(--ac-line)'; ic.style.color = 'var(--ac-fg)'; }
        id.appendChild(ic);
        var txt = el('div'); txt.style.minWidth = '0';
        txt.appendChild(el('div', 'row__nm', t.label || t.name));
        /* endpoint only: MTU is a diagnostic, not something you scan a list by.
           It stays in the expanded detail. */
        var ep = (t.endpoint || '').split(':')[0];
        txt.appendChild(el('div', 'row__sub', ep));
        id.appendChild(txt);
        r.appendChild(id);

        var mid = el('div');
        mid.appendChild(OS.stateWord(s.word[0], s.word[1]));
        r.appendChild(mid);

        var right = el('div'); right.style.cssText = 'text-align:right;min-width:88px';
        var a = handshakeAge(t, now);
        if (!t.disabled && t.up && a != null) {
            right.appendChild(el('div', 'row__num', '↓ ' + OS.bytes(t.rx)));
            right.appendChild(el('div', 'row__cap', 'handshake ' + OS.ago(t.handshake, now)));
        } else {
            /* no second line: the state chip beside it already says off/down/
               connecting — repeating it here doubled the same word on one row */
            right.appendChild(el('div', 'row__num', '—'));
        }
        r.appendChild(right);

        function toggle() { expanded[t.name] = !expanded[t.name]; render(last); }
        r.addEventListener('click', toggle);
        r.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
        });
        box.appendChild(r);
        if (expanded[t.name]) box.appendChild(tunnelDetail(t, s, now, d));
    });
}

function tunnelDetail(t, s, now, d) {
    var box = el('div', 'det');
    var acts = el('div', 'inline'); acts.style.marginBottom = '14px';

    var toggleBtn = el('button', 'btn btn--sm' + (t.disabled ? ' btn--primary' : ''));
    toggleBtn.appendChild(OS.icon('power'));
    toggleBtn.appendChild(document.createTextNode(t.disabled ? 'Connect' : 'Disconnect'));
    toggleBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        OS.act(toggleBtn, API, { action: t.disabled ? 'up' : 'down', name: t.name },
            { ok: t.disabled ? 'Connecting ' + (t.label || t.name) + '…' : (t.label || t.name) + ' disconnected.',
              delay: 2200 });
    });
    acts.appendChild(toggleBtn);

    var users = (d.policies || []).filter(function (p) { return p.iface === t.iface && p.enabled; });
    var delBtn = el('button', 'btn btn--sm btn--danger');
    delBtn.appendChild(OS.icon('x'));
    delBtn.appendChild(document.createTextNode('Delete'));
    delBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        OS.askConfirm('Delete ' + (t.label || t.name),
            'The tunnel and its keys are removed from the router permanently.' +
            (users.length ? ' ' + users.length + ' device' + (users.length > 1 ? 's are' : ' is') +
             ' currently routed through it and will fall back to the normal uplink.' : ''),
            'Delete', true
        ).then(function (go) {
            if (!go) return;
            OS.act(delBtn, API, { action: 'del', name: t.name },
                { ok: (t.label || t.name) + ' deleted.', delay: 1200 });
        });
    });
    acts.appendChild(delBtn);
    box.appendChild(acts);

    if (s.k === 'stale') {
        var n = OS.note('The interface is up but the peer has not completed a handshake in ' +
            OS.dur(now - t.handshake) + '. Devices pinned to this tunnel have no internet unless ' +
            'the fallback below is set to keep them online.', 'bad');
        n.style.marginBottom = '14px';
        box.appendChild(n);
    }

    var dl = el('dl', 'kv');
    function kv(k, v) {
        if (v == null || v === '') return;
        dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, String(v)));
    }
    kv('Interface', t.iface);
    kv('Endpoint', t.endpoint);
    kv('Addresses', (t.addresses || '').split(',').join('   '));
    kv('DNS', (t.dns || '').split(',').join('   '));
    kv('Allowed IPs', (t.allowed_ips || '').split(',').join('   '));
    kv('MTU', t.mtu);
    kv('Peer public key', t.public_key);
    kv('Transferred', '↓ ' + OS.bytes(t.rx) + '   ↑ ' + OS.bytes(t.tx));
    kv('Last handshake', t.handshake ? OS.ago(t.handshake, now) : 'never');
    kv('Devices routed', users.length ? users.length : 'none');
    box.appendChild(dl);
    return box;
}

/* -------------------------------------------------------- device routing - */
function loadDevices(force) {
    if (devicesLoaded && !force) return Promise.resolve();
    /* Device identity changes on the scale of minutes, tunnel state on the
       scale of seconds. Fetching this once (and after a write) instead of on
       every poll is the single biggest CPU saving on this page. */
    return fetch(DASH, { cache: 'no-store' }).then(function (r) { return r.json(); })
        .then(function (d) {
            if (!d || !d.ok) return;
            var seen = {}, out = [];
            (d.aps || []).forEach(function (a) {
                /* Only the primary LAN routes through a VPN. Anything on a
                   secondary network — IoT, guest, whatever it is called on a
                   given router — is excluded by the network it sits on rather
                   than by name. Matching a literal SSID both published this
                   deployment's private one and broke on any other router. */
                /* Devices on a network OTHER than the primary one used to be
                   dropped here, which quietly made them unroutable: the guest
                   network's firewall zone forwards to wg, pbr would have applied
                   a policy to them perfectly well, and the only thing missing
                   was a row on this page. Smart-home networks stay out - a plug
                   has no business in a tunnel and listing them is noise - but
                   that is now a decision about WHICH network, not a blanket
                   "anything but the LAN". */
                if (SKIP_NETS.indexOf(a.network) >= 0) return;
                ((a.assoc && a.assoc.results) || []).forEach(function (c) {
                    var m = String(c.mac).toUpperCase();
                    if (seen[m]) return; seen[m] = 1;
                    push(m, a.band === '5g' ? '5 GHz' : '2.4 GHz', d, a.network);
                });
            });
            (d.wired || []).forEach(function (w) {
                var m = String(w.mac || '').toUpperCase();
                if (!m || seen[m]) return; seen[m] = 1;
                push(m, w.link === 'wired' ? 'Ethernet' : 'Not connected', d, OS.LANNET);
            });
            function push(m, how, d, net) {
                var cm = (d.classmap || {})[m] || {}, h = (d.hosts || {})[m] || {},
                    L = (d.leases || {})[m] || null;
                out.push({
                    mac: m, how: how, net: net || OS.LANNET, cls: cm.class || 'default',
                    name: cm.name || (L && L.name && L.name !== '*' ? L.name : null) ||
                          (h.name ? String(h.name).replace(/\.lan$/, '') : null) || m,
                    ip: (L && L.ip) || cm.ip || (h.ipaddrs && h.ipaddrs[0]) || ''
                });
            }
            out.sort(function (a, b) { return a.name.localeCompare(b.name); });
            devices = out; devicesLoaded = true;
            /* Kept separately so a device the router has since forgotten —
               no lease, no neighbour entry — can still be named. A policy
               outlives the device's presence, and a bare MAC is a worse
               answer than the name you gave it. */
            cmap = d.classmap || {};

            /* This page has no uplink data of its own, which left the rail's
               Uplink row as a placeholder here and live on every other page.
               The device fetch already carries the answer, so name it — same
               three words the Overview and USB pages use. It refreshes with
               the device list rather than with the 10s poll, which is why the
               row is filled from a known-good read rather than guessed. */
            var UPN = { wan: 'Ethernet', wwan: 'Wi-Fi',
                        tethering: 'USB', none: 'None' };
            var ua = (d.uplink && d.uplink.active) || 'none';
            OS.stage('source', UPN[ua] || ua, ua === 'none' ? 'fault' : 'live');
        }).catch(function () { /* the tunnel view still works without it */ });
}

function renderDevices(d) {
    var box = $('#devices'); clear(box);
    /* Until the device fetch lands, `devices` is legitimately empty — rendering
       the empty state here flashed "No devices to route" on every page load. */
    if (!devicesLoaded) {
        var sk = el('div', 'panel__b');
        ['58%', '44%'].forEach(function (w) {
            var b = el('div', 'sk'); b.style.width = w; b.style.marginBottom = '10px';
            sk.appendChild(b);
        });
        box.appendChild(sk);
        return;
    }
    /* A device the router released under "keep it online" still HAS its rule —
       it is coming back the moment the tunnel answers. Showing it as plain
       Direct made an automatic, temporary thing look like a lost setting, and
       the reasonable response to that is to set it again by hand, which is
       exactly what happened. So paused rules keep their tunnel on the row and
       say what is going on; only genuinely-Direct devices read as Direct. */
    var pol = {}, paused = {};
    (d.policies || []).forEach(function (p) {
        var m = p.mac.toUpperCase();
        if (p.enabled) pol[m] = p.iface;
        else if (p.auto_paused) paused[m] = p.iface;
    });
    var n = Object.keys(pol).length, np = Object.keys(paused).length;
    setTxt($('#polCount'), n ? n + ' routed through a tunnel' + (np ? ', ' + np + ' waiting' : '')
                             : np ? np + ' waiting for a tunnel' : 'all direct');
    /* Both maps mean "this device has a rule", one carrying and one temporarily
       released. Every question of the form "is there a rule here" has to ask
       both, or a released device falls out of the list that is the only place
       its rule can be edited. */
    var assigned = {};
    Object.keys(pol).forEach(function (m) { assigned[m] = pol[m]; });
    Object.keys(paused).forEach(function (m) { assigned[m] = paused[m]; });

    var tuns = (d.tunnels || []).slice().sort(function (a, b) {
        return (a.label || a.name).localeCompare(b.label || b.name);
    });
    /* Offline devices are dropped: you cannot meaningfully route something that
       is not here. The exception is a device that still HOLDS a policy — hiding
       that would strand a rule with no way to clear it. */
    var routable = devices.filter(function (v) {
        return v.how !== 'Not connected' || assigned[v.mac];
    });
    /* …and that exception has to cover the case where the device is not in the
       list at all. A policy outlives every trace of the device: no association,
       no bridge entry, no DHCP lease, no ARP entry — at which point filtering
       `devices` cannot keep something that was never in it, and the rule became
       unreachable from this page. The map hides these; this list must not,
       because this is the only place the rule can be cleared.
       It is synthesised from the policy itself, so it disappears the moment the
       device is set back to Direct — the refresh after that change re-renders
       with the policy gone, and nothing generates the row. */
    var known = {};
    devices.forEach(function (v) { known[v.mac] = 1; });
    Object.keys(assigned).forEach(function (m) {
        if (known[m]) return;
        routable.push({ mac: m, name: nameOf(m), how: 'Not connected',
                        net: (cmap[m] && cmap[m].zone) || OS.LANNET,
                        cls: (cmap[m] && cmap[m].class) || 'default', ip: '' });
    });
    /* devices arrives sorted; the additions have to be merged into that order
       rather than piled on the end. */
    routable.sort(function (a, b) { return a.name.localeCompare(b.name); });
    renderDevices.shown = routable.length;

    if (!routable.length) {
        box.appendChild(OS.emptyState('No devices to route',
            'Connected devices appear here, grouped by the network they are on. Offline ' +
            'devices are left out, and smart-home devices are excluded entirely \u2014 they ' +
            'never route through a tunnel.', 'dev'));
        return;
    }

    /* GROUPED BY NETWORK, primary first, then the rest by name. Two devices can
       carry the same tunnel policy and mean quite different things depending on
       which network they sit on - a guest routed through a tunnel is a guest
       whose traffic leaves by a different country - so the page says which,
       once per group, instead of leaving it to be inferred from a row. The sort
       INSIDE each group is by device name, which is the order the rest of this
       page uses and the only one worth scanning. */
    var byNet = {};
    routable.forEach(function (v) { (byNet[v.net] = byNet[v.net] || []).push(v); });
    /* Main first, then guest, then anything else - the shared order, so this
       page and the Overview cannot disagree about which comes first. */
    var netOrder = Object.keys(byNet).sort(OS.netCmp);
    /* One network means one group, and a heading over a single group is a label
       for something with nothing to distinguish it from. */
    var showHeads = netOrder.length > 1;

    netOrder.forEach(function (netKey) {
    var group = byNet[netKey].slice().sort(function (a, b) {
        return a.name.localeCompare(b.name);
    });
    if (showHeads) {
        var gh = el('div', 'tbl__group');
        gh.appendChild(OS.icon(netKey === OS.LANNET ? 'dev' : 'wifi'));
        gh.appendChild(el('span', 'tbl__gk', OS.netLabel(netKey)));
        gh.appendChild(el('span', 'tbl__gn', String(group.length)));
        box.appendChild(gh);
    }
    group.forEach(function (v) {
        var cur = assigned[v.mac] || '';
        var curT = tuns.filter(function (t) { return t.iface === cur; })[0];
        var r = el('div', 'row row--route');
        /* only a disclosure control on mobile; on desktop the select is resident
           and the row is not interactive, so it must not claim to be */
        if (MQMAP.matches) {
            r.setAttribute('role', 'button');
            r.setAttribute('tabindex', '0');
            r.setAttribute('aria-expanded', routeOpen[v.mac] ? 'true' : 'false');
        }

        var id = el('div', 'row__id');
        var ic = el('div', 'row__ico'); ic.appendChild(OS.icon(OS.CLASS_ICON[v.cls] || 'dev'));
        if (cur) { ic.style.borderColor = 'var(--ac-line)'; ic.style.color = 'var(--ac-fg)'; }
        id.appendChild(ic);
        var txt = el('div'); txt.style.minWidth = '0';
        var isPaused = !!paused[v.mac];
        /* The chip is the only signal that survives on DESKTOP: .routeline is
           display:none above 640px, where the selector stands in for it — and a
           selector showing the tunnel says nothing about the tunnel not
           currently carrying anything. Wrapped only when paused, so the common
           row keeps exactly the markup it had. */
        if (isPaused) {
            var nmw = el('div');
            nmw.style.cssText = 'display:flex;align-items:center;gap:6px;min-width:0';
            nmw.appendChild(el('div', 'row__nm', v.name));
            var chip = el('span', 'chip chip--warn', 'waiting');
            chip.title = 'The tunnel stopped answering, so this device went back to the normal ' +
                         'uplink to keep it working. Its rule is still here — it returns to the ' +
                         'tunnel within a few seconds of the tunnel coming back. Nothing to do.';
            nmw.appendChild(chip);
            txt.appendChild(nmw);
        } else {
            txt.appendChild(el('div', 'row__nm', v.name));
        }
        txt.appendChild(el('div', 'row__sub', (v.ip || v.mac) + '  ·  ' + v.how));
        /* the current route is always on the row; the selector is summoned */
        txt.appendChild(el('div', 'routeline' +
            (curT ? (isPaused ? ' routeline--paused' : ' routeline--vpn') : ''),
            curT ? (curT.label || curT.name) + (isPaused ? ' · waiting for the tunnel' : ' · VPN')
                 : 'Direct · normal uplink'));
        id.appendChild(txt);
        r.appendChild(id);
        r.appendChild(el('i', 'rcaret'));

        var sel = el('select', 'select');
        sel.setAttribute('aria-label', 'Internet route for ' + v.name);
        sel.addEventListener('click', function (e) { e.stopPropagation(); });
        var o0 = el('option', null, 'Direct · normal uplink'); o0.value = '';
        sel.appendChild(o0);
        tuns.forEach(function (t) {
            var o = el('option', null, (t.label || t.name) + (t.disabled ? '  (off)' : ''));
            o.value = t.name;
            if (t.iface === cur) o.selected = true;
            sel.appendChild(o);
        });
        sel.addEventListener('change', function () {
            var name = sel.value, lbl = sel.options[sel.selectedIndex].textContent;
            sel.disabled = true;
            OS.post(API, { action: 'route', mac: v.mac, name: name }).then(function (j) {
                sel.disabled = false;
                if (j && j.ok) {
                    delete routeOpen[v.mac];
                    OS.toast(name
                        ? v.name + ' now routes through ' + lbl.replace(/\s+\(off\)$/, '') + '.'
                        : v.name + ' is back on the normal uplink.', 'ok');
                    OS.tp.refresh(700);
                } else {
                    OS.toast('Could not change the route: ' + ((j && j.error) || 'unknown error') + '.', 'bad');
                    OS.tp.refresh(200);
                }
            });
        });
        r.appendChild(sel);
        function toggleRoute() {
            if (!MQMAP.matches) return;
            routeOpen[v.mac] = !routeOpen[v.mac];
            r.setAttribute('aria-expanded', routeOpen[v.mac] ? 'true' : 'false');
        }
        r.addEventListener('click', toggleRoute);
        r.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleRoute(); }
        });
        box.appendChild(r);
    });
    });   /* end of the per-network group */
}

/* ----------------------------------------------------------- fail-mode --- */
function renderFailmode(d) {
    var box = $('#failmode'); clear(box);
    var mode = d.failmode === 'open' ? 'open' : 'closed';

    var opts = [
        ['closed', 'Block the device',
         'Nothing leaks. A device pinned to a dead tunnel simply has no internet until the tunnel ' +
         'recovers. This is the safe default.'],
        /* "restores it automatically" reads as "restores it promptly", and the
           owner of this router read it that way: he watched a device sit on the
           normal uplink for a minute after the uplink was already working, and
           re-enabled it by hand assuming something had broken. He had chosen
           this mode knowingly — what was missing was the timing. Say it. */
        ['open', 'Keep it online without the tunnel',
         'If the tunnel stops answering for three minutes, the router temporarily sends the device ' +
         'back to the normal uplink so it keeps working, then puts it back on the tunnel within ' +
         'a few seconds of the tunnel answering again. Traffic is not private in between — that ' +
         'is the whole trade, and it lasts as long as the tunnel is actually down.']
    ];
    opts.forEach(function (o) {
        var lab = el('label');
        lab.style.cssText = 'display:flex;gap:12px;align-items:flex-start;padding:12px;' +
            'border:1px solid ' + (mode === o[0] ? 'var(--ac-line)' : 'var(--line-2)') + ';' +
            'background:' + (mode === o[0] ? 'var(--ac-dim)' : 'transparent') + ';' +
            'border-radius:var(--r);cursor:pointer;margin-bottom:8px';
        var i = el('input'); i.type = 'radio'; i.name = 'fm'; i.value = o[0];
        i.checked = mode === o[0];
        i.style.cssText = 'margin:2px 0 0;flex:none;width:16px;height:16px;accent-color:var(--ac)';
        lab.appendChild(i);
        var t = el('div');
        var b = el('div', null, o[1]); b.style.cssText = 'font-size:13px;font-weight:600;margin-bottom:3px';
        t.appendChild(b);
        var hh = el('div', 'hint', o[2]);
        /* the selected card sits on --ac-dim, which lifts the ground enough that
           --ink-3 drops to 3.5:1 — this line is prose, so it takes --ink-2. */
        hh.style.cssText = 'margin-top:0;color:var(--ink-2)';
        t.appendChild(hh);
        lab.appendChild(t);
        i.addEventListener('change', function () {
            if (!i.checked) return;
            OS.post(API, { action: 'failmode', mode: o[0] }).then(function (j) {
                if (j && j.ok) { OS.toast('Fallback set to “' + o[1] + '”.', 'ok'); OS.tp.refresh(400); }
                else { OS.toast('Could not change it: ' + ((j && j.error) || 'unknown error') + '.', 'bad'); OS.tp.refresh(200); }
            });
        });
        box.appendChild(lab);
    });

    if (d.autopaused) {
        var n = OS.note('Per-device routing is paused because a tunnel stopped responding. ' +
            'It resumes on its own as soon as the handshake returns.', 'warn');
        n.style.marginTop = '4px';
        box.appendChild(n);
    }

    box.appendChild(el('div', 'rowsep'));
    var row = el('div', 'inline');
    var lbl = el('div');
    lbl.style.cssText = 'font-size:12.5px;color:var(--ink-2);flex:1;min-width:200px';
    lbl.textContent = 'Stuck with no internet away from home? This drops every device back to the ' +
                      'normal uplink in one step.';
    row.appendChild(lbl);
    var pb = el('button', 'btn btn--sm');
    pb.textContent = 'Pause all routing';
    pb.addEventListener('click', function () {
        OS.dialog({
            title: 'Pause all VPN routing',
            body: 'Every device goes back to the normal uplink immediately. Tunnels stay configured — ' +
                  'set each device back afterwards from the list above.',
            okText: 'Pause'
        }).then(function (go) {
            if (!go) return;
            OS.act(pb, API, { action: 'pauseall' }, { ok: 'All devices are back on the normal uplink.' });
        });
    });
    row.appendChild(pb);
    box.appendChild(row);
}

$('#addBtn').addEventListener('click', function () {
    var wrap = el('div');
    var f1 = el('div', 'field');
    f1.appendChild(el('label', 'label', 'Name'));
    var i1 = el('input', 'input');
    i1.placeholder = 'UK London 640';
    f1.appendChild(i1);
    f1.appendChild(el('div', 'hint', 'Optional — leave it blank and the name is taken from the ' +
        '.conf file, or from the filename when you upload one.'));
    wrap.appendChild(f1);
    var f2 = el('div', 'field');
    f2.appendChild(el('label', 'label', 'WireGuard configuration'));
    var ta = el('textarea', 'ta');
    ta.placeholder = '[Interface]\nPrivateKey = …\nAddress = 10.2.0.2/32\nDNS = 10.2.0.1\n\n[Peer]\nPublicKey = …\nEndpoint = 1.2.3.4:51820\nAllowedIPs = 0.0.0.0/0, ::/0';
    ta.spellcheck = false;
    f2.appendChild(ta);

    /* the .conf can be uploaded or dropped instead of pasted; the tunnel name
       is read from the filename when the name field is still empty */
    function readConf(file) {
        if (!file) return;
        var rd = new FileReader();
        rd.onload = function () {
            ta.value = String(rd.result || '');
            if (!i1.value.trim()) {
                i1.value = file.name.replace(/\.(conf|txt)$/i, '');
            }
            OS.toast('Loaded ' + file.name + '.', 'ok');
        };
        rd.onerror = function () { OS.toast('Could not read ' + file.name + '.', 'bad'); };
        rd.readAsText(file);
    }
    var fi = el('input'); fi.type = 'file';
    fi.accept = '.conf,.txt,text/plain'; fi.style.display = 'none';
    fi.addEventListener('change', function () { readConf(fi.files && fi.files[0]); fi.value = ''; });
    var upRow = el('div', 'inline'); upRow.style.marginTop = '8px';
    var ub = el('button', 'btn btn--sm'); ub.type = 'button';
    ub.appendChild(OS.icon('plus'));
    ub.appendChild(document.createTextNode('Upload .conf file'));
    ub.addEventListener('click', function () { fi.click(); });
    upRow.appendChild(ub); upRow.appendChild(fi);
    f2.appendChild(upRow);

    /* The drop target is the WHOLE dialog, not just the textarea. Dropping a
       file onto a browser is navigation by default, so a near-miss used to
       replace the page with the .conf and silently lose the dialog — which
       looks exactly like "I dropped it and nothing happened". */
    function armDrop(zone) {
        ['dragover', 'dragenter'].forEach(function (ev) {
            zone.addEventListener(ev, function (e) {
                e.preventDefault(); e.stopPropagation();
                ta.style.borderColor = 'var(--sig)';
                ta.style.boxShadow = '0 0 0 3px var(--sig-dim)';
            });
        });
        ['dragleave', 'drop'].forEach(function (ev) {
            zone.addEventListener(ev, function (e) {
                if (ev === 'drop') {
                    e.preventDefault(); e.stopPropagation();
                    readConf(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
                }
                ta.style.borderColor = ''; ta.style.boxShadow = '';
            });
        });
    }
    armDrop(ta);
    setTimeout(function () {
        var dlg = document.querySelector('.veil.on .dlg');
        if (dlg) armDrop(dlg);
    }, 0);

    f2.appendChild(el('div', 'hint', 'Paste the whole .conf, upload it, or drag the file onto the box. ' +
        'The private key is written straight to the router and never shown again.'));
    wrap.appendChild(f2);

    OS.dialog({
        title: 'Add a WireGuard tunnel', body: wrap, okText: 'Add',
        /* Stays open until the router actually accepts it. The old flow closed
           first and reported by toast, so a rejected config vanished along with
           everything the user had pasted. */
        onSubmit: function () {
            var nm = i1.value.trim(), cf = ta.value.trim();
            if (!cf) return 'Paste the configuration, or upload the .conf file.';
            if (!/\[Interface\]/i.test(cf) || !/PrivateKey/i.test(cf)) {
                return 'That does not look like a WireGuard .conf — no [Interface] ' +
                       'section or PrivateKey found.';
            }
            /* name is optional: the router derives it from the provider comment
               in the .conf, and the upload path fills it from the filename */
            return OS.post(API, { action: 'add', name: nm, conf: cf }).then(function (j) {
                if (j && j.ok) {
                    OS.toast((j.label || j.name || nm || 'Tunnel') + ' added.', 'ok');
                    /* The router drops DNS entries it cannot use rather than
                       refusing the whole config. Say so — a resolver silently
                       missing is how a routed device ends up leaking. */
                    if (j.warn) OS.toast(j.warn, 'warn');
                    OS.tp.refresh(400);
                    return true;
                }
                return 'The router refused it: ' + ((j && j.error) || 'unknown error');
            });
        }
    });
});

/* ----------------------------------------------------------------- boot -- */
/* AdGuard Home. On this page rather than a new one because it is network
   policy — what leaves the LAN and what gets stopped — same as the tunnels
   above it. The API emits null when the router has no AdGuard credentials
   file, and the whole panel stays hidden: nothing on this console may render
   an instrument for hardware or software the router does not have. */
function renderAdguard(d) {
    /* The travel-DNS fallback, rendered ABOVE AdGuard on purpose: while it is
       active, everything the AdGuard panel says below is true and beside the
       point, because dnsmasq is answering from an upstream AdGuard never sees.
       Hidden entirely in the ordinary case - a panel that says "normal" on
       every load of every day is one nobody reads on the day it does not. */
    var t = d.traveldns;
    var tsec = $('#p-tdns');
    if (tsec) {
        if (!t || t.state === 'off' || t.state === 'unknown') {
            tsec.hidden = true;
        } else {
            tsec.hidden = false;
            var tst = $('#tdnsState'); clear(tst);
            var tbox = $('#tdns'); clear(tbox);
            var srv = (t.servers && t.servers.length) ? t.servers.join(', ') : 'this network\u2019s resolver';
            if (t.state === 'active') {
                tst.appendChild(OS.stateWord('PLAINTEXT FALLBACK', 'warn'));
                tbox.appendChild(OS.note('This network\u2019s own resolver (' + srv + ') has been ' +
                    'added alongside the encrypted upstreams, so a captive portal has something to ' +
                    'hijack and sign-in can work. dnsmasq answers from whichever replies first, so ' +
                    'an unknown share of queries is resolved in cleartext by the network you are on ' +
                    '\u2014 visible to it, and NOT filtered by AdGuard, whatever the panel below ' +
                    'reports. This is deliberate and it reverts by itself once the normal uplink ' +
                    'carries the default route again.', 'warn'));
            } else if (t.state === 'settling') {
                tst.appendChild(OS.stateWord('SWITCHING', 'warn'));
                tbox.appendChild(OS.note('The travel fallback (' + srv + ') has just been written ' +
                    'and dnsmasq is restarting to pick it up. That restart is deliberately detached ' +
                    '— running it inline stalls the firewall and routing handlers behind it ' +
                    '— so it can take up to a minute. Nothing is wrong yet; this panel will ' +
                    'say what the resolver path ended up being.', 'warn'));
            } else if (t.state === 'pending') {
                tst.appendChild(OS.stateWord('FALLBACK NOT LOADED', 'bad'));
                tbox.appendChild(OS.note('The travel fallback (' + srv + ') was written to ' +
                    'dnsmasq\u2019s runtime config, but dnsmasq has been running since before it ' +
                    'was written and has not picked it up. Encrypted DNS is intact, so this is not ' +
                    'a leak \u2014 but a captive portal still has no plaintext DNS to hijack, so ' +
                    'sign-in will keep failing. Reload it over SSH: /etc/init.d/dnsmasq reload', 'bad'));
            } else if (t.state === 'indeterminate') {
                /* Deliberately NOT folded into the hide-condition above.
                   `unknown` means there is no conf-dir at all and nothing to
                   report; this means a fallback IS installed and the console
                   could not read one of the two numbers it compares to decide
                   whether dnsmasq loaded it. Hiding the panel here would go
                   quiet at the exact moment a plaintext resolver may be on
                   the path, which is the silence this panel exists to end. */
                tst.appendChild(OS.stateWord('CANNOT TELL', 'warn'));
                tbox.appendChild(OS.note('The travel fallback (' + srv + ') is written to ' +
                    'dnsmasq\u2019s runtime config, but this console could not read one of ' +
                    'the numbers it compares \u2014 dnsmasq\u2019s start time, or the ' +
                    'file\u2019s timestamp \u2014 so it cannot say whether the running ' +
                    'resolver has picked it up. Assume plaintext DNS MAY be on the path. ' +
                    'Check over SSH with logread -e dnsmasq, and reload it if in doubt: ' +
                    '/etc/init.d/dnsmasq reload', 'warn'));
            } else {
                /* A state this page has never heard of. It used to fall out of
                   the chain with the panel already shown and both slots empty,
                   so the reader got a bare "Resolver path" heading and no way
                   to tell whether that meant nothing or meant something.
                   The endpoint gained a state once already and will again; the
                   honest answer is to say which state it is and that this page
                   is the half that is behind, rather than to hide the panel -
                   the panel is only ever shown when a fallback IS installed. */
                tst.appendChild(OS.stateWord('UNRECOGNISED', 'warn'));
                tbox.appendChild(OS.note('A travel-DNS fallback (' + srv + ') is installed, but ' +
                    'the router reported its status as \u201c' + String(t.state) + '\u201d and ' +
                    'this page does not know that word \u2014 it is older than the endpoint ' +
                    'serving it. Assume plaintext DNS MAY be on the path until you can check. ' +
                    'Reloading the page picks up a newer copy; if the word persists, the console ' +
                    'needs reinstalling so both halves match.', 'warn'));
            }
        }
    }

    var a = d.adguard;
    var sec = $('#p-agh'); if (!sec) return;
    if (!a) { sec.hidden = true; return; }
    sec.hidden = false;
    var st = $('#aghState'); clear(st);
    var box = $('#agh'); clear(box);

    if (!a.up) {
        if (a.reason === 'auth') {
            /* the service is fine; restarting it (the old advice) fixes nothing */
            st.appendChild(OS.stateWord('CREDENTIAL STALE', 'warn'));
            box.appendChild(OS.note('AdGuard is running and filtering, but it refused the ' +
                'credential the console keeps in /etc/dashboard/agh-auth - the password was ' +
                'probably changed without updating that file. DNS is unaffected; only this ' +
                'panel is blind until the file matches again.', 'warn'));
        } else {
            st.appendChild(OS.stateWord('DOWN', 'bad'));
            box.appendChild(OS.note('AdGuard Home is not answering. DNS is down with it - every ' +
                'query goes through it. If this lasts, restart it over SSH: ' +
                '/etc/init.d/adguardhome restart', 'bad'));
        }
        return;
    }
    /* Recurring upstream failures outrank the steady-state word: every
       process stays alive while queries stall 20 seconds, so this is the one
       state the old liveness-shaped reporting could never show. A single
       event inside the window stays quiet on purpose. */
    var failing = a.upfail && a.upfail.recent >= 2;
    if (failing) st.appendChild(OS.stateWord('UPSTREAMS FAILING', 'bad'));
    else st.appendChild(a.protection ? OS.stateWord('FILTERING', 'ok')
                                     : OS.stateWord('PAUSED', 'warn'));

    var grid = el('div');
    grid.style.cssText = 'display:flex;gap:28px;flex-wrap:wrap;margin:4px 0 14px';
    function stat(num, cap) {
        var c = el('div');
        c.appendChild(el('div', 'row__num', num));
        c.appendChild(el('div', 'row__cap', cap));
        return c;
    }
    var pct = a.queries > 0 ? Math.round(a.blocked * 1000 / a.queries) / 10 : 0;
    grid.appendChild(stat(OS.fmtNum ? OS.fmtNum(a.queries) : String(a.queries), 'DNS queries · 24h'));
    grid.appendChild(stat(OS.fmtNum ? OS.fmtNum(a.blocked) : String(a.blocked), 'blocked'));
    grid.appendChild(stat(pct + '%', 'of all queries'));
    box.appendChild(grid);

    if (!a.protection) {
        box.appendChild(OS.note('Filtering is paused: ads, malware and phishing domains all ' +
            'resolve normally until it is resumed.', 'warn'));
    }
    if (failing) {
        box.appendChild(OS.note(a.upfail.recent + ' DNS queries in the last 30 minutes waited ' +
            '20 seconds at the encrypted upstreams and gave up (last at ' + a.upfail.last + '). ' +
            'Devices retry and usually get through, so this reads as slowness rather than an ' +
            'outage - but it is the upstream path failing, not this router.', 'bad'));
    }

    var row = el('div', 'inline');
    row.style.cssText = 'gap:10px;flex-wrap:wrap;margin-top:4px';
    var tb = el('button', 'btn btn--sm', a.protection ? 'Pause filtering' : 'Resume filtering');
    tb.addEventListener('click', function () {
        OS.post(API, { action: 'aghprot', state: a.protection ? 'off' : 'on' }).then(function (j) {
            if (j && j.ok) { OS.toast(j.protection ? 'Filtering resumed.' : 'Filtering paused.', 'ok'); OS.tp.refresh(300); }
            else { OS.toast('Not changed: ' + ((j && j.error) || 'unknown error') + '.', 'bad'); }
        });
    });
    row.appendChild(tb);
    /* location.hostname, not a hardcoded address: the AdGuard UI listens on
       every interface, so this link survives a LAN renumbering. */
    var pl = el('a', 'btn btn--ghost btn--sm', 'Open the AdGuard portal');
    pl.href = 'http://' + location.hostname + ':3010/';
    pl.target = '_blank'; pl.rel = 'noopener';
    row.appendChild(pl);
    box.appendChild(row);

    var h = el('div', 'hint');
    h.style.marginTop = '10px';
    h.textContent = 'The portal has the query log, the filter lists and per-list settings. ' +
        'It asks for its own sign-in.';
    box.appendChild(h);
}
function render(d) {
    if (!d || !d.ok) return;
    last = d;
    var alerts = $('#alerts'); clear(alerts);
    /* pbr stops itself when no device is routed — that is the correct resting
       state, not a fault. Alarming about it while the tunnel list is empty made
       a normal idle page look broken. Only warn when something actually needs
       pbr and it is not running. */
    var wantsPbr = (d.policies || []).some(function (p) { return p.enabled; });
    /* KEYED ON pbr_active, NOT pbr_enabled. The latter is the UCI flag — intent,
       not evidence. They diverge in the direction that hides the fault: this
       router ran for forty minutes with the flag set, pbr dead, no fwmark rules
       and one device silently unrouted, and this alarm stayed quiet because the
       flag still said 1. pbr_active counts the routing rules actually in the
       kernel.

       Two consecutive polls before alarming. Adding a route restarts pbr in the
       background, so a single poll can land in the gap while it comes back up —
       and an alarm that flashes during normal use is one nobody reads. */
    var pbrDown = wantsPbr && d.pbr_active === false;
    if (pbrDown && pbrWasDown) {
        var n = OS.note('Per-device routing is not running, so tunnel rules are not being ' +
            'applied. Every device is going out through the normal uplink.', 'bad');
        var prow = el('div');
        prow.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 0 30px';
        var pb2 = el('button', 'btn btn--sm btn--danger', 'Start per-device routing');
        pb2.addEventListener('click', function () {
            /* The consequence is read from live state, not described in the
               abstract. Starting pbr APPLIES the policies, and with the closed
               fail mode a device pinned to a tunnel that is down loses its
               internet entirely — the opposite of the firewall button, which
               cannot make anything worse. Say which devices, by name. */
            var now = d.ts || Math.floor(Date.now() / 1e3);
            var byIface = {};
            (d.tunnels || []).forEach(function (t) {
                byIface[t.iface] = !t.disabled && t.up && t.handshake && (now - t.handshake) <= 200;
            });
            var stranded = (d.policies || []).filter(function (p) {
                return p.enabled && byIface[p.iface] === false;
            }).map(function (p) { return nameOf(p.mac.toUpperCase()); });
            var body = 'Routing policies start being applied immediately.';
            if (stranded.length && d.failmode !== 'open') {
                body += ' ' + stranded.join(', ') + (stranded.length > 1 ? ' are' : ' is') +
                        ' pinned to a tunnel that is not passing traffic, and the fail mode is ' +
                        'set to closed — so ' + (stranded.length > 1 ? 'they' : 'it') +
                        ' will have NO internet until that tunnel recovers. ' +
                        'Switch the fail mode to open first if you would rather ' +
                        (stranded.length > 1 ? 'they' : 'it') + ' fell back to the normal uplink.';
            } else if (stranded.length) {
                body += ' ' + stranded.join(', ') + ' will fall back to the normal uplink, ' +
                        'because the tunnel is down and the fail mode is open.';
            } else {
                body += ' Every routed device has a tunnel that is currently up.';
            }
            OS.dialog({ title: 'Start per-device routing', body: body, okText: 'Start' })
              .then(function (go) {
                if (!go) return;
                OS.act(pb2, API, { action: 'pbrstart' }, {
                    ok: 'Per-device routing is running again.',
                    failPrefix: 'Could not start it'
                });
              });
        });
        prow.appendChild(pb2);
        n.appendChild(prow);
        n.style.marginBottom = '12px';
        alerts.appendChild(n);
    }
    pbrWasDown = pbrDown;
    /* IPv6 leak protection: three states that all look like "routed and fine"
       on this page, and each has a different remedy. The fact comes from the
       live kernel ruleset, the reason from what the generator recorded — a
       tunnel with no usable resolver and a ruleset the firewall refused both
       end in "fewer rules than expected". Warn only. Nothing here pauses a
       policy: releasing a device to the home uplink is the OPEN fail mode, and
       applying it unasked would swap a partial leak for a total one. */
    var vd = d.vpndns;
    if (vd && vd.state === 'nofirewall') {
        /* Not a VPN fault at all. Saying "check the tunnel DNS values" here
           would send someone to the one place that cannot be the cause. */
        /* Same condition, same remedy, same builder as the Overview. A traveller
           who opened this page because their VPN looks wrong should not have to
           find another page to fix it. */
        var n6 = OS.firewallAlert(function () { OS.tp.refresh(500); });
        var lead = OS.note('The IPv6 rules that keep routed devices inside their tunnel are ' +
            'part of that missing ruleset, so this is not a VPN fault and nothing about your ' +
            'tunnels needs changing.', 'warn');
        lead.style.marginBottom = '8px';
        n6.style.marginBottom = '12px';
        alerts.appendChild(n6);
        alerts.appendChild(lead);
    } else if (vd && vd.state === 'unprotected') {
        var n3 = OS.note('IPv6 leak protection is NOT in force. ' + vd.routed +
            (vd.routed > 1 ? ' devices are' : ' device is') + ' routed through a tunnel, ' +
            'but the firewall is carrying no IPv6 rules for them — their IPv6 traffic is ' +
            'going out through the normal uplink in clear, with the tunnel still up. ' +
            'The generated ruleset was refused; check the tunnel DNS values.', 'bad');
        n3.style.marginBottom = '12px';
        alerts.appendChild(n3);
    } else if (vd && (vd.state === 'rejected-v6only' || vd.state === 'external')) {
        var n5 = OS.note(vd.state === 'external'
            ? 'The firewall is refusing to load its ruleset, and the cause is not these ' +
              'rules — something else under /etc/nftables.d is broken. IPv6 protection is ' +
              'still in force from the last good load, but no firewall change will apply ' +
              'until that is fixed.'
            : 'The firewall refused the per-device DNS redirect, so it has been dropped. ' +
              'IPv6 is still blocked for routed devices, so the location leak is closed, ' +
              'but their DNS is answered from the normal uplink. Check the tunnel DNS values.',
            'warn');
        n5.style.marginBottom = '12px';
        alerts.appendChild(n5);
    } else if (vd && vd.state === 'nodns' && (vd.nodns || []).length) {
        var n4 = OS.note('No usable DNS server on ' +
            (vd.nodns.length > 1 ? vd.nodns.length + ' routed tunnels' : 'a routed tunnel') +
            '. IPv6 is still blocked for the affected devices, so the location leak is ' +
            'closed, but their DNS is answered from the normal uplink rather than inside the tunnel. ' +
            'Add a DNS line to the tunnel config to close it.', 'warn');
        n4.style.marginBottom = '12px';
        alerts.appendChild(n4);
    }
    var now = d.ts || Math.floor(Date.now() / 1e3);
    var dead = (d.tunnels || []).filter(function (t) {
        return !t.disabled && tunnelState(t, now).tone === 'bad';
    });
    if (dead.length) {
        var n2 = OS.note(dead.map(function (t) { return t.label || t.name; }).join(', ') +
            (dead.length > 1 ? ' are not passing traffic.' : ' is not passing traffic.') +
            /* The open-mode sentence is a PROMISE about the future, and the
               thing that keeps it is vpnwatch, from cron. A promise is acted on
               by not looking, so it is only made when the console can see
               vpnwatch still completing — its own stamp, not the shared cron
               signal, because cron can be alive while this one job is missing
               from the crontab. d.vpnwatch: 1 fresh, 0 stale, -1 too early to
               know. On anything but 1 the page says what it actually knows. */
            (d.failmode === 'open'
                ? (d.vpnwatch === 1
                    ? ' Devices on it will be released to the normal uplink automatically.'
                    : d.vpnwatch === 0
                        ? ' Automatic release is NOT running, so devices pinned to it stay ' +
                          'without internet until the tunnel recovers or you pause them by hand.'
                        : ' Automatic release has not reported in yet, so do not count on it ' +
                          'until it has.')
                : ' Devices pinned to it have no internet until it recovers.'), 'warn');
        n2.style.marginBottom = '12px';
        alerts.appendChild(n2);
    }
    /* Enabled, tunnel healthy — and still carrying nothing. This is NOT the
       case above. There the tunnel died and pausing it is the fix; here the
       tunnel is fine and pausing would change nothing, because what failed is
       the routing into it. Worth its own alert precisely because every other
       signal on this page looks correct: the tunnel is up, handshaking, and the
       row says the device is on it, while the traffic is going out in the open.
       Only claimed when the tunnel is up, so a dead tunnel is not reported
       twice in two different voices. */
    var unrouted = (d.policies || []).filter(function (p) {
        if (!p.enabled || p.carrying !== false) return false;
        var t = (d.tunnels || []).filter(function (x) { return x.iface === p.iface; })[0];
        return !!t && !t.disabled && t.up;
    });
    if (unrouted.length) {
        var who = unrouted.map(function (p) {
            var m = String(p.mac || '').toUpperCase();
            return nameOf(m) || m;
        }).join(', ');
        var n3 = OS.note(who + (unrouted.length > 1 ? ' are' : ' is') +
            ' set to use a tunnel, but nothing is routing ' +
            (unrouted.length > 1 ? 'them' : 'it') + ' into one — that traffic is ' +
            'leaving over the normal uplink right now. The tunnel itself is healthy, ' +
            'so pausing it will not help. Per-device routing does this when the uplink ' +
            'it was built against goes away; it recovers when the main uplink returns.',
            'bad');
        n3.style.marginBottom = '12px';
        alerts.appendChild(n3);
    }

    var upCount = (d.tunnels || []).filter(function (t) { return !t.disabled && t.up; }).length;
    /* Devices actually HERE, not policies on file. "2 devices are routed" while
       one of them has not been on the network for hours is a claim about
       traffic that is not happening; the policy count belongs to the list
       below, which is a configuration view. */
    var enabled = (d.policies || []).filter(function (p) { return p.enabled; });
    var routed = 0, absent = 0;
    enabled.forEach(function (p) {
        if (presentOf(String(p.mac || '').toUpperCase())) routed++; else absent++;
    });
    /* Same test the tunnel list uses at line ~170: not the interface flag,
       which stays true forever once configured, but a recent handshake. */
    var nowT = d.ts || Math.floor(Date.now() / 1e3);
    var tunUp = (d.tunnels || []).filter(function (t) {
        return !t.disabled && t.up && t.handshake && (nowT - t.handshake) <= 200;
    }).length;
    OS.stage('routing', OS.routingLabel(tunUp, (d.tunnels || []).length, routed),
             (dead.length || unrouted.length) ? 'fault' : routed ? 'live' : '');
    /* "through one" was hardcoded, so three devices spread across two tunnels
       still read as going through a single one. Count the tunnels actually
       carrying something. */
    var carrying = {};
    enabled.forEach(function (p) {
        if (presentOf(String(p.mac || '').toUpperCase())) carrying[p.iface] = 1;
    });
    var nCarry = Object.keys(carrying).length;
    var absentTail = absent ? ' ' + absent + ' more ' + (absent === 1 ? 'is' : 'are') +
                              ' set up but not connected.' : '';
    /* `routed` counts devices whose policy says tunnel; it cannot be allowed to
       assert they are IN one when the routing is not carrying them. */
    var unroutedTail = unrouted.length
        ? ' ' + unrouted.length + ' of them ' + (unrouted.length === 1 ? 'is' : 'are') +
          ' not actually reaching a tunnel.' : '';
    setTxt($('#subtitle'), (d.tunnels || []).length
        ? upCount + ' of ' + d.tunnels.length + ' tunnel' + (d.tunnels.length === 1 ? '' : 's') +
          ' connected. ' + (routed ? routed + ' device' + (routed === 1 ? ' is' : 's are') +
          (nCarry === 1 ? ' routed through one.' : ' routed across ' + nCarry + ' of them.')
          : 'No connected device is using one.') + absentTail + unroutedTail
        : 'Add a WireGuard configuration to start routing devices through a tunnel.');

    renderMap(d);
    renderTunnels(d);
    renderDevices(d);
    renderFailmode(d);
    renderAdguard(d);
}

loadDevices().then(function () { if (last) { renderDevices(last); renderMap(last); } });
/* 10s, matching the original: vpn-api costs ~310ms of router wall time per
   call, and nothing here changes faster than a handshake interval. */
OS.tp = new OS.Transport(API, render, { interval: 10000 });
OS.tp.start();
})();
</script>
</body>
</html>
