/* ----------------------------------------------------------------- boot -- */
/* AdGuard Home. On this page rather than a new one because it is network
   policy — what leaves the LAN and what gets stopped — same as the tunnels
   above it. The API emits null when the router has no AdGuard credentials
   file, and the whole panel stays hidden: nothing on this console may render
   an instrument for hardware or software the router does not have. */
function renderAdguard(d) {
    /* The travel-DNS fallback, rendered ABOVE AdGuard on purpose: while it is
       active, everything the AdGuard panel says below is true and beside the
       point, because dnsmasq is answering from an upstream AdGuard never sees.
       Hidden entirely in the ordinary case - a panel that says "normal" on
       every load of every day is one nobody reads on the day it does not. */
    var t = d.traveldns;
    var tsec = $('#p-tdns');
    if (tsec) {
        if (!t || t.state === 'off' || t.state === 'unknown') {
            tsec.hidden = true;
        } else {
            tsec.hidden = false;
            var tst = $('#tdnsState'); clear(tst);
            var tbox = $('#tdns'); clear(tbox);
            var srv = (t.servers && t.servers.length) ? t.servers.join(', ') : 'this network\u2019s resolver';
            if (t.state === 'active') {
                tst.appendChild(OS.stateWord('PLAINTEXT FALLBACK', 'warn'));
                tbox.appendChild(OS.note('This network\u2019s own resolver (' + srv + ') has been ' +
                    'added alongside the encrypted upstreams, so a captive portal has something to ' +
                    'hijack and sign-in can work. dnsmasq answers from whichever replies first, so ' +
                    'an unknown share of queries is resolved in cleartext by the network you are on ' +
                    '\u2014 visible to it, and NOT filtered by AdGuard, whatever the panel below ' +
                    'reports. This is deliberate and it reverts by itself once the normal uplink ' +
                    'carries the default route again.', 'warn'));
            } else if (t.state === 'settling') {
                tst.appendChild(OS.stateWord('SWITCHING', 'warn'));
                tbox.appendChild(OS.note('The travel fallback (' + srv + ') has just been written ' +
                    'and dnsmasq is restarting to pick it up. That restart is deliberately detached ' +
                    '— running it inline stalls the firewall and routing handlers behind it ' +
                    '— so it can take up to a minute. Nothing is wrong yet; this panel will ' +
                    'say what the resolver path ended up being.', 'warn'));
            } else if (t.state === 'pending') {
                tst.appendChild(OS.stateWord('FALLBACK NOT LOADED', 'bad'));
                tbox.appendChild(OS.note('The travel fallback (' + srv + ') was written to ' +
                    'dnsmasq\u2019s runtime config, but dnsmasq has been running since before it ' +
                    'was written and has not picked it up. Encrypted DNS is intact, so this is not ' +
                    'a leak \u2014 but a captive portal still has no plaintext DNS to hijack, so ' +
                    'sign-in will keep failing. Reload it over SSH: /etc/init.d/dnsmasq reload', 'bad'));
            } else if (t.state === 'indeterminate') {
                /* Deliberately NOT folded into the hide-condition above.
                   `unknown` means there is no conf-dir at all and nothing to
                   report; this means a fallback IS installed and the console
                   could not read one of the two numbers it compares to decide
                   whether dnsmasq loaded it. Hiding the panel here would go
                   quiet at the exact moment a plaintext resolver may be on
                   the path, which is the silence this panel exists to end. */
                tst.appendChild(OS.stateWord('CANNOT TELL', 'warn'));
                tbox.appendChild(OS.note('The travel fallback (' + srv + ') is written to ' +
                    'dnsmasq\u2019s runtime config, but this console could not read one of ' +
                    'the numbers it compares \u2014 dnsmasq\u2019s start time, or the ' +
                    'file\u2019s timestamp \u2014 so it cannot say whether the running ' +
                    'resolver has picked it up. Assume plaintext DNS MAY be on the path. ' +
                    'Check over SSH with logread -e dnsmasq, and reload it if in doubt: ' +
                    '/etc/init.d/dnsmasq reload', 'warn'));
            } else {
                /* A state this page has never heard of. It used to fall out of
                   the chain with the panel already shown and both slots empty,
                   so the reader got a bare "Resolver path" heading and no way
                   to tell whether that meant nothing or meant something.
                   The endpoint gained a state once already and will again; the
                   honest answer is to say which state it is and that this page
                   is the half that is behind, rather than to hide the panel -
                   the panel is only ever shown when a fallback IS installed. */
                tst.appendChild(OS.stateWord('UNRECOGNISED', 'warn'));
                tbox.appendChild(OS.note('A travel-DNS fallback (' + srv + ') is installed, but ' +
                    'the router reported its status as \u201c' + String(t.state) + '\u201d and ' +
                    'this page does not know that word \u2014 it is older than the endpoint ' +
                    'serving it. Assume plaintext DNS MAY be on the path until you can check. ' +
                    'Reloading the page picks up a newer copy; if the word persists, the console ' +
                    'needs reinstalling so both halves match.', 'warn'));
            }
        }
    }

    var a = d.adguard;
    var sec = $('#p-agh'); if (!sec) return;
    if (!a) { sec.hidden = true; return; }
    sec.hidden = false;
    var st = $('#aghState'); clear(st);
    var box = $('#agh'); clear(box);

    if (!a.up) {
        if (a.reason === 'auth') {
            /* the service is fine; restarting it (the old advice) fixes nothing */
            st.appendChild(OS.stateWord('CREDENTIAL STALE', 'warn'));
            box.appendChild(OS.note('AdGuard is running and filtering, but it refused the ' +
                'credential the console keeps in /etc/dashboard/agh-auth - the password was ' +
                'probably changed without updating that file. DNS is unaffected; only this ' +
                'panel is blind until the file matches again.', 'warn'));
        } else {
            st.appendChild(OS.stateWord('DOWN', 'bad'));
            box.appendChild(OS.note('AdGuard Home is not answering. DNS is down with it - every ' +
                'query goes through it. If this lasts, restart it over SSH: ' +
                '/etc/init.d/adguardhome restart', 'bad'));
        }
        return;
    }
    /* Recurring upstream failures outrank the steady-state word: every
       process stays alive while queries stall 20 seconds, so this is the one
       state the old liveness-shaped reporting could never show. A single
       event inside the window stays quiet on purpose. */
    var failing = a.upfail && a.upfail.recent >= 2;
    if (failing) st.appendChild(OS.stateWord('UPSTREAMS FAILING', 'bad'));
    else st.appendChild(a.protection ? OS.stateWord('FILTERING', 'ok')
                                     : OS.stateWord('PAUSED', 'warn'));

    var grid = el('div');
    grid.style.cssText = 'display:flex;gap:28px;flex-wrap:wrap;margin:4px 0 14px';
    function stat(num, cap) {
        var c = el('div');
        c.appendChild(el('div', 'row__num', num));
        c.appendChild(el('div', 'row__cap', cap));
        return c;
    }
    var pct = a.queries > 0 ? Math.round(a.blocked * 1000 / a.queries) / 10 : 0;
    grid.appendChild(stat(Number(a.queries || 0).toLocaleString(), 'DNS queries · 24h'));
    grid.appendChild(stat(Number(a.blocked || 0).toLocaleString(), 'blocked'));
    grid.appendChild(stat(pct + '%', 'of all queries'));
    box.appendChild(grid);

    if (!a.protection) {
        box.appendChild(OS.note('Filtering is paused: ads, malware and phishing domains all ' +
            'resolve normally until it is resumed.', 'warn'));
    }
    if (failing) {
        box.appendChild(OS.note(a.upfail.recent + ' DNS queries in the last 30 minutes waited ' +
            '20 seconds at the encrypted upstreams and gave up (last at ' + a.upfail.last + '). ' +
            'Devices retry and usually get through, so this reads as slowness rather than an ' +
            'outage - but it is the upstream path failing, not this router.', 'bad'));
    }

    var row = el('div', 'inline');
    row.style.cssText = 'gap:10px;flex-wrap:wrap;margin-top:4px';
    var tb = el('button', 'btn btn--sm', a.protection ? 'Pause filtering' : 'Resume filtering');
    tb.addEventListener('click', function () {
        OS.post(API, { action: 'aghprot', state: a.protection ? 'off' : 'on' }).then(function (j) {
            if (j && j.ok) { OS.toast(j.protection ? 'Filtering resumed.' : 'Filtering paused.', 'ok'); OS.tp.refresh(300); }
            else { OS.toast('Not changed: ' + ((j && j.error) || 'unknown error') + '.', 'bad'); }
        });
    });
    row.appendChild(tb);
    /* location.hostname, not a hardcoded address: the AdGuard UI listens on
       every interface, so this link survives a LAN renumbering. */
    var pl = el('a', 'btn btn--ghost btn--sm', 'Open the AdGuard portal');
    pl.href = 'http://' + location.hostname + ':3010/';
    pl.target = '_blank'; pl.rel = 'noopener';
    row.appendChild(pl);
    box.appendChild(row);

    var h = el('div', 'hint');
    h.style.marginTop = '10px';
    h.textContent = 'The portal has the query log, the filter lists and per-list settings. ' +
        'It asks for its own sign-in.';
    box.appendChild(h);
}
function render(d) {
    if (!d || !d.ok) return;
    last = d;
    var alerts = $('#alerts'); clear(alerts);
    /* pbr stops itself when no device is routed — that is the correct resting
       state, not a fault. Alarming about it while the tunnel list is empty made
       a normal idle page look broken. Only warn when something actually needs
       pbr and it is not running. */
    var wantsPbr = (d.policies || []).some(function (p) { return p.enabled; });
    /* KEYED ON pbr_active, NOT pbr_enabled. The latter is the UCI flag — intent,
       not evidence. They diverge in the direction that hides the fault: this
       router ran for forty minutes with the flag set, pbr dead, no fwmark rules
       and one device silently unrouted, and this alarm stayed quiet because the
       flag still said 1. pbr_active counts the routing rules actually in the
       kernel.

       Two consecutive polls before alarming. Adding a route restarts pbr in the
       background, so a single poll can land in the gap while it comes back up —
       and an alarm that flashes during normal use is one nobody reads. */
    var pbrDown = wantsPbr && d.pbr_active === false;
    if (pbrDown && pbrWasDown) {
        var n = OS.note('Per-device routing is not running, so tunnel rules are not being ' +
            'applied. Every device is going out through the normal uplink.', 'bad');
        var prow = el('div');
        prow.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 0 30px';
        var pb2 = el('button', 'btn btn--sm btn--danger', 'Start per-device routing');
        pb2.addEventListener('click', function () {
            /* The consequence is read from live state, not described in the
               abstract. Starting pbr APPLIES the policies, and with the closed
               fail mode a device pinned to a tunnel that is down loses its
               internet entirely — the opposite of the firewall button, which
               cannot make anything worse. Say which devices, by name. */
            var now = d.ts || Math.floor(Date.now() / 1e3);
            var byIface = {};
            (d.tunnels || []).forEach(function (t) {
                byIface[t.iface] = !t.disabled && t.up && t.handshake && (now - t.handshake) <= 200;
            });
            var stranded = (d.policies || []).filter(function (p) {
                return p.enabled && byIface[p.iface] === false;
            }).map(function (p) { return nameOf(p.mac.toUpperCase()); });
            var body = 'Routing policies start being applied immediately.';
            if (stranded.length && d.failmode !== 'open') {
                body += ' ' + stranded.join(', ') + (stranded.length > 1 ? ' are' : ' is') +
                        ' pinned to a tunnel that is not passing traffic, and the fail mode is ' +
                        'set to closed — so ' + (stranded.length > 1 ? 'they' : 'it') +
                        ' will have NO internet until that tunnel recovers. ' +
                        'Switch the fail mode to open first if you would rather ' +
                        (stranded.length > 1 ? 'they' : 'it') + ' fell back to the normal uplink.';
            } else if (stranded.length) {
                body += ' ' + stranded.join(', ') + ' will fall back to the normal uplink, ' +
                        'because the tunnel is down and the fail mode is open.';
            } else {
                body += ' Every routed device has a tunnel that is currently up.';
            }
            OS.dialog({ title: 'Start per-device routing', body: body, okText: 'Start' })
              .then(function (go) {
                if (!go) return;
                OS.act(pb2, API, { action: 'pbrstart' }, {
                    ok: 'Per-device routing is running again.',
                    failPrefix: 'Could not start it'
                });
              });
        });
        prow.appendChild(pb2);
        n.appendChild(prow);
        n.style.marginBottom = '12px';
        alerts.appendChild(n);
    }
    pbrWasDown = pbrDown;
    /* IPv6 leak protection: three states that all look like "routed and fine"
       on this page, and each has a different remedy. The fact comes from the
       live kernel ruleset, the reason from what the generator recorded — a
       tunnel with no usable resolver and a ruleset the firewall refused both
       end in "fewer rules than expected". Warn only. Nothing here pauses a
       policy: releasing a device to the home uplink is the OPEN fail mode, and
       applying it unasked would swap a partial leak for a total one. */
    var vd = d.vpndns;
    if (vd && vd.state === 'nofirewall') {
        /* Not a VPN fault at all. Saying "check the tunnel DNS values" here
           would send someone to the one place that cannot be the cause. */
        /* Same condition, same remedy, same builder as the Overview. A traveller
           who opened this page because their VPN looks wrong should not have to
           find another page to fix it. */
        var n6 = OS.firewallAlert(function () { OS.tp.refresh(500); });
        var lead = OS.note('The IPv6 rules that keep routed devices inside their tunnel are ' +
            'part of that missing ruleset, so this is not a VPN fault and nothing about your ' +
            'tunnels needs changing.', 'warn');
        lead.style.marginBottom = '8px';
        n6.style.marginBottom = '12px';
        alerts.appendChild(n6);
        alerts.appendChild(lead);
    } else if (vd && vd.state === 'unprotected') {
        var n3 = OS.note('IPv6 leak protection is NOT in force. ' + vd.routed +
            (vd.routed > 1 ? ' devices are' : ' device is') + ' routed through a tunnel, ' +
            'but the firewall is carrying no IPv6 rules for them — their IPv6 traffic is ' +
            'going out through the normal uplink in clear, with the tunnel still up. ' +
            'The generated ruleset was refused; check the tunnel DNS values.', 'bad');
        n3.style.marginBottom = '12px';
        alerts.appendChild(n3);
    } else if (vd && (vd.state === 'rejected-v6only' || vd.state === 'external')) {
        var n5 = OS.note(vd.state === 'external'
            ? 'The firewall is refusing to load its ruleset, and the cause is not these ' +
              'rules — something else under /etc/nftables.d is broken. IPv6 protection is ' +
              'still in force from the last good load, but no firewall change will apply ' +
              'until that is fixed.'
            : 'The firewall refused the per-device DNS redirect, so it has been dropped. ' +
              'IPv6 is still blocked for routed devices, so the location leak is closed, ' +
              'but their DNS is answered from the normal uplink. Check the tunnel DNS values.',
            'warn');
        n5.style.marginBottom = '12px';
        alerts.appendChild(n5);
    } else if (vd && vd.state === 'nodns' && (vd.nodns || []).length) {
        var n4 = OS.note('No usable DNS server on ' +
            (vd.nodns.length > 1 ? vd.nodns.length + ' routed tunnels' : 'a routed tunnel') +
            '. IPv6 is still blocked for the affected devices, so the location leak is ' +
            'closed, but their DNS is answered from the normal uplink rather than inside the tunnel. ' +
            'Add a DNS line to the tunnel config to close it.', 'warn');
        n4.style.marginBottom = '12px';
        alerts.appendChild(n4);
    }
    var now = d.ts || Math.floor(Date.now() / 1e3);
    var dead = (d.tunnels || []).filter(function (t) {
        return !t.disabled && tunnelState(t, now).tone === 'bad';
    });
    if (dead.length) {
        var n2 = OS.note(dead.map(function (t) { return t.label || t.name; }).join(', ') +
            (dead.length > 1 ? ' are not passing traffic.' : ' is not passing traffic.') +
            /* The open-mode sentence is a PROMISE about the future, and the
               thing that keeps it is vpnwatch, from cron. A promise is acted on
               by not looking, so it is only made when the console can see
               vpnwatch still completing — its own stamp, not the shared cron
               signal, because cron can be alive while this one job is missing
               from the crontab. d.vpnwatch: 1 fresh, 0 stale, -1 too early to
               know. On anything but 1 the page says what it actually knows. */
            (d.failmode === 'open'
                ? (d.vpnwatch === 1
                    ? ' Devices on it will be released to the normal uplink automatically.'
                    : d.vpnwatch === 0
                        ? ' Automatic release is NOT running, so devices pinned to it stay ' +
                          'without internet until the tunnel recovers or you pause them by hand.'
                        : ' Automatic release has not reported in yet, so do not count on it ' +
                          'until it has.')
                : ' Devices pinned to it have no internet until it recovers.'), 'warn');
        n2.style.marginBottom = '12px';
        alerts.appendChild(n2);
    }
    /* Enabled, tunnel healthy — and still carrying nothing. This is NOT the
       case above. There the tunnel died and pausing it is the fix; here the
       tunnel is fine and pausing would change nothing, because what failed is
       the routing into it. Worth its own alert precisely because every other
       signal on this page looks correct: the tunnel is up, handshaking, and the
       row says the device is on it, while the traffic is going out in the open.
       Only claimed when the tunnel is up, so a dead tunnel is not reported
       twice in two different voices. */
    var unrouted = (d.policies || []).filter(function (p) {
        if (!p.enabled || p.carrying !== false) return false;
        var t = (d.tunnels || []).filter(function (x) { return x.iface === p.iface; })[0];
        return !!t && !t.disabled && t.up;
    });
    if (unrouted.length) {
        var who = unrouted.map(function (p) {
            var m = String(p.mac || '').toUpperCase();
            return nameOf(m) || m;
        }).join(', ');
        var n3 = OS.note(who + (unrouted.length > 1 ? ' are' : ' is') +
            ' set to use a tunnel, but nothing is routing ' +
            (unrouted.length > 1 ? 'them' : 'it') + ' into one — that traffic is ' +
            'leaving over the normal uplink right now. The tunnel itself is healthy, ' +
            'so pausing it will not help. Per-device routing does this when the uplink ' +
            'it was built against goes away; it recovers when the main uplink returns.',
            'bad');
        n3.style.marginBottom = '12px';
        alerts.appendChild(n3);
    }

    var upCount = (d.tunnels || []).filter(function (t) { return !t.disabled && t.up; }).length;
    /* Devices actually HERE, not policies on file. "2 devices are routed" while
       one of them has not been on the network for hours is a claim about
       traffic that is not happening; the policy count belongs to the list
       below, which is a configuration view. */
    var enabled = (d.policies || []).filter(function (p) { return p.enabled; });
    var routed = 0, absent = 0;
    enabled.forEach(function (p) {
        if (presentOf(String(p.mac || '').toUpperCase())) routed++; else absent++;
    });
    /* Same test the tunnel list uses at line ~170: not the interface flag,
       which stays true forever once configured, but a recent handshake. */
    var nowT = d.ts || Math.floor(Date.now() / 1e3);
    var tunUp = (d.tunnels || []).filter(function (t) {
        return !t.disabled && t.up && t.handshake && (nowT - t.handshake) <= 200;
    }).length;
    OS.stage('routing', OS.routingLabel(tunUp, (d.tunnels || []).length, routed),
             (dead.length || unrouted.length) ? 'fault' : routed ? 'live' : '');
    /* "through one" was hardcoded, so three devices spread across two tunnels
       still read as going through a single one. Count the tunnels actually
       carrying something. */
    var carrying = {};
    enabled.forEach(function (p) {
        if (presentOf(String(p.mac || '').toUpperCase())) carrying[p.iface] = 1;
    });
    var nCarry = Object.keys(carrying).length;
    var absentTail = absent ? ' ' + absent + ' more ' + (absent === 1 ? 'is' : 'are') +
                              ' set up but not connected.' : '';
    /* `routed` counts devices whose policy says tunnel; it cannot be allowed to
       assert they are IN one when the routing is not carrying them. */
    var unroutedTail = unrouted.length
        ? ' ' + unrouted.length + ' of them ' + (unrouted.length === 1 ? 'is' : 'are') +
          ' not actually reaching a tunnel.' : '';
    setTxt($('#subtitle'), (d.tunnels || []).length
        ? upCount + ' of ' + d.tunnels.length + ' tunnel' + (d.tunnels.length === 1 ? '' : 's') +
          ' connected. ' + (routed ? routed + ' device' + (routed === 1 ? ' is' : 's are') +
          (nCarry === 1 ? ' routed through one.' : ' routed across ' + nCarry + ' of them.')
          : 'No connected device is using one.') + absentTail + unroutedTail
        : 'Add a WireGuard configuration to start routing devices through a tunnel.');

    renderMap(d);
    renderTunnels(d);
    renderDevices(d);
    renderFailmode(d);
    renderAdguard(d);
    renderTransport(d);
}

/* ======================= COMING IN — home access ==========================
   Moved here when the separate WireGuard page was deleted. That page was
   organised around a protocol, which is a category and not a question, so it
   came out as four equal cards of forms with no subject. Here the subject is
   the direction: everything above is traffic leaving, this is traffic arriving.
   ========================================================================= */

var WGAPI = '/cgi-bin/wireguard-api';   /* writes still live in their own file */

/* A handshake is the only honest liveness signal a WireGuard tunnel has. There
   is no link state to read: the interface reports "up" whether or not the far
   end has ever answered, which is exactly how a dead tunnel looks healthy.
   WireGuard rekeys about every two minutes while traffic flows. */
function hsState(ageSec, up, keepalive) {
    if (!up) return { k: 'off', t: 'switched off' };
    if (ageSec == null) return { k: 'fault', t: 'never connected' };
    if (ageSec < 180) return { k: 'ok', t: 'working' };
    if (ageSec < 600) return { k: keepalive ? 'warn' : 'ok', t: keepalive ? 'quiet' : 'idle' };
    return { k: 'fault', t: 'not working' };
}

function agoTxt(s) {
    if (s == null) return 'never';
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    return Math.floor(s / 3600) + 'h ago';
}

/* One setting, one row, each with its own label and its own sentence. The two
   controls this replaced were bare buttons sharing a row, which read as a pair
   of related actions when one switches the feature off and the other is for the
   day the server is renumbered. */
function settingRow(title, hint, btnText, danger, onClick) {
    var r = el('div', 'row row--pick');
    r.style.cursor = 'default';
    var left = el('div', null);
    left.appendChild(el('div', 'row__nm', title));
    left.appendChild(el('div', 'hint', hint));
    r.appendChild(left);
    var b = el('button', 'btn btn--sm' + (danger ? ' btn--danger' : ''), btnText);
    b.addEventListener('click', function () { onClick(b); });
    r.appendChild(b);
    return r;
}

/* NEVER `.row` for a strip that only holds buttons: .row carries a
   border-bottom, and with a <details> underneath its summary's border-top
   lands one pixel below it — two rules where the design has one. That is the
   double line that survived two attempts to remove it. */
function btnStrip() {
    var s = el('div', null);
    s.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;padding:10px 0 2px';
    return s;
}

function fold(host, title, openFlag, onOpen) {
    var det = document.createElement('details');
    det.className = 'adv';
    det.open = !!openFlag();
    det.addEventListener('toggle', function () { onOpen(det.open); });
    var sum = document.createElement('summary');
    sum.textContent = title;
    det.appendChild(sum);
    var body = el('div', 'panel__b');
    det.appendChild(body);
    host.appendChild(det);
    return body;
}

var ROUTE_HINT = {
    lan: 'Only traffic for the home network goes through the tunnel. The device keeps '
       + 'its own connection for everything else, so the battery cost is close to nothing.',
    all: 'Every packet goes through the house, DNS included — so AdGuard filters this '
       + 'device too, and sites see your home address. Worth switching to on Wi-Fi you '
       + 'do not trust. Slower, and it spends the home upload.'
};

function addDeviceFlow(iface) {
    var newCfg = null, route = 'lan';
    var body = el('div', 'stack');
    body.appendChild(el('div', null,
        'It gets the same reach as a device sitting on the home Wi-Fi.'));
    var lab = el('div', null);
    lab.appendChild(el('div', 'row__nm', 'What goes through the tunnel'));
    var hint = el('div', 'hint', ROUTE_HINT[route]);
    hint.style.marginTop = '4px';
    var seg = el('div', 'seg');
    seg.style.marginTop = '8px';
    var segBtns = [];
    [['lan', 'Home network only'], ['all', 'Everything through home']].forEach(function (o) {
        var b = el('button', 'btn btn--sm', o[1]);
        /* type=button: this sits inside the dialog's form and a default submit
           would add the device the moment a mode is picked. */
        b.type = 'button';
        b.setAttribute('aria-pressed', o[0] === route ? 'true' : 'false');
        b.addEventListener('click', function () {
            route = o[0];
            segBtns.forEach(function (x) {
                x.b.setAttribute('aria-pressed', x.k === route ? 'true' : 'false');
            });
            setTxt(hint, ROUTE_HINT[route]);
        });
        segBtns.push({ k: o[0], b: b });
        seg.appendChild(b);
    });
    lab.appendChild(seg); lab.appendChild(hint);
    body.appendChild(lab);

    OS.dialog({
        title: 'Add a device',
        body: body,
        field: { label: 'Device name', placeholder: 'e.g. iPad', emptyMsg: 'Name this device.' },
        okText: 'Add device',
        onSubmit: function (name) {
            return OS.post(WGAPI, { action: 'addpeer', iface: iface, name: name, route: route })
                .then(function (j) {
                    if (!j || !j.ok) return (j && j.error) || 'Could not add the device.';
                    newCfg = j;
                    return true;
                });
        }
    }).then(function (v) {
        if (v == null || !newCfg) return;
        OS.tp.refresh(300);
        var b2 = el('div', 'stack');
        if (window.UQR) {
            var qr = el('div', null);
            qr.style.cssText = 'max-width:220px;margin:0 auto';
            qr.innerHTML = window.UQR.renderSVG(newCfg.config, { pixelSize: 4 });
            b2.appendChild(qr);
        }
        var ta = el('textarea', 'ta n');
        ta.readOnly = true; ta.value = newCfg.config;
        ta.addEventListener('click', function () { ta.select(); });
        b2.appendChild(ta);
        b2.appendChild(el('div', 'hint',
            (route === 'all' ? 'Everything through home. ' : 'Home network only. ')
            + 'Shown once and stored nowhere — scan it in the WireGuard app, or copy the '
            + 'text, before closing this.'));
        OS.dialog({ title: newCfg.name, body: b2, okText: 'Done', cancelText: 'Close' });
    });
}

/* Chip text is the STATE, not the clock. A device that last spoke four days ago
   is "inactive" — that is the fact worth acting on, and printing "4d ago" in an
   accent colour makes an ordinary sleeping phone look like a fault. The exact
   age is in the detail below, where it informs instead of alarms.

   Nothing between three minutes and a day is coloured at all: a phone that is
   not currently on the tunnel is the normal resting state of this feature, not
   a degradation. */
function devState(age) {
    if (age == null) return { t: 'never connected', tone: 'flat' };
    if (age >= 86400) return { t: 'inactive', tone: 'flat' };
    if (age < 180) return { t: 'connected', tone: 'on' };
    return { t: agoTxt(age), tone: 'flat' };
}

var devOpen = {};   /* public key -> row expanded; survives the poll */

/* Built once per device and updated in place. Rebuilding the list on every poll
   detaches the buttons between mousedown and handler, and a click on Rename
   reproducibly did nothing. os.js exports `keyed` for exactly this. */
function roadDeviceRow(iface, rp) {
    var cur = rp;
    var row = el('div', 'row row--pick');
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');

    var id = el('div', 'row__id');
    /* Generic device glyph. Half of what gets added here is a laptop or a
       tablet, and a phone icon beside "iPad" is simply wrong. */
    var ic = el('div', 'row__ico'); ic.appendChild(OS.icon('dev'));
    id.appendChild(ic);
    var title = el('div', 'row__title');
    var nm = el('span', 'row__nm', '');
    var chipBox = el('span', '');
    title.appendChild(nm); title.appendChild(chipBox);
    var subEl = el('div', 'row__sub', '');
    var idText = el('div', null);
    idText.appendChild(title); idText.appendChild(subEl);
    id.appendChild(idText);
    row.appendChild(id);

    /* rx is what the relay RECEIVED from the device, so rx is its upload.
       Confirmed against nlbwmon, which accounts the same address with the same
       lopsided shape rather than the reverse. */
    row._update = function (p2, d2) {
        cur = p2;
        setTxt(nm, p2.name);
        var age = p2.handshake ? d2.ts - p2.handshake : null;
        var st = devState(age);
        clear(chipBox);
        chipBox.appendChild(OS.chip(st.t, st.tone));
        var sub = p2.address;
        if (p2.rx || p2.tx) sub += ' · ↑ ' + OS.bytes(p2.rx || 0) + ' · ↓ ' + OS.bytes(p2.tx || 0);
        setTxt(subEl, sub);
        row.setAttribute('aria-expanded', devOpen[p2.public_key] ? 'true' : 'false');
    };

    /* Rename and Remove live behind the row rather than beside it. They are
       reached a handful of times in a device's life, and two buttons on every
       row made a list of phones look like a control panel. Re-rendered at once
       rather than waiting for the next poll, so the row opens when tapped. */
    function toggle() {
        devOpen[cur.public_key] = !devOpen[cur.public_key];
        if (last) renderTransport(last);
    }
    row.addEventListener('click', toggle);
    row.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    return row;
}

function deviceDetail(box, iface, rp, d) {
    clear(box);
    var dl = el('dl', 'kv');
    function kv(k, v) {
        if (v == null || v === '') return;
        dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, String(v)));
    }
    var age = rp.handshake ? d.ts - rp.handshake : null;
    kv('Last connected', age == null ? 'never' : agoTxt(age));
    kv('Address on the tunnel', rp.address);
    kv('Sent from this device', OS.bytes(rp.rx || 0));
    kv('Sent to this device', OS.bytes(rp.tx || 0));
    if (rp.public_key) kv('Device key', rp.public_key.slice(0, 20) + '…');
    box.appendChild(dl);

    var strip = btnStrip();
    var rename = el('button', 'btn btn--ghost btn--sm', 'Rename');
    var revoke = el('button', 'btn btn--danger btn--sm', 'Remove');
    strip.appendChild(rename); strip.appendChild(revoke);
    box.appendChild(strip);

    /* The name is kept on this router, keyed by public key. The relay has no
       rename endpoint, and a name held only on the VPS would die with it. */
    rename.addEventListener('click', function (e) {
        e.stopPropagation();
        OS.dialog({
            title: 'Rename this device',
            body: 'Only the label changes. The device keeps working and does not need setting up again.',
            field: { label: 'Name', value: rp.name, placeholder: 'e.g. iPad', emptyMsg: 'Give it a name.' },
            okText: 'Save',
            onSubmit: function (v) {
                return OS.post(WGAPI, { action: 'setdevicename', iface: iface,
                                        public_key: rp.public_key, name: v }).then(function (j) {
                    if (!j || !j.ok) return (j && j.error) || 'Could not rename it.';
                    return true;
                });
            }
        }).then(function (v) { if (v != null) OS.tp.refresh(300); });
    });

    revoke.addEventListener('click', function (e) {
        e.stopPropagation();
        OS.askConfirm('Remove ' + rp.name,
            'It loses access immediately, and its setup cannot be handed back — '
            + 'reconnecting means adding it again and scanning a new code.',
            'Remove', true).then(function (go) {
            if (!go) return;
            OS.act(revoke, WGAPI, { action: 'delpeer', iface: iface, public_key: rp.public_key },
                   { ok: 'Removed.', failPrefix: 'Could not remove it' });
        });
    });
}

/* A label, a live chip and a sentence. Used for the admin link, which is a
   reading rather than a control — it has no button, and giving it a whole
   panel implied it needed attending to. */
function statusRow(title, chip, hint) {
    var r = el('div', 'row row--pick');
    r.style.cursor = 'default';
    var left = el('div', null);
    var t = el('div', 'row__title');
    t.appendChild(el('span', 'row__nm', title));
    var cb = el('span', '');
    cb.appendChild(chip);
    t.appendChild(cb);
    left.appendChild(t);
    left.appendChild(el('div', 'hint', hint));
    r.appendChild(left);
    return r;
}

/* The readings for one tunnel, plus its Re-dial. Folded away because none of it
   answers a question anyone has on a normal day, and Re-dial is pressed about
   once a year — but it has to LIVE somewhere, and this is the somewhere.

   This function was accidentally deleted in the previous commit: the block that
   replaced the device row began at a comment that sat above it, so it went too.
   The call then threw and renderTransport died immediately after writing the
   "Home access" heading, which is exactly what an empty fold looked like. A
   brace-balance check cannot catch a function that is simply not there. */
function transportKnobs(box, t, apiIface, showRedial) {
    var dl = el('dl', 'kv');
    function kv(k, v) {
        if (v == null || v === '') return;
        dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, String(v)));
    }
    var peer = t.peer || {};
    kv('Interface', t.iface);
    kv('Server address', (peer.endpoint || '') + (peer.endpoint_port ? ':' + peer.endpoint_port : ''));
    kv('Keepalive', (peer.keepalive || 0) + ' s');
    kv('MTU', t.mtu || 'automatic');
    if (peer.public_key) kv('Server key', peer.public_key.slice(0, 20) + '…');
    box.appendChild(dl);

    if (!showRedial) return;
    var strip = btnStrip();
    var redial = el('button', 'btn btn--ghost btn--sm', 'Re-dial');
    strip.appendChild(redial);
    box.appendChild(strip);
    redial.addEventListener('click', function () {
        OS.askConfirm('Re-dial ' + (t.label || t.iface),
            'Takes the tunnel down and brings it straight back. For a tunnel that dials '
            + 'out this is the only repair possible from this side.',
            'Re-dial').then(function (go) {
            if (!go) return;
            OS.act(redial, WGAPI, { action: 'redial', iface: apiIface },
                   { ok: 'Re-dialling.', delay: 5000, failPrefix: 'Could not re-dial' });
        });
    });
}

var wgAdvOpen = false;

function renderTransport(d) {
    var tp = d.transport || {};
    var road = tp.road, admin = tp.admin;
    var pWg = $('#p-wg');
    if (!road && !admin) { pWg.hidden = true; return; }
    pWg.hidden = false;

    var peer = (road && road.peer) || {};
    var off = !!(road && road.disabled);
    var down = road && road.relay === 'down';
    var devs = (road && road.devices) || [];

    /* Most recently seen first. A device that has never connected sorts last
       rather than first, which is what a handshake of 0 would otherwise do. */
    devs = devs.slice().sort(function (a, b) { return (b.handshake || 0) - (a.handshake || 0); });

    var head = $('#roadHead');
    clear(head);
    head.appendChild(el('div', 'hint',
        'Your own devices reaching this network from outside, as if they were on the '
        + 'home Wi-Fi. They are relayed through the server because this line cannot be '
        + 'dialled into directly.'));

    /* Today's share of the home connection. nlbwmon has no MAC for a WireGuard
       peer, so all of this lands in its 00:00:00:00:00:00 bucket and the
       dashboard's device list drops it — the traffic was being counted and
       attributed to nobody. Stated here, where the devices spending it are. */
    if (road && (road.today_rx || road.today_tx)) {
        var t = el('div', 'hint');
        t.style.marginTop = '6px';
        t.appendChild(document.createTextNode('Today: '));
        var b = el('strong', null, OS.bytes(road.today_tx || 0) + ' up');
        t.appendChild(b);
        t.appendChild(document.createTextNode(' · ' + OS.bytes(road.today_rx || 0)
            + ' down. This is ordinary home broadband use — it counts against the '
            + 'same connection as everything else.'));
        head.appendChild(t);
    }

    setTxt($('#roadCount'), !road ? ''
        : off ? 'off'
        : down ? 'server unreachable'
        : devs.length ? devs.length + (devs.length === 1 ? ' device' : ' devices') : 'no devices');

    var addBtn = $('#addDev');
    addBtn.hidden = !road;
    if (road) {
        clear(addBtn);
        addBtn.appendChild(OS.icon('plus'));
        addBtn.appendChild(document.createTextNode('Add device'));
        addBtn.disabled = off || down;
        addBtn.title = off ? 'Home access is switched off.'
                     : down ? 'The relay server is not answering.' : '';
        addBtn.onclick = function () { addDeviceFlow(road.iface); };
    }

    var host = $('#roadDevs');
    if (!host._empty) { host._empty = el('div', null); host.appendChild(host._empty); }
    if (!host._rows) { host._rows = el('div', null); host.insertBefore(host._rows, host._empty); }
    clear(host._empty);
    var rows = OS.keyed(host._rows);
    if (!road) {
        /* no home-access tunnel on this router at all */
    } else if (off) {
        /* Checked before the unreachable case: with the tunnel down the server
           is SUPPOSED to be unreachable, and calling that a fault sends you
           hunting for a problem you created on purpose. */
        host._empty.appendChild(road.auto_off
            ? OS.emptyState('Home access paused while off the wired line',
                'The router is running on a phone or a borrowed Wi-Fi uplink, so the way '
                + 'in is closed to protect that connection. It reopens by itself when the '
                + 'wired line returns. Your devices are kept.', 'usb')
            : OS.emptyState('Home access is switched off',
                'Nothing can reach the home network from outside. The devices you already '
                + 'added are kept.', 'power'));
    } else if (down) {
        host._empty.appendChild(OS.emptyState('Cannot reach the relay server',
            'Your devices are held on the server, and this page reaches it over the admin '
            + 'link below. They may well still be connected — this page just cannot see them.',
            'alert'));
    } else if (!devs.length) {
        host._empty.appendChild(OS.emptyState('No devices yet',
            'Add your phone or laptop to reach this network from anywhere.', 'dev'));
    } else {
        devs.forEach(function (rp) {
            var w = rows.want('r:' + rp.public_key, function () { return roadDeviceRow(road.iface, rp); });
            w.node._update(rp, d);
            /* The detail node EXISTS only while the row is open — commit()
               removes whatever was not wanted this pass, so existence IS the
               open state and there is no second flag to keep in step. */
            if (devOpen[rp.public_key]) {
                deviceDetail(rows.want('d:' + rp.public_key,
                    function () { return el('div', 'det'); }).node, road.iface, rp, d);
            }
        });
    }
    rows.commit();

    var set = $('#roadSet');
    clear(set);

    if (road) {
        /* An off switch that moved on its own reads as a fault unless the page
           says who moved it. Turning it back on by hand is honoured and sticks:
           the API clears the marker, so the wired line returning will not
           reopen a decision the owner has already made himself. */
        set.appendChild(settingRow('Home access',
            (off && road.auto_off)
                ? 'Closed automatically because the router is running on a phone or a '
                  + 'borrowed Wi-Fi uplink, where every byte a remote device pulls from '
                  + 'home crosses that connection twice. It reopens on its own when the '
                  + 'wired line is back. Turning it on here overrides that until you '
                  + 'switch it off again.'
            : off ? 'Currently off. Turning it on lets the devices above reach the home network again.'
                : 'Currently on. Turning it off closes the way in for every device above. '
                  + 'The admin link below is separate and keeps working.',
            off ? 'Turn on' : 'Turn off', !off, function (btn) {
                OS.askConfirm(off ? 'Turn home access on' : 'Turn home access off',
                    off ? 'Your devices will be able to reach the home network again.'
                        : 'Every device above loses its way in until this is switched back on.',
                    off ? 'Turn on' : 'Turn off', !off).then(function (go) {
                    if (!go) return;
                    OS.act(btn, WGAPI, { action: 'settunnel', iface: road.iface, state: off ? 'on' : 'off' },
                           { ok: off ? 'Home access on.' : 'Home access off.', delay: 3000,
                             failPrefix: 'Could not change it' });
                });
            }));

        var srvHost = peer.endpoint || '';
        set.appendChild(settingRow('Relay server',
            'Currently ' + (srvHost || 'not set')
            + '. Change this only when the server itself is renumbered — the admin link '
            + 'uses the same machine and moves with it.',
            'Change address', false, function () {
                OS.dialog({
                    title: 'The relay server moved',
                    body: el('div', 'hint',
                        'Every tunnel pointing at ' + (srvHost || 'the old address')
                        + ' moves together, the admin link included. Get this wrong while you '
                        + 'are away and there is no way back in until you are home.'),
                    field: { label: 'New address or hostname', value: srvHost,
                             placeholder: 'e.g. vps.example.com', emptyMsg: 'Enter the new address.' },
                    okText: 'Move it', danger: true,
                    onSubmit: function (v) {
                        if (v === srvHost) return 'That is the address it already uses.';
                        return OS.post(WGAPI, { action: 'setvpshost', host: v, old: srvHost })
                            .then(function (j) {
                                if (!j || !j.ok) return (j && j.error) || 'Could not change it.';
                                OS.toast(j.changed + ' tunnel(s) moved. Give them a moment.');
                                return true;
                            });
                    }
                }).then(function (v) { if (v != null) OS.tp.refresh(4000); });
            }));
    }

    /* The admin link is a reading, and this chip is computed from the live
       handshake on EVERY poll — under 3 min "working", under 10 "quiet", past
       that "not working", and "switched off" when the interface is down. It is
       never a fixed label. */
    if (admin) {
        var ap = admin.peer || {};
        var aAge = ap.handshake ? d.ts - ap.handshake : null;
        var ast = hsState(aAge, admin.up, ap.keepalive);
        set.appendChild(statusRow('Admin link',
            OS.chip(ast.t, ast.k === 'ok' ? 'on' : ast.k === 'warn' ? 'warn'
                         : ast.k === 'off' ? 'flat' : 'bad'),
            'How this router is reached for maintenance while you are away, and how the '
            + 'devices above are managed. Last answered ' + agoTxt(aAge) + '.'));
    }

    /* One fold for the whole section. Two would have meant choosing which
       tunnel a reader wanted before they had seen either. */
    var advHost = $('#roadAdv');
    clear(advHost);
    var body = fold(advHost, 'Technical details',
        function () { return wgAdvOpen; }, function (o) { wgAdvOpen = o; });
    if (road) {
        body.appendChild(el('div', 'row__nm', 'Home access'));
        transportKnobs(body, road, road.iface, true);
    }
    if (admin) {
        var h2 = el('div', 'row__nm', 'Admin link');
        h2.style.marginTop = '18px';
        body.appendChild(h2);
        transportKnobs(body, admin, admin.iface, true);
    }
}

loadDevices().then(function () { if (last) { renderDevices(last); renderMap(last); } });
/* 10s, matching the original: vpn-api costs ~310ms of router wall time per
   call, and nothing here changes faster than a handshake interval. */
OS.tp = new OS.Transport(API, render, { interval: 10000 });
OS.tp.start();
})();
</script>
</body>
</html>
