<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>WireGuard — Beryl 7</title>
<link rel="stylesheet" href="/os.css?v=f8e50663">
</head>
<body>
<div class="shell">
  <aside class="spine"></aside>
  <main class="main">
    <div class="topline"></div>

    <header class="head">
      <div>
        <h1 class="head__t">WireGuard</h1>
        <p class="head__s" id="subtitle">Reading the tunnels…</p>
      </div>
      <div class="head__aside" id="headAside" hidden></div>
    </header>

    <div id="alerts"></div>

    <div class="face">
      <div class="grid g2" id="tunGrid">
        <div class="sk" style="width:60%"></div>
      </div>
    </div>

    <div id="roadDevices"></div>

  </main>
</div>
<nav class="mobilebar" aria-label="Sections"></nav>
<script src="/os.js?v=4fcdcf4e"></script>
<script src="/wireguard/qr-vendor.js?v=1"></script>
<script>
(function () {
'use strict';
var $ = OS.$, el = OS.el, setTxt = OS.setTxt, clear = OS.clear;
var API = '/cgi-bin/wireguard-api';

OS.buildShell('/wireguard/');

/* A handshake is the only honest liveness signal a WireGuard tunnel has.
   There is no link state to read: the interface says "up" whether or not the
   far end has ever answered, which is exactly how a dead tunnel looks healthy.
   WireGuard rekeys about every two minutes while traffic flows, so:
     under 3 min  - the far end answered recently
     3 to 10 min  - quiet, which is normal on an idle tunnel with keepalive
     over 10 min  - nothing has come back; treat it as down
   Keepalive shortens the quiet case: with 25 s set, a handshake older than a
   few minutes means the packets are not getting through. */
function hsState(ageSec, up, keepalive) {
    if (!up) return { k: 'off', t: 'interface down' };
    if (!ageSec && ageSec !== 0) return { k: 'fault', t: 'never' };
    if (ageSec < 180) return { k: 'ok', t: 'alive' };
    if (ageSec < 600) return { k: keepalive ? 'warn' : 'ok', t: keepalive ? 'quiet' : 'idle' };
    return { k: 'fault', t: 'stale' };
}

function ago(s) {
    if (s == null) return '—';
    if (s < 60) return s + 's';
    if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
    return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
}

/* The zone still decides which description applies — it is the only thing that
   cannot lie about what a tunnel is for — but the WORDS are the owner's, not
   WireGuard's. "Road warrior", "management" and "VPN exit" are terms of art
   from the protocol's world; nobody looking at this page is asking which of
   those they have. They are asking what each one does for them.

   The heading is the tunnel's own name where it has a meaningful one: two VPN
   providers both titled "VPN exit" were indistinguishable, which is precisely
   the complaint. */
function roleOf(t) {
    if (t.zone === 'road') return {
        k: 'Home access from anywhere',
        d: 'Your phone or laptop joins the home network from outside, as if it were sitting on the home Wi-Fi.'
    };
    if (t.zone === 'mgmt') return {
        k: 'Remote admin link',
        d: 'How this router can be reached for maintenance while you are away.'
    };
    if (t.zone === 'wg') return {
        k: t.label || 'VPN provider',
        d: 'A paid VPN service. Which devices go out through it is set on the VPN page.'
    };
    return { k: t.label || t.iface, d: t.zone ? '' : 'Not in a firewall zone, so it can carry nothing yet.' };
}

/* <dl class="kv"> with dt/dd is the house pattern - os.css styles it as a
   two-column grid that collapses to one column under 700px. An earlier draft
   invented .kv__k / .kv__v, which exist in no stylesheet, so every row would
   have rendered unstyled. Hints go outside the list because a <div> is not
   valid between dt/dd pairs. */
function kvList(box) {
    var dl = el('dl', 'kv');
    box.appendChild(dl);
    return function (k, v, hint) {
        if (v == null || v === '') return;
        dl.appendChild(el('dt', null, k));
        dl.appendChild(el('dd', null, String(v)));
        if (hint) box.appendChild(el('div', 'hint', hint));
    };
}

var panels = {};

function render(d) {
    if (!d || !d.ok) return;
    var tuns = d.tunnels || [];
    var upN = tuns.filter(function (t) { return t.up; }).length;
    var mgmt = tuns.filter(function (t) { return t.zone === 'mgmt'; })[0];

    /* "4 of 4 tunnels up" is a count of a thing nobody counts. The two
       questions this page exists to answer are whether you can get home and
       whether the router can still be reached for repairs — so the subtitle
       answers those, in those words, and says nothing else. */
    function word(t) {
        if (!t) return null;
        if (t.disabled) return 'off';
        var pr = (t.peers || [])[0] || {};
        var a = pr.handshake ? d.ts - pr.handshake : null;
        var s = hsState(a, t.up, pr.keepalive);
        return s.k === 'ok' ? 'working' : s.k === 'warn' ? 'quiet' : 'not working';
    }
    var road = tuns.filter(function (t) { return t.zone === 'road'; })[0];
    var bits = [];
    if (road) bits.push('Home access: ' + word(road));
    if (mgmt) bits.push('remote admin: ' + word(mgmt));
    var vpnUp = tuns.filter(function (t) { return t.zone === 'wg' && t.up; }).length;
    var vpnN = tuns.filter(function (t) { return t.zone === 'wg'; }).length;
    if (vpnN) bits.push(vpnUp + ' of ' + vpnN + ' VPN providers connected');
    setTxt($('#subtitle'), bits.length ? bits.join('  ·  ') : upN + ' of ' + tuns.length + ' connected');

    var grid = $('#tunGrid');
    if (!grid._built) { clear(grid); grid._built = true; }

    /* Ordered by how often a tunnel is actually reached for, not by whatever
       order uci happens to enumerate them in. The road-warrior relay and the
       management path are the two that matter when the owner is away from home
       and cannot fix anything by hand; the commercial VPN exits are set once
       and then left alone, and they were sitting above both. Sorted here rather
       than in the API so panel order and JSON order cannot drift apart. */
    var ZRANK = { road: 0, mgmt: 1, wg: 2 };
    var ordered = tuns.slice().sort(function (a, b) {
        var ra = ZRANK[a.zone], rb = ZRANK[b.zone];
        if (ra === undefined) ra = 9;
        if (rb === undefined) rb = 9;
        if (ra !== rb) return ra - rb;
        return String(a.label || a.iface).localeCompare(String(b.label || b.iface));
    });

    ordered.forEach(function (t) {
        var p = panels[t.iface];
        if (!p) {
            p = panels[t.iface] = { sec: el('section', 'panel') };
            var h = el('div', 'panel__h');
            p.title = el('span', 'panel__t', t.label || t.iface);
            p.chip = el('span', '');
            var aside = el('div', 'panel__aside');
            aside.appendChild(p.chip);
            h.appendChild(p.title); h.appendChild(aside);
            p.sec.appendChild(h);
            p.body = el('div', 'panel__b');
            p.sec.appendChild(p.body);
            grid.appendChild(p.sec);
        }

        var role = roleOf(t);
        setTxt(p.title, role.k);
        clear(p.chip);
        var peer = (t.peers || [])[0] || {};
        var age = peer.handshake ? d.ts - peer.handshake : null;
        var st = hsState(age, t.up, peer.keepalive);
        p.chip.appendChild(OS.chip(st.t, st.k === 'ok' ? 'on' : st.k === 'warn' ? 'warn' : st.k === 'off' ? 'flat' : 'bad'));

        clear(p.body);
        /* One muted line, not a bordered note. Four coloured note boxes on one
           screen stop being read — they become the wallpaper the eye skips.
           This sentence only has to answer "what is this for". */
        if (role.d) p.body.appendChild(el('div', 'hint', role.d));

        var kv = kvList(p.body);
        kv('Last seen', age == null ? 'never' : ago(age) + ' ago');
        if (t.disabled) kv('Switched', 'off in configuration');

        /* Kept in the open because it is the one that asks for an action. */
        if (st.k === 'fault' && t.up) {
            p.body.appendChild(OS.note('Nothing has come back from the far end. For a tunnel that '
                + 'dials out, Re-dial is the only repair possible from this side.', 'warn'));
        }

        /* ---- Re-dial stays in the open ----
           For a stale tunnel this IS the repair, and on the management tunnel
           it is the only one possible from this side. A repair you have to go
           looking for behind a disclosure is a repair you reach late. */
        var actRow = el('div', 'row');
        var redial = el('button', 'btn btn--ghost btn--sm', 'Re-dial');
        redial.style.marginLeft = 'auto';
        actRow.appendChild(redial);
        p.body.appendChild(actRow);

        /* ---- the two knobs that belong to transport, folded away ----
           They are set once and then left alone for months, while the state
           above them is read constantly. Open, they took roughly two thirds of
           every panel's height and printed the same two hint paragraphs once
           per tunnel — four times over on this router. That repetition is what
           made the page read as a wall of identical forms.

           The open state is kept on the panel object because render() rebuilds
           the body on every poll: a <details> that snapped shut every few
           seconds would be worse than one that never opened. Same approach the
           dashboard already uses for its driver counters. */
        var det = document.createElement('details');
        det.className = 'adv';
        /* NO border-top here. .adv>summary already draws one, and setting a
           second on the <details> put two rules a pixel apart — which is
           exactly what it looked like. */
        det.style.marginTop = '10px';
        det.open = !!p.advOpen;
        det.addEventListener('toggle', function () { p.advOpen = det.open; });
        var sum = document.createElement('summary');
        sum.textContent = 'Technical details';
        sum.style.padding = '9px 0';
        det.appendChild(sum);

        var form = el('div', null);

        /* The readings that used to sit on the face of every panel. They are
           real and occasionally needed, but none of them answers a question the
           owner has on a normal day, and eight rows of them per panel is what
           made four tunnels unreadable. */
        var dkv = kvList(form);
        dkv('Interface', t.iface);
        dkv('Server address', (peer.endpoint || '') + (peer.endpoint_port ? ':' + peer.endpoint_port : ''));
        if (peer.endpoint_live && peer.endpoint && peer.endpoint_live.indexOf(peer.endpoint) !== 0) {
            dkv('Currently answering from', peer.endpoint_live);
        }
        dkv('This router’s address on it', t.live_addresses || t.addresses);
        dkv('Carries', peer.allowed_ips === '0.0.0.0/0,::/0'
            ? 'everything (full tunnel)'
            : (peer.allowed_ips || '').split(',').join('   '));
        dkv('Traffic carried', OS.bytes(peer.rx || 0) + ' in   ' + OS.bytes(peer.tx || 0) + ' out');
        if (t.listen_port) dkv('Local port', t.listen_port);
        if (peer.public_key) dkv('Server key', peer.public_key.slice(0, 20) + '…');

        var ka = el('input', 'input'); ka.type = 'number'; ka.min = 0; ka.max = 65535;
        ka.value = peer.keepalive || 0;
        var kaRow = el('div', 'field');
        kaRow.appendChild(el('label', 'label', 'Keepalive (seconds)'));
        kaRow.appendChild(ka);
        kaRow.appendChild(el('div', 'hint',
            t.zone === 'mgmt'
                ? 'Load-bearing here. This router is behind CGNAT, and the keepalive is the only thing holding the mapping open so the far side can reach back. 0 disables it and this tunnel stops answering once the mapping expires.'
                : '0 disables it. 25 is the usual value; it only matters when this side is behind NAT.'));
        form.appendChild(kaRow);

        var mtu = el('input', 'input'); mtu.type = 'number'; mtu.min = 576; mtu.max = 9000;
        mtu.placeholder = 'auto';
        mtu.value = t.mtu || '';
        var mRow = el('div', 'field');
        mRow.appendChild(el('label', 'label', 'MTU'));
        mRow.appendChild(mtu);
        mRow.appendChild(el('div', 'hint',
            'Blank leaves it to the interface. WireGuard adds 60–80 bytes, so a value too high for the underlying link does not fail cleanly — small packets work and large ones vanish, which reads as "SSH is fine but pages hang".'));
        form.appendChild(mRow);

        var row = el('div', 'row');
        var save = el('button', 'btn btn--primary btn--sm', 'Apply');
        row.appendChild(save);
        form.appendChild(row);
        det.appendChild(form);
        p.body.appendChild(det);

        save.addEventListener('click', function () {
            OS.askConfirm('Apply to ' + t.iface,
                'The tunnel is rebuilt to pick this up, so it drops for a second or two. '
                + (t.zone === 'mgmt' ? 'This is the remote-access path: if the new value is wrong, remote access is what breaks.' : ''),
                'Apply').then(function (go) {
                if (!go) return;
                OS.act(save, API, { action: 'setkeepalive', iface: t.iface, value: ka.value },
                       { ok: 'Keepalive applied.', failPrefix: 'Not applied' })
                  .then(function (j) {
                      if (!j || !j.ok) return;
                      return OS.act(save, API, { action: 'setmtu', iface: t.iface, value: mtu.value },
                                    { ok: 'Applied. The tunnel is rebuilding.', delay: 4000, failPrefix: 'MTU not applied' });
                  });
            });
        });

        redial.addEventListener('click', function () {
            OS.askConfirm('Re-dial ' + t.iface,
                'Takes the tunnel down and brings it straight back. '
                + (t.zone === 'mgmt'
                    ? 'This is how a stale management tunnel is repaired — and the only repair possible from this end, since the router is the side that dials.'
                    : 'Devices using this exit lose it for a moment.'),
                'Re-dial').then(function (go) {
                if (!go) return;
                OS.act(redial, API, { action: 'redial', iface: t.iface },
                       { ok: 'Re-dialling.', delay: 5000, failPrefix: 'Could not re-dial' });
            });
        });
    });

    renderRoadDevices(d);
}

/* ---- road-warrior devices: their own section, not a knob on the tunnel
   panel. Their state is not even a uci peer of wgroad (the router's only
   peer there is the VPS) - it lives on the VPS's wg1 and arrives as
   t.road_peers. A row-list this is the one thing the house pattern already
   has a bordered .face for ("dense row-lists that genuinely need
   containment"), so it gets one instead of squeezing into the transport
   panel's plain form. ---- */
var roadUI = null;

/* Built ONCE per device and updated in place on every poll thereafter.
   The first version cleared the list and rebuilt every row each time data
   arrived, which is not merely wasteful: a button that is destroyed and
   recreated every few seconds can swallow the click that lands on it, because
   the element under the cursor is detached before the event resolves. It was
   reproducible — a click on Rename did nothing at all. os.js already exports
   `keyed` for exactly this, and the caller now uses it with the public key as
   the identity. `cur` holds the latest peer so the handlers below always act on
   current data rather than on whatever was true when the row was created. */
function deviceRow(t, rp, d) {
    var cur = rp;
    var row = el('div', 'row row--pick');
    row.style.cursor = 'default';

    var id = el('div', 'row__id');
    /* A generic device glyph, not a phone. Half of what gets added here is a
       laptop or a tablet, and a phone icon beside "iPad" is just wrong. */
    var ic = el('div', 'row__ico'); ic.appendChild(OS.icon('dev'));
    id.appendChild(ic);
    var title = el('div', 'row__title');
    var nm = el('span', 'row__nm', '');
    var chipBox = el('span', '');
    title.appendChild(nm);
    title.appendChild(chipBox);
    var subEl = el('div', 'row__sub', '');
    var idText = el('div', null);
    idText.appendChild(title);
    idText.appendChild(subEl);
    id.appendChild(idText);
    row.appendChild(id);

    /* Transfer comes from the relay's wg dump, where a peer's rx is what the
       hub RECEIVED from that device — so rx is the device's upload. Confirmed
       against nlbwmon, which independently accounts 10.99.104.3 with the same
       lopsided shape. Shown because this is the one place the number answers a
       real question: which device is spending the home connection. */
    row._update = function (p2, d2) {
        cur = p2;
        setTxt(nm, p2.name);
        var age = p2.handshake ? d2.ts - p2.handshake : null;
        var st = hsState(age, true, 25);
        clear(chipBox);
        chipBox.appendChild(OS.chip(age == null ? 'never connected' : ago(age) + ' ago',
                                    st.k === 'ok' ? 'on' : st.k === 'warn' ? 'warn' : 'flat'));
        var sub = p2.address;
        if (p2.rx || p2.tx) {
            sub += ' · ↑ ' + OS.bytes(p2.rx || 0) + ' · ↓ ' + OS.bytes(p2.tx || 0);
        }
        setTxt(subEl, sub);
    };
    row._update(rp, d);

    var acts = el('div', null);
    acts.style.cssText = 'display:flex;gap:6px';
    var rename = el('button', 'btn btn--ghost btn--sm', 'Rename');
    var revoke = el('button', 'btn btn--danger btn--sm', 'Revoke');
    acts.appendChild(rename);
    acts.appendChild(revoke);
    row.appendChild(acts);

    /* The name is stored on THIS router, keyed by the device's public key, and
       the relay is never told. It has no rename endpoint — it answers 404 to
       every spelling of one — and a name held only on the VPS would be lost
       with the VPS. Renaming therefore changes a label and nothing else: the
       device keeps its key, its address and its connection. */
    rename.addEventListener('click', function (e) {
        e.stopPropagation();
        OS.dialog({
            title: 'Rename this device',
            body: 'Only the label here changes. The device keeps working and does not need setting up again.',
            field: { label: 'Name', value: cur.name, placeholder: 'e.g. iPad', emptyMsg: 'Give it a name.' },
            okText: 'Save',
            onSubmit: function (v) {
                return OS.post(API, { action: 'setdevicename', iface: t.iface,
                                      public_key: cur.public_key, name: v }).then(function (j) {
                    if (!j || !j.ok) return (j && j.error) || 'Could not rename it.';
                    return true;
                });
            }
        }).then(function (v) { if (v != null) OS.tp.refresh(300); });
    });

    revoke.addEventListener('click', function (e) {
        e.stopPropagation();
        OS.askConfirm('Revoke ' + cur.name,
            'This device loses access immediately, and its config cannot be handed back — '
            + 'reconnecting means adding it again and scanning a new code.',
            'Revoke', true).then(function (go) {
            if (!go) return;
            OS.act(revoke, API, { action: 'delpeer', iface: t.iface, public_key: cur.public_key },
                   { ok: 'Revoked.', failPrefix: 'Could not revoke' });
        });
    });
    return row;
}

/* Two dialogs in sequence, not one crowded form: naming a device is a
   different task from scanning its QR, and finishing the first cleanly
   before the second appears is what makes each one feel like one job. */
/* What the two routing modes mean, in the terms the decision is actually made
   in — battery and trust — rather than in AllowedIPs values nobody weighs up
   while standing in an airport. */
var ROUTE_HINT = {
    lan: 'Only traffic for the home network goes through the tunnel. The device '
       + 'keeps its own connection for everything else, so the battery cost is '
       + 'close to nothing. This is the right default.',
    all: 'Every packet goes through the house, DNS included — so AdGuard filters '
       + 'this device too, and sites see your home address. Worth switching to on '
       + 'Wi-Fi you do not trust. It is slower, and it spends the home upload.'
};

function addDeviceFlow(t) {
    var newConfig = null;
    var route = 'lan';

    var body = el('div', 'stack');
    body.appendChild(el('div', null,
        'It gets LAN-equivalent access — the same reach as being on the home Wi-Fi.'));

    var lab = el('div', null);
    lab.appendChild(el('div', 'row__nm', 'What goes through the tunnel'));
    var hint = el('div', 'hint', ROUTE_HINT[route]);
    hint.style.marginTop = '4px';

    var seg = el('div', 'seg');
    seg.style.marginTop = '8px';
    var segBtns = [];
    [['lan', 'Home network only'], ['all', 'Everything through home']].forEach(function (o) {
        var b = el('button', 'btn btn--sm', o[1]);
        /* Explicitly type=button: this sits inside the dialog's form, and a
           default submit would add the device the moment a mode is picked. */
        b.type = 'button';
        b.setAttribute('aria-pressed', o[0] === route ? 'true' : 'false');
        b.addEventListener('click', function () {
            route = o[0];
            segBtns.forEach(function (x) {
                x.b.setAttribute('aria-pressed', x.k === route ? 'true' : 'false');
            });
            setTxt(hint, ROUTE_HINT[route]);
        });
        segBtns.push({ k: o[0], b: b });
        seg.appendChild(b);
    });
    lab.appendChild(seg);
    lab.appendChild(hint);
    body.appendChild(lab);

    OS.dialog({
        title: 'Add device',
        body: body,
        field: { label: 'Device name', placeholder: 'e.g. iPhone', emptyMsg: 'Name this device.' },
        okText: 'Add device',
        onSubmit: function (name) {
            return OS.post(API, { action: 'addpeer', iface: t.iface, name: name, route: route }).then(function (j) {
                if (!j || !j.ok) return (j && j.error) || 'Could not add the device.';
                newConfig = j;
                return true;
            });
        }
    }).then(function (v) {
        if (v == null || !newConfig) return;
        OS.tp.refresh(300);
        var body = el('div', 'stack');
        if (window.UQR) {
            var qr = el('div', null);
            qr.style.cssText = 'max-width:220px;margin:0 auto';
            qr.innerHTML = window.UQR.renderSVG(newConfig.config, { pixelSize: 4 });
            body.appendChild(qr);
        }
        var ta = el('textarea', 'ta n');
        ta.readOnly = true;
        ta.value = newConfig.config;
        ta.addEventListener('click', function () { ta.select(); });
        body.appendChild(ta);
        /* Which mode this config carries is stated here because it is baked
           into the file and cannot be read back off the device later - the
           router never learns what a client did with its AllowedIPs. */
        body.appendChild(el('div', 'hint',
            (route === 'all' ? 'Everything through home. ' : 'Home network only. ')
            + 'Shown once and not stored anywhere — scan it in the WireGuard app, '
            + 'or copy the text, before closing this.'));
        OS.dialog({ title: newConfig.name, body: body, okText: 'Done', cancelText: 'Close' });
    });
}

function renderRoadDevices(d) {
    var host = $('#roadDevices');
    var headAside = $('#headAside');
    var t = (d.tunnels || []).filter(function (t) { return t.zone === 'road'; })[0];
    if (!t) { clear(host); headAside.hidden = true; roadUI = null; return; }

    if (!roadUI) {
        roadUI = {};
        /* The primary action lives in the page header, not a section aside
           further down — the same slot VPN's "Add tunnel" docks into, so a
           road-warrior device is never more than one reach away, and the
           header is never left with nothing in its action slot on a phone. */
        roadUI.addBtn = el('button', 'btn btn--primary');
        roadUI.addBtn.appendChild(OS.icon('plus'));
        roadUI.addBtn.appendChild(document.createTextNode('Add device'));
        headAside.appendChild(roadUI.addBtn);
        headAside.hidden = false;

        var sect = el('div', 'sect');
        sect.appendChild(el('div', 'sect__t', 'Your devices'));
        roadUI.count = el('div', 'sect__m');
        sect.appendChild(roadUI.count);
        host.appendChild(sect);
        /* Rows and empty states live in separate boxes so the keyed row list is
           never cleared out from under itself when an empty state is drawn. */
        roadUI.face = el('div', 'face');
        roadUI.rows = el('div', null);
        roadUI.empty = el('div', null);
        roadUI.face.appendChild(roadUI.rows);
        roadUI.face.appendChild(roadUI.empty);
        host.appendChild(roadUI.face);

        /* Two controls the feature shipped without. Neither is exotic: one
           turns it off, and one is what you need on the day the VPS is
           renumbered — which is the day nothing works and nothing explains
           why. */
        roadUI.ctl = el('div', 'row');
        roadUI.ctl.style.marginTop = '10px';
        roadUI.power = el('button', 'btn btn--sm');
        roadUI.moveBtn = el('button', 'btn btn--ghost btn--sm', 'Server moved…');
        roadUI.moveBtn.style.marginLeft = 'auto';
        roadUI.ctl.appendChild(roadUI.power);
        roadUI.ctl.appendChild(roadUI.moveBtn);
        host.appendChild(roadUI.ctl);
    }
    roadUI.addBtn.onclick = function () { addDeviceFlow(t); };

    var off = !!t.disabled;
    var srvHost = ((t.peers || [])[0] || {}).endpoint || '';

    setTxt(roadUI.power, off ? 'Turn home access on' : 'Turn home access off');
    roadUI.power.className = 'btn btn--sm' + (off ? ' btn--primary' : '');
    roadUI.power.onclick = function () {
        OS.askConfirm(off ? 'Turn home access on' : 'Turn home access off',
            off ? 'Your devices will be able to reach the home network again.'
                : 'Every device below loses its way in until this is turned back on. '
                  + 'Remote admin is a separate tunnel and is not affected.',
            off ? 'Turn on' : 'Turn off', !off).then(function (go) {
            if (!go) return;
            OS.act(roadUI.power, API, { action: 'settunnel', iface: t.iface, state: off ? 'on' : 'off' },
                   { ok: off ? 'Home access on.' : 'Home access off.', delay: 3000,
                     failPrefix: 'Could not change it' });
        });
    };

    /* Modelled as "the server moved", not "edit this field", because that is
       the event — and because editing one tunnel's endpoint is the shape that
       locks you out. The admin tunnel points at the SAME host; change only the
       home one and the way back in is the thing left broken. The API moves
       every peer aimed at the old address together, so the two cannot drift. */
    roadUI.moveBtn.onclick = function () {
        OS.dialog({
            title: 'The relay server moved',
            body: el('div', 'hint',
                'Enter its new address. Every tunnel pointing at ' + (srvHost || 'the old address')
                + ' moves with it — including the remote admin link, which uses the same server. '
                + 'Get this wrong while you are away and there is no way back in until you are home.'),
            field: { label: 'New address or hostname', value: srvHost,
                     placeholder: 'e.g. vps.example.com', emptyMsg: 'Enter the new address.' },
            okText: 'Move it',
            danger: true,
            onSubmit: function (v) {
                if (v === srvHost) return 'That is the address it already uses.';
                return OS.post(API, { action: 'setvpshost', host: v, old: srvHost }).then(function (j) {
                    if (!j || !j.ok) return (j && j.error) || 'Could not change it.';
                    OS.toast(j.changed + ' tunnel(s) moved. Give them a moment to reconnect.');
                    return true;
                });
            }
        }).then(function (v) { if (v != null) OS.tp.refresh(4000); });
    };

    var peers = t.road_peers || [];
    var down = t.road_relay === 'down';

    /* "Cannot see the devices" and "there are no devices" are opposite facts,
       and an empty list alone cannot tell them apart. Drawing the empty state
       for both was the page's worst bug: it stated something false, and it
       offered an Add button that could only fail - at exactly the moment the
       owner is away from home and needs to know which of the two it is. */
    roadUI.addBtn.disabled = down || off;
    roadUI.addBtn.title = off ? 'Home access is switched off.'
                        : down ? 'The relay server is not answering.' : '';

    setTxt(roadUI.count, off ? 'switched off'
        : down ? 'cannot reach the server'
        : peers.length ? peers.length + (peers.length === 1 ? ' device' : ' devices') : '');

    clear(roadUI.empty);
    var rows = OS.keyed(roadUI.rows);
    if (off) {
        /* Checked before the unreachable case: with the tunnel down the server
           is SUPPOSED to be unreachable, and reporting that as a fault would
           send the owner hunting for a problem they created on purpose. */
        roadUI.empty.appendChild(OS.emptyState('Home access is switched off',
            'No device can reach the home network from outside right now. '
            + 'Turn it back on below — the devices you already added are kept.', 'power'));
    } else if (down) {
        roadUI.empty.appendChild(OS.emptyState('Cannot reach the relay server',
            'Your devices are held on the server, and this page reaches it over the '
            + 'remote admin link. They may well still be connected — this page just '
            + 'cannot see them. Check that the remote admin link above says it was '
            + 'seen recently; if it did, the fault is on the server itself.', 'alert'));
    } else if (!peers.length) {
        roadUI.empty.appendChild(OS.emptyState('No devices yet',
            'Add your phone or laptop to reach this network from anywhere.', 'dev'));
    } else {
        /* want() builds a row the first time it sees a key and hands back the
           existing node afterwards, so the buttons keep their identity across
           polls and a click can actually land. commit() removes rows for peers
           that are gone — which is also what clears the list when an empty
           state is showing, since nothing was wanted this pass. */
        peers.forEach(function (rp) {
            var w = rows.want(rp.public_key, function () { return deviceRow(t, rp, d); });
            if (!w.fresh) w.node._update(rp, d);
        });
    }
    rows.commit();
}

/* Handshake age is the whole point of this page and it moves every second, so
   this polls faster than the config pages — but not so fast that `wg show` runs
   constantly for a number that only changes meaningfully every two minutes. */
OS.tp = new OS.Transport(API, render, { interval: 6000 });
OS.tp.start();
})();
</script>
</body>
</html>
