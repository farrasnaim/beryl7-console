<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beryl 7 — Repeater</title>
<script>
(function(){try{var t=localStorage.getItem('theme');
if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}
document.documentElement.setAttribute('data-theme',t);}
catch(e){document.documentElement.setAttribute('data-theme','dark');}})();
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{position:relative;min-height:100vh;background:var(--bg);color:var(--fg);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;padding:20px 18px 60px;max-width:1120px;margin:0 auto}
body::before{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;
  background-repeat:no-repeat;
  background-image:radial-gradient(1000px 560px at center,var(--tint1),transparent 60%),
                   radial-gradient(900px 520px at center,var(--tint2),transparent 60%);
  background-position:15% -10%,92% 105%;animation:drift1 26s ease-in-out infinite alternate}
@keyframes drift1{0%{background-position:15% -10%,92% 105%}50%{background-position:27% 2%,80% 92%}
  100%{background-position:8% -18%,97% 112%}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:4px}
h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0}
.hmeta{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:7px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--ok);cursor:pointer;
  box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pl 2.4s infinite}
.pulse.off{background:var(--bad);animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}
  70%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 0%,transparent)}
  100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 0%,transparent)}}
nav{display:flex;gap:14px;margin:14px 0 4px;font-size:12.5px}
nav a{color:var(--mut);text-decoration:none;padding-bottom:4px;border-bottom:1.5px solid transparent}
nav a:hover{color:var(--fg)}
nav a.on{color:var(--fg);border-bottom-color:var(--accent-hi);font-weight:600}

h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--mut);margin:24px 0 9px}
.panel{position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:13px;padding:15px;overflow:hidden}
.panel.acc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--cardline,var(--dim));opacity:.6}
.st{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stname{font-size:15px;font-weight:600}
.state{font-size:9px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:5px;
  border:1px solid var(--border);color:var(--mut)}
.state.up{color:var(--ok-fg);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.state.dn{color:var(--dim)}
.state.warn{color:var(--warn-fg);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.trow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0}
.trow .tk{color:var(--dim)}
.trow .tv{font-variant-numeric:tabular-nums;text-align:right;word-break:break-all}
.btns{display:flex;gap:7px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap}
.btn{font:inherit;font-size:11.5px;font-weight:600;color:var(--fg);
  background:var(--surface2);border:1px solid var(--border);border-radius:7px;
  padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent-hi)}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.primary{background:var(--accent-hi);color:var(--bg);border-color:var(--accent-hi)}

.nets{display:grid;gap:0}
.net{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  padding:9px 2px;border-top:1px solid var(--border);cursor:pointer}
.net:first-child{border-top:0}
.net:hover{background:var(--surface2)}
.nssid{font-size:13px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nmeta{font-size:10.5px;color:var(--dim);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.nsig{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.lock{font-size:10px;color:var(--dim)}
label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:11px}
input,select{display:block;width:100%;margin-top:5px;font:inherit;font-size:13px;
  color:var(--fg);background:var(--surface2);border:1px solid var(--border);
  border-radius:7px;padding:8px 9px}
.hint{font-size:11px;color:var(--dim);margin-top:3px;line-height:1.45}
.msg{font-size:11.5px;min-height:1.2em;margin-top:9px}
.msg.ok{color:var(--ok-fg)}.msg.err{color:var(--bad)}
.empty{color:var(--mut);font-size:13.5px;padding:20px 0}
.failnote{display:flex;align-items:flex-start;gap:12px;font-size:12px;color:var(--bad);
  background:color-mix(in srgb,var(--bad) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:11px;
  padding:11px 13px;margin-bottom:10px;line-height:1.5}
.failnote span{flex:1;min-width:0}
.failnote .btn{flex-shrink:0;padding:5px 10px}
.note{font-size:11.5px;color:var(--warn-fg);background:color-mix(in srgb,var(--warn) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);border-radius:9px;
  padding:9px 11px;margin-bottom:14px;line-height:1.5}
@media (max-width:520px){body{padding:16px 13px 46px}}
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<header class="appbar">
  <div class="appbar__brand">
    <span class="nav__dot" id="pulse"></span>
    <span class="appbar__name"><span class="t-long">GL.iNet Beryl 7 🔱</span><span class="t-short">Beryl 7 🔱</span></span>
  </div>
  <div class="appbar__tools">
    <span class="nav__status" id="stamp">connecting…</span>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle colour theme" title="Toggle light / dark">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<nav class="tabbar" aria-label="Sections">
  <a class="tabbar__item" href="/dashboard/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.7V21h14V9.7"/></svg><span>Home</span></a>
  <a class="tabbar__item" href="/vpn/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5.2c0 4.3-2.9 7.9-7 9.8-4.1-1.9-7-5.5-7-9.8V6z"/><path d="m9.2 11.8 2 2 3.6-3.9"/></svg><span>VPN</span></a>
  <a class="tabbar__item is-active" aria-current="page" href="/repeater/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.8a11 11 0 0 1 15 0"/><path d="M7.6 14.9a7 7 0 0 1 8.8 0"/><circle cx="12" cy="18.4" r="1.5" fill="currentColor" stroke="none"/></svg><span>Repeater</span></a>
  <a class="tabbar__item" href="/tethering/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7h2.5a5 5 0 0 1 0 10H15"/><path d="M9 7H6.5a5 5 0 0 0 0 10H9"/><path d="M8.5 12h7"/></svg><span>Tethering</span></a>
</nav>
<div class="pagehead"><h1 class="pagetitle">Repeater</h1><p class="pagesub">Use another Wi-Fi network as this router's internet</p></div>

<h2>Uplink Status</h2>
<div class="failnote" id="connErr" style="display:none">
  <span id="connErrTxt"></span>
  <button class="btn" id="connErrDismiss">Dismiss</button>
</div>
<div id="status"><div class="empty">Loading…</div></div>

<h2>Nearby Networks</h2>
<div class="panel">
  <div class="hint" id="scanNote" style="margin-bottom:10px">Scans both bands. Tap a network to
    fill in the form below — the matching radio is selected automatically.</div>
  <button class="btn" id="scanBtn">Scan for Networks</button>
  <div class="msg" id="scanMsg"></div>
  <div class="nets" id="nets"></div>
</div>

<h2>Join a Network</h2>
<div class="panel">
  <label>Network name (SSID)
    <input id="ussid" placeholder="Hotel-Guest-WiFi" autocomplete="off">
    <div class="hint">Choose a network above, or enter its name.</div>
  </label>
  <label>Security
    <select id="uenc">
      <option value="psk">WPA/WPA2</option>
      <option value="none">None (open network)</option>
    </select>
  </label>
  <label>Wi-Fi password<input type="password" id="ukey" autocomplete="off"></label>
  <label>Radio
    <select id="uband">
      <option value="2">2.4 GHz (recommended)</option>
      <option value="5">5 GHz</option>
    </select>
    <div class="hint">This radio joins the network. The other keeps serving your own devices.</div>
  </label>
  <button class="btn primary" id="connBtn">Connect</button>
  <div class="msg" id="connMsg"></div>
</div>

<script>
(function(){
var API='/cgi-bin/repeater-api';
var pulse=document.getElementById('pulse'), stamp=document.getElementById('stamp'), S=null;

(function(){
  var tbtn=document.getElementById('themeToggle');
  var media=window.matchMedia?window.matchMedia('(prefers-color-scheme: light)'):null;
  function current(){
    return document.documentElement.getAttribute('data-theme')
        || ((media&&media.matches)?'light':'dark');
  }
  if(tbtn) tbtn.addEventListener('click',function(){
    var next = current()==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem('theme',next); }catch(e){}
  });
})();
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function post(b){return fetch(API,{method:'POST',cache:'no-store',
  headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b})
  .then(function(r){return r.json();});}

function renderStatus(){
  var box=document.getElementById('status');
  if(!S){box.innerHTML='<div class="empty">Loading…</div>';return;}
  // failure notice from the connect watchdog, and the in-progress state
  var errEl=document.getElementById('connErr');
  if(S.has_default_route===false){
    // No route off-subnet = no internet for every client. What to DO about it
    // depends entirely on whether there's a cable, so say the right thing.
    errEl.style.display='';
    document.getElementById('connErrTxt').textContent = (S.wan_carrier===false)
      ? 'No internet: no Ethernet cable is connected and no Wi-Fi uplink is up. '+
        'Scan below and connect to a network to get back online.'
      : 'No default route — Ethernet is connected but the router has no path to the internet. '+
        'Reconnect an uplink, or run "ifup wan" on the router.';
  } else if(S.last_error){
    errEl.style.display=''; document.getElementById('connErrTxt').textContent=S.last_error;
  } else errEl.style.display='none';
  if(S.connecting){
    box.innerHTML='<div class="panel acc" style="--cardline:var(--warn)">'+
      '<div class="st"><span class="stname">Connecting…</span>'+
      '<span class="state warn">TRYING</span></div>'+
      '<div class="hint">Waiting for an IP address. If nothing comes back within '+
      (S.connect_timeout||20)+' seconds the attempt is cancelled and the Ethernet WAN is restored.</div></div>';
    return;
  }
  var u=S.uplink, viaWwan=(S.default_route_dev||'').indexOf('eth')!==0;
  // Built HERE, before the early return below. `var` hoists the declaration but
  // not the value, so defining it further down made the "no uplink" branch
  // concatenate the string "undefined" into the panel.
  var iot=S.iot_ssid||{};
  var iotRow=iot.name
    ? '<div class="trow"><span class="tk">IoT SSID "'+esc(iot.name)+'"</span><span class="tv">'+
      (iot.enabled?'on':'off — auto-disabled while travelling')+'</span></div>'
    : '';
  if(!u.configured){
    box.innerHTML='<div class="panel acc" style="--cardline:var(--dim)">'+
      '<div class="st"><span class="stname">No uplink configured</span>'+
      '<span class="state dn">OFF</span></div>'+
      '<div class="trow"><span class="tk">Internet source</span>'+
      '<span class="tv">Ethernet WAN ('+esc(S.default_route_dev||'—')+')</span></div>'+
      iotRow+
      '<div class="hint" style="margin-top:8px">Scan below and connect to a network when travelling. '+
      'Your own Wi-Fi keeps broadcasting either way, and the IoT SSID switches off automatically '+
      'while an uplink is connected.</div></div>';
    return;
  }
  var live=u.connected&&S.wwan.up;
  var badge=live?'<span class="state up">CONNECTED</span>':
    (u.enabled?'<span class="state warn">'+(u.connected?'ASSOCIATED · NO IP':'CONNECTING…')+'</span>'
              :'<span class="state dn">DISABLED</span>');
  box.innerHTML='<div class="panel acc" style="--cardline:'+(live?'var(--ok)':'var(--warn)')+'">'+
    '<div class="st"><span class="stname">'+esc(u.ssid)+'</span>'+badge+'</div>'+
    '<div class="trow"><span class="tk">Radio</span><span class="tv">'+
      (u.radio==='radio1'?'5 GHz':'2.4 GHz')+'</span></div>'+
    '<div class="trow"><span class="tk">Security</span><span class="tv">'+esc(u.encryption||'—')+'</span></div>'+
    (u.connected?'<div class="trow"><span class="tk">Signal</span><span class="tv">'+u.signal+' dBm</span></div>'+
      '<div class="trow"><span class="tk">BSSID</span><span class="tv">'+esc(u.bssid)+'</span></div>':'')+
    '<div class="trow"><span class="tk">Uplink IP</span><span class="tv">'+esc(S.wwan.ip||'— (no lease)')+'</span></div>'+
    '<div class="trow"><span class="tk">Active route</span><span class="tv">'+
      (viaWwan?'via Wi-Fi uplink':'via Ethernet WAN')+'</span></div>'+
    iotRow+
    '<div class="btns">'+
      '<button class="btn" data-act="'+(u.enabled?'down':'up')+'">'+(u.enabled?'Disable':'Enable')+'</button>'+
      '<button class="btn danger" data-act="del">Remove Uplink</button>'+
    '</div></div>';
}

document.getElementById('status').addEventListener('click',function(e){
  var b=e.target.closest('button[data-act]'); if(!b)return;
  var act=b.getAttribute('data-act');
  if(act==='del'){
    if(!confirm('Remove the Wi-Fi uplink? The router falls back to the Ethernet WAN.'))return;
    b.disabled=true;
    post('action=del')
      .then(function(j){ if(!j.ok)alert('Failed: '+(j.error||'unknown')); setTimeout(load,3000); })
      .catch(function(){alert('Could not reach the router.');b.disabled=false;});
  } else {
    b.disabled=true; b.textContent='…';
    post('action='+act)
      .then(function(j){ if(!j.ok)alert('Failed: '+(j.error||'unknown')); setTimeout(load,4000); })
      .catch(function(){alert('Could not reach the router.');b.disabled=false;});
  }
});

document.getElementById('connErrDismiss').addEventListener('click',function(){
  document.getElementById('connErr').style.display='none';
  post('action=clearerr').then(load).catch(function(){});
});

document.getElementById('scanBtn').addEventListener('click',function(){
  var b=this, msg=document.getElementById('scanMsg'), box=document.getElementById('nets');
  b.disabled=true; msg.className='msg'; msg.textContent='Scanning…'; box.innerHTML='';
  fetch(API+'?action=scan',{cache:'no-store'}).then(function(r){return r.json();})
    .then(function(j){
      b.disabled=false;
      var res=(j.scan&&j.scan.results)||[];
      if(!res.length){ msg.className='msg err'; msg.textContent='No networks found.'; return; }
      res.sort(function(x,y){return (y.signal||-99)-(x.signal||-99);});
      msg.className='msg ok'; msg.textContent=res.length+' network'+(res.length===1?'':'s')+' found.';
      box.innerHTML=res.map(function(n){
        var enc=(n.encryption&&n.encryption.enabled)?'🔒':'';
        var ss=n.ssid||'(hidden)';
        var band=(n.mhz>5000)?'5':'2';           // drives the radio auto-select
        var bandTxt=(n.mhz>5000)?'5 GHz':'2.4 GHz';
        return '<div class="net" data-ssid="'+esc(ss)+'" data-enc="'+(enc?'psk':'none')+'"'+
          ' data-band="'+band+'">'+
          '<div><div class="nssid">'+esc(ss)+' <span class="lock">'+enc+'</span></div>'+
          '<div class="nmeta">'+esc(n.bssid||'')+' · '+bandTxt+' ch'+(n.channel||'?')+'</div></div>'+
          '<div class="nsig">'+(n.signal||0)+' dBm</div>'+
          '<div class="nsig">'+Math.round((n.quality||0)/(n.quality_max||100)*100)+'%</div></div>';
      }).join('');
    })
    .catch(function(){ b.disabled=false; msg.className='msg err'; msg.textContent='Scan failed.'; });
});

document.getElementById('nets').addEventListener('click',function(e){
  var n=e.target.closest('.net'); if(!n)return;
  document.getElementById('ussid').value=n.getAttribute('data-ssid');
  document.getElementById('uenc').value=n.getAttribute('data-enc');
  // pick the radio that can actually reach this AP's band
  var b=n.getAttribute('data-band');
  if(b) document.getElementById('uband').value=(b==='5'?'5':'2');
  document.getElementById('ukey').focus();
  document.getElementById('ussid').scrollIntoView({behavior:'smooth',block:'center'});
});

document.getElementById('connBtn').addEventListener('click',function(){
  var ssid=document.getElementById('ussid').value.trim(),
      key=document.getElementById('ukey').value,
      enc=document.getElementById('uenc').value,
      band=document.getElementById('uband').value,
      msg=document.getElementById('connMsg'), btn=this;
  if(!ssid){msg.className='msg err';msg.textContent='SSID is required.';return;}
  if(enc!=='none'&&!key){msg.className='msg err';msg.textContent='Wi-Fi password is required.';return;}
  // Single PHY: the radio joining the uplink must follow the uplink's channel, so
  // its own AP moves with it and clients on that band drop briefly. Say which band
  // stays untouched, and that both bands share one network name so devices hop
  // across on their own — otherwise this reads as "you are about to lose Wi-Fi".
  var joinTxt =(band==='5')?'5 GHz':'2.4 GHz',
      otherTxt=(band==='5')?'2.4 GHz':'5 GHz';
  if(!confirm('Connect the '+joinTxt+' radio to "'+ssid+'"?\n\n'+
    'Your '+joinTxt+' Wi-Fi moves to that network\'s channel, so devices on it drop for a few '+
    'seconds. They reconnect on their own — both your bands share one network name, so phones '+
    'simply hop to '+otherTxt+'.\n\n'+
    'Your '+otherTxt+' Wi-Fi is not touched and stays reachable the whole time, so you keep '+
    'access to this page.'))return;
  btn.disabled=true; msg.className='msg'; msg.textContent='Configuring uplink…';
  post('action=add&ssid='+encodeURIComponent(ssid)+
       '&key='+encodeURIComponent(key)+'&enc='+encodeURIComponent(enc)+'&band='+encodeURIComponent(band))
    .then(function(j){
      btn.disabled=false;
      msg.className='msg '+(j.ok?'ok':'err');
      msg.textContent=j.ok?('Uplink set to "'+j.ssid+'". Connecting…'):('Failed: '+(j.error||'unknown'));
      if(j.ok){ document.getElementById('ukey').value=''; setTimeout(load,5000); }
    })
    .catch(function(){btn.disabled=false;msg.className='msg err';
      msg.textContent='Could not reach the router.';});
});

function load(){
  fetch(API,{cache:'no-store'}).then(function(r){return r.json();})
    .then(function(j){ if(!j.ok)throw 0; S=j; pulse.classList.remove('off');
      stamp.textContent='updated '+new Date().toLocaleTimeString(); renderStatus(); })
    .catch(function(){ pulse.classList.add('off'); stamp.textContent='connection lost'; });
}
load(); setInterval(load,8000);
})();
</script>
</body>
</html>
