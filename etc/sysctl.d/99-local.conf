# Local tunables added 2026-08-08 (config assessment)
# Recover from PMTU black holes common on hotel/captive networks and over the
# 1420-MTU WireGuard tunnel, instead of stalling on oversized segments.
net.ipv4.tcp_mtu_probing=1

# nlbwmon asks for a 512 KB netlink buffer to dump conntrack, but the kernel
# clamps SO_RCVBUF to net.core.rmem_max — which defaults to 208 KB here. The
# dump then overflows and nlbwmon logs "No buffer space available", losing that
# whole 30s window of accounting. Raise the ceiling so the request is honoured.
net.core.rmem_max=4194304
